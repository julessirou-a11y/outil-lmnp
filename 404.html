<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page introuvable · Le Carnet</title>
<link rel="icon" href="/outil-lmnp/icone-512.png">
<style>
:root{--bg:#F6F3F5;--surface:#FFFFFF;--text:#2B1822;--muted:#6B5E67;--line:#ECE4E9;--accent:#6D466B;--accent-ink:#FFFFFF;color-scheme:light dark}
@media (prefers-color-scheme: dark){:root{--bg:#161015;--surface:#1F171D;--text:#F1EAEF;--muted:#B5A8B1;--line:#3A2E36;--accent:#B49FCC;--accent-ink:#2A1520}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:420px;width:100%;padding:32px 28px;background:var(--surface);border:1px solid var(--line);border-radius:14px;text-align:center}
img{width:64px;height:64px;border-radius:14px}
h1{font-size:20px;margin:16px 0 6px}
p{color:var(--muted);margin:0 0 22px}
a{display:inline-block;padding:10px 18px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-weight:600;text-decoration:none}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="/outil-lmnp/icone-512.png" alt="Logo du Carnet">
  <h1>Cette page n'existe pas</h1>
  <p>Le lien est peut-être ancien ou incomplet. Le Carnet tient sur une seule page.</p>
  <a href="/outil-lmnp/">Ouvrir Le Carnet</a>
</main>
</body>
</html>
