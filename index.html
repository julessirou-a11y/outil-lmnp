<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carnet LMNP</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232F4BB8'/%3E%3Cpath d='M9 22V13l7-5 7 5v9h-5v-5h-4v5z' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --surface-2:#F7F8FA; --text:#1B2430; --muted:#5F6B7A; --faint:#8C96A3;
  --line:#E3E7EC; --accent:#2F4BB8; --accent-ink:#FFFFFF; --accent-soft:#E9EDFA;
  --pos:#157A57; --pos-soft:#E3F3EC; --neg:#B83A2B; --neg-soft:#FBE9E6; --warn:#8F5B00; --warn-soft:#FFF3DA;
  --seg-1:#AEB8C6; --seg-2:#C9D1DB; --seg-3:#8592A3;
  --r-lg:14px; --r-md:9px; --r-sm:6px;
  --font:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#101318; --surface:#181C23; --surface-2:#1E232B; --text:#E7EAF0; --muted:#A0A9B6; --faint:#77808D;
  --line:#2A303A; --accent:#93A6FF; --accent-ink:#0F1530; --accent-soft:#232B48;
  --pos:#5FD0A0; --pos-soft:#17302A; --neg:#F08A7C; --neg-soft:#3A201D; --warn:#E9B65C; --warn-soft:#33291A;
  --seg-1:#4A5463; --seg-2:#394150; --seg-3:#5E6979; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:15px/1.55 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- Mise en page : menu latéral ---------- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh;background:linear-gradient(90deg,var(--surface) 247px,var(--line) 247px 248px,var(--bg) 248px)}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;padding:20px 14px;background:var(--surface);border-right:1px solid var(--line);overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.brand svg{flex:none}
.brand b{display:block;font-size:16px;font-weight:600;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:12.5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px}
.yearbox{padding:0 6px}
.yearbox select{width:100%;font-weight:600}
.menu{display:flex;flex-direction:column;gap:2px}
.menu button{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border:0;border-radius:var(--r-md);background:none;color:var(--muted);font:inherit;font-size:14.5px;text-align:left;cursor:pointer}
.menu button svg{flex:none;opacity:.85}
.menu button:hover{background:var(--surface-2);color:var(--text)}
.menu button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.menu .sep{height:1px;background:var(--line);margin:8px 10px}
.menu .grp{margin:14px 10px 4px;font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--faint)}
.badge{margin-left:auto;min-width:22px;padding:0 7px;border-radius:99px;background:var(--warn-soft);color:var(--warn);font-size:12px;font-weight:600;text-align:center;line-height:20px}
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:0 6px}
.status{font-size:12.5px;color:var(--muted);min-height:18px}
.status.warn{color:var(--warn)}
.prefs{display:flex;gap:6px}
.prefs button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);font:inherit;font-size:12.5px;padding:5px 6px;border-radius:var(--r-md);cursor:pointer}
.prefs button:hover{color:var(--text)}
.prefs button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.todo ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:4px}
.todo li{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line)}
.todo li:last-child{border-bottom:0}
.todo li{flex-wrap:wrap}
.todo li>b{width:14px;flex:none;text-align:center}
.todo li>span{flex:1 1 240px}
.etape{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:600;margin:26px 0 10px}
.etape span{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:14px}
details.formulaires{margin-top:30px}
details.formulaires>summary{cursor:pointer;color:var(--accent);font-weight:600;margin-bottom:12px}
.cpt{font-size:12px;font-weight:500;color:var(--faint);margin-right:6px;font-variant-numeric:tabular-nums}
.topbar{display:none}
main{padding:36px 44px 80px;max-width:1080px;width:100%;min-width:0}

@media (max-width: 860px){
  .app{grid-template-columns:1fr;background:var(--bg)}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
  .topbar .brand{padding:0;margin-right:auto}
  .side{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:30;transform:translateX(-100%);transition:transform .22s ease;box-shadow:0 0 40px rgba(0,0,0,.25)}
  body.menu-open .side{transform:none}
  body.menu-open .scrim{display:block}
  .scrim{display:none;position:fixed;inset:0;background:rgba(10,15,25,.4);z-index:25}
  main{padding:22px 16px 60px}
}
@media (prefers-reduced-motion: reduce){ .side{transition:none} }

/* ---------- Typographie ---------- */
.pagehead{margin-bottom:26px}
.pagehead h1{font-size:28px;line-height:1.2;font-weight:600;letter-spacing:-.02em;margin:0}
.pagehead p{color:var(--muted);margin:6px 0 0;max-width:64ch}
h2{font-size:20px;font-weight:600;letter-spacing:-.01em;margin:0 0 4px}
h3{font-size:16px;font-weight:600;margin:0 0 12px}
p.sub{color:var(--muted);margin:0 0 16px;max-width:70ch}
code{font-size:.92em;background:var(--surface-2);padding:1px 5px;border-radius:5px}

/* ---------- Blocs ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px 24px;margin-bottom:20px}
.card > h3:first-child{margin-top:0}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{padding:16px 18px;margin:0}
.kpi .l{color:var(--muted);font-size:13px}
.kpi .v{font-size:22px;font-weight:600;letter-spacing:-.01em;margin-top:2px}

/* ---------- Boutons et champs ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--accent-ink);border:1px solid transparent;border-radius:var(--r-md);padding:8px 15px;font:inherit;font-size:14.5px;font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.07)}
.btn.sec{background:var(--surface);color:var(--text);border-color:var(--line)}
.btn.sec:hover{background:var(--surface-2);filter:none}
.btn.ghost{background:none;color:var(--muted);border-color:transparent;padding:6px 8px}
.btn.ghost:hover{background:var(--surface-2);color:var(--text);filter:none}
.btn.small{padding:5px 11px;font-size:13px}
.btn.danger{background:var(--neg-soft);color:var(--neg)}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.btn.wide{width:100%;justify-content:center}
select,input,textarea{font:inherit;font-size:14.5px;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:8px 10px;max-width:100%}
input:focus,select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
.form{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));align-items:end}

/* ---------- Tableaux allégés ---------- */
.tablewrap{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:13px;color:var(--faint);font-weight:500;border-bottom-color:var(--line)}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}
tr.tot td{font-weight:600;border-top:1px solid var(--text);border-bottom:0}
tr.muted td{color:var(--muted)}
.case{display:inline-block;min-width:38px;text-align:center;background:var(--accent-soft);color:var(--accent);border-radius:var(--r-sm);padding:1px 7px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill{display:inline-block;font-size:12.5px;border-radius:99px;padding:2px 9px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hide{display:none!important}
details summary{cursor:pointer;color:var(--accent);font-size:13.5px}

/* ---------- Alertes ---------- */
.alerts{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:var(--r-md);padding:11px 14px;font-size:14px;margin:0}
.alert::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;margin-top:7px;background:currentColor}
.alert{margin-bottom:14px}
.alerts .alert{margin-bottom:0}
.card table + h3,.card .tablewrap + h3{margin-top:26px}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.info{background:var(--accent-soft);color:var(--accent)}
.alert.bad{background:var(--neg-soft);color:var(--neg)}
.alert.ok{background:var(--pos-soft);color:var(--pos)}

/* ---------- Tableau de bord : des loyers au résultat ---------- */
.flow{padding:26px 28px}
.flow .lead{font-size:17px;color:var(--muted);margin:0 0 4px}
.flow .big{font-size:44px;font-weight:600;letter-spacing:-.03em;line-height:1.1;margin:0}
.flow .big.neg{color:var(--neg)}
.flow .phrase{margin:10px 0 22px;color:var(--muted);max-width:62ch}
.bar{display:flex;height:30px;border-radius:8px;overflow:hidden;background:var(--surface-2)}
.bar span{display:block;height:100%;min-width:2px}
.bar span + span{border-left:2px solid var(--surface)}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:14px 18px;margin-top:16px}
.legend div{font-size:13px;color:var(--muted)}
.legend b{display:block;font-size:16px;font-weight:600;color:var(--text);margin-top:2px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:-1px}

/* ---------- Tableau de bord visuel ---------- */
.dash-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.dash-head h1{font-size:32px;font-weight:600;letter-spacing:-.02em;margin:0}
.pill.ok{background:var(--pos-soft);color:var(--pos)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.tuiles{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:20px}
.tuile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;display:flex;flex-direction:column;gap:2px}
.tuile[role=button]{cursor:pointer} .tuile[role=button]:hover{border-color:var(--accent)}
.tuile .tl{font-size:13px;color:var(--muted)} .tuile .tv{font-size:26px;font-weight:600;letter-spacing:-.02em}
.tuile .ts{font-size:12.5px;color:var(--faint)}
.tuile.fort{background:var(--accent);border-color:var(--accent)} .tuile.fort .tl,.tuile.fort .ts{color:var(--accent-ink);opacity:.8} .tuile.fort .tv{color:var(--accent-ink)}
.dash2{display:grid;gap:20px;grid-template-columns:minmax(0,1.8fr) minmax(0,1fr)}
.dash2 .card{margin-bottom:20px}
.centre{display:flex;flex-direction:column;align-items:center}
.centre h3{align-self:flex-start}
.leg{font-size:12.5px;color:var(--muted);display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.leg.col{justify-content:center;margin-top:10px}
.suivis{display:flex;gap:10px 26px;flex-wrap:wrap}
.suivi{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font-size:13px;color:var(--muted);text-align:center;width:104px}
.suivi:hover span{color:var(--accent)}
.pastilles{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.pastille{border:0;border-radius:99px;padding:7px 14px;font:inherit;font-size:13.5px;font-weight:500;cursor:pointer}
.pastille.warn{background:var(--warn-soft);color:var(--warn)} .pastille.bad{background:var(--neg-soft);color:var(--neg)} .pastille.go{background:var(--accent);color:var(--accent-ink)}
.jauge{display:flex;border-radius:99px;overflow:hidden;background:var(--surface-2)}
.jauge span{display:block;height:100%}
@media (max-width:860px){ .dash2{grid-template-columns:1fr} .tuile .tv{font-size:22px} }

/* ---------- Écritures : vues, journal, balance, grand livre ---------- */
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:3px;gap:2px}
.seg button{border:0;background:none;font:inherit;font-size:13.5px;padding:6px 14px;border-radius:7px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.mois{display:flex;gap:2px;flex-wrap:wrap;margin-left:auto}
.mois button{border:0;background:none;font:inherit;font-size:12.5px;padding:4px 7px;border-radius:6px;color:var(--muted);cursor:pointer;text-transform:capitalize}
.mois button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
table.journal td{padding:9px 10px}
table.journal tr.editing td{background:var(--accent-soft)}
td.act{white-space:nowrap}
table.balance tr.cl td{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--faint);padding-top:16px}
details.gl{padding:0}
details.gl>summary{display:flex;gap:10px;align-items:center;padding:14px 20px;color:var(--text);font-size:14.5px;list-style:none}
details.gl>summary::-webkit-details-marker{display:none}
details.gl[open]>summary{border-bottom:1px solid var(--line)}
details.gl .tablewrap{padding:4px 14px 10px}
details.gl{margin-bottom:8px}

/* ---------- Banque : dépôt et imputation ---------- */
.depot{display:flex;flex-direction:column;align-items:center;gap:4px;padding:28px 20px;margin-bottom:20px;border:2px dashed var(--line);border-radius:var(--r-lg);background:var(--surface);color:var(--muted);cursor:pointer;text-align:center}
.depot:hover,.depot.survol{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.depot b{color:var(--text);font-size:16px;font-weight:600}
.depot.petit{flex-direction:row;padding:14px 18px;gap:12px;text-align:left}
.vide{padding:26px;text-align:center;color:var(--pos);font-weight:600;background:var(--pos-soft);border-radius:var(--r-lg);margin-bottom:20px}
.op2{padding:14px 0;border-top:1px solid var(--line)}
.op2h{display:flex;gap:12px;align-items:baseline}
.op2h .d{color:var(--faint);font-size:13px;flex:none;width:42px}
.op2h .t{flex:1;font-size:14px;overflow-wrap:anywhere}
.op2h b{font-weight:600;white-space:nowrap} .op2h b.recette{color:var(--pos)}
.postes{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0 54px}
.poste{border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:13px;padding:5px 11px;border-radius:99px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.poste:not(select)::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,var(--faint))}
.poste:hover{border-color:var(--accent)}
.poste.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.poste.on::before{background:var(--accent-ink)}
select.poste{padding:5px 8px;width:auto;max-width:150px}
.poste.ign:not(.on){color:var(--muted)}
.op2.classe .op2h .t{color:var(--muted)}
.op2f{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0 0 54px}
.op2f input{min-width:160px;padding:5px 9px;font-size:13.5px}
.barresh{display:flex;flex-direction:column;gap:8px}
.bh{display:grid;grid-template-columns:minmax(120px,220px) 1fr 90px;gap:12px;align-items:center;font-size:13.5px;cursor:pointer}
.bh b{text-align:right;font-weight:600}
@media (max-width:600px){ .postes,.op2f{margin-left:0} .bh{grid-template-columns:1fr 70px} .bh div{grid-column:1/-1;order:3} }

/* ---------- Pièces ---------- */
.pieces-top{display:grid;grid-template-columns:220px 1fr;gap:20px;margin-bottom:20px;align-items:stretch}
.pc{display:grid;grid-template-columns:48px minmax(0,1fr) 110px auto;gap:10px;align-items:center;padding:10px 6px;border-top:1px solid var(--line);border-radius:8px}
.pc.survol{background:var(--accent-soft);outline:2px dashed var(--accent)}
.pc .d{color:var(--faint);font-size:13px} .pc .t{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .pc .t b{font-weight:500}
.pc .m{text-align:right;font-weight:500;white-space:nowrap} .pc .a{display:flex;gap:4px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.docs{display:flex;flex-direction:column;gap:8px}
.doc{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-md);flex-wrap:wrap}
.doc b{display:block;font-weight:600} .doc small{color:var(--muted)}
.ratt{display:flex;flex-direction:column;max-height:420px;overflow:auto}
.ratt label{display:grid;grid-template-columns:22px 50px minmax(0,1fr) auto 100px;gap:8px;align-items:center;flex-direction:row;color:var(--text);font-size:14px;padding:7px 4px;border-top:1px solid var(--line);cursor:pointer}
.ratt label.sugg{background:var(--accent-soft)}
.ratt .m{text-align:right}
@media (max-width:700px){ .pieces-top{grid-template-columns:1fr} .pc{grid-template-columns:44px minmax(0,1fr) auto} .pc .a{grid-column:1/-1} .ratt label{grid-template-columns:22px 46px minmax(0,1fr) 80px} .ratt label .chip{display:none} }

/* ---------- Immobilisations ---------- */
.frise{position:relative;padding-top:22px}
.frise .axe{position:relative;height:18px;margin-left:150px;border-bottom:1px solid var(--line);margin-bottom:8px}
.frise .axe span{position:absolute;transform:translateX(-50%);font-size:11.5px;color:var(--faint);top:0}
.fl{display:flex;align-items:center;gap:0;height:30px}
.fn{width:150px;flex:none;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:10px}
.fb{position:relative;flex:1;height:14px}
.fbar{position:absolute;top:0;height:14px;border-radius:99px;background:color-mix(in srgb, var(--c) 18%, transparent);overflow:hidden}
.fbar i{display:block;height:100%;background:var(--c);border-radius:99px}
.today{position:absolute;top:22px;bottom:0;border-left:2px dashed var(--neg);pointer-events:none}
.today span{position:absolute;top:-20px;left:4px;font-size:11px;color:var(--neg);white-space:nowrap}
.immos{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.immo{margin:0;display:flex;flex-direction:column;gap:12px}
.immo .ih{display:flex;gap:10px;align-items:center} .immo .ih b{display:block;font-weight:600} .immo .ih small{color:var(--muted)}
.immo .ib{display:flex;gap:16px;align-items:center}
.iv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 12px;flex:1}
.iv span{display:block;font-size:12px;color:var(--muted)} .iv b{font-weight:600;font-size:15px}
.muted-s{color:var(--faint);font-size:12px}
.conso{display:grid;grid-template-columns:240px 1fr;gap:24px;align-items:center}
.cbars{display:flex;gap:10px;align-items:flex-end;height:170px;padding-top:6px}
.cb{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;max-width:60px}
.cbs{flex:1;width:100%;display:flex;flex-direction:column-reverse;border-radius:6px 6px 0 0;overflow:hidden}
.cbs i{display:block;width:100%}

<script>
"use strict";
/* ============ Paramètres ============ */
const NATURES = {
  "Loyer":{g:"recette",l:"218",c:"706000",piece:false},
  "Charges refacturées":{g:"recette",l:"218",c:"708400"},
  "Autre recette":{g:"recette",l:"218",c:"708800"},
  "Copropriété":{g:"charge",l:"242",c:"614000"},
  "Assurance":{g:"charge",l:"242",c:"616000"},
  "Assurance emprunt":{g:"charge",l:"242",c:"616100",piece:false},
  "Eau":{g:"charge",l:"242",c:"606110"},
  "Électricité / gaz":{g:"charge",l:"242",c:"606120"},
  "Internet":{g:"charge",l:"242",c:"626000"},
  "Entretien et réparations":{g:"charge",l:"242",c:"615000"},
  "Petit équipement (< 500 € HT)":{g:"charge",l:"242",c:"606300"},
  "Frais de gestion / agence":{g:"charge",l:"242",c:"622800"},
  "Honoraires":{g:"charge",l:"242",c:"622600"},
  "Frais bancaires":{g:"charge",l:"242",c:"627000"},
  "Autre charge":{g:"charge",l:"242",c:"628000"},
  "Taxe foncière":{g:"charge",l:"244",c:"635120"},
  "CFE":{g:"charge",l:"244",c:"635110"},
  "Intérêts emprunt":{g:"charge",l:"294",c:"661160",piece:false},
  "Remboursement emprunt":{g:"bilan",l:"",c:"164000",piece:false}
};
/* Plan comptable général : libellés des comptes utilisés (natures, immobilisations, export FEC) */
const COMPTES = {
  "108000":"Compte de l'exploitant", "164000":"Emprunts auprès des établissements de crédit",
  "211000":"Terrains", "213000":"Constructions", "213500":"Installations générales, agencements des constructions", "218400":"Mobilier",
  "281300":"Amortissements des constructions", "281350":"Amortissements des installations et agencements", "281840":"Amortissements du mobilier",
  "512000":"Banque", "606110":"Eau", "606120":"Électricité, gaz", "606300":"Fournitures d'entretien et de petit équipement",
  "614000":"Charges locatives et de copropriété", "615000":"Entretien et réparations", "616000":"Primes d'assurance", "616100":"Assurance emprunteur",
  "622600":"Honoraires", "622800":"Frais de gestion locative", "626000":"Frais de télécommunications", "627000":"Services bancaires", "628000":"Charges diverses",
  "635110":"Cotisation foncière des entreprises", "635120":"Taxe foncière", "661160":"Intérêts des emprunts", "681120":"Dotations aux amortissements des immobilisations corporelles",
  "706000":"Prestations de services (loyers)", "708400":"Charges refacturées aux locataires", "708800":"Autres produits des activités annexes"
};
const CPT_IMMO = {construction:{brut:"213000", am:"281300"}, travaux:{brut:"213500", am:"281350"}, mobilier:{brut:"218400", am:"281840"}};
const compteNature = n => NATURES[n]?.c || (NATURES[n] ? "" : "628000");
/* Nature affichée, précédée de son compte si l'option « N° de comptes » est active */
const libNature = n => (comptesVisibles() && compteNature(n) ? `<span class="cpt">${compteNature(n)}</span>` : "") + esc(n);
const optNature = (n, sel) => `<option value="${esc(n)}" ${n===sel?"selected":""}>${comptesVisibles()&&compteNature(n)?compteNature(n)+" · ":""}${esc(n)}</option>`;
const CATEGORIES = {construction:"Logement (bâti + terrain)", travaux:"Travaux / agencements", mobilier:"Mobilier et équipements"};
const DUREE_DEFICIT = 10;

/* ============ État ============ */
const S = {data:null, dirty:false, dir:null, fileName:null, year:null, tab:"accueil", editId:null, editImmo:null, unlocked:{}};

/* ============ Utilitaires ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const eur = n => (n==null||isNaN(n)) ? "–" : n.toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2}) + " €";
const eur0 = n => (n==null||isNaN(n)) ? "–" : Math.round(n).toLocaleString("fr-FR") + " €";
const uid = () => Math.random().toString(36).slice(2,10);
const yearOf = d => parseInt(String(d).slice(0,4),10);
const monthOf = d => parseInt(String(d).slice(5,7),10);
const MOIS = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const fmtDate = d => d ? d.slice(8,10)+"/"+d.slice(5,7)+"/"+d.slice(0,4) : "";

function setDirty(v=true){
  S.dirty=v; if(v) S.version = (S.version||0) + 1;
  statut(v ? (S.dir ? "Enregistrement…" : "Modifications non enregistrées") : (S.autoMsg||""), v && !S.dir);
  $("#saveBtn").disabled = !S.data;
  if(v && S.dir){ clearTimeout(S.autoT); S.autoT = setTimeout(autoSave, 1200); }
}
function statut(txt, alerte){ for(const id of ["#dirty","#statusTop"]){ const el = $(id); if(el){ el.textContent = txt; el.classList.toggle("warn", !!alerte); } } }
/* Enregistrement automatique dans le dossier (sans demander d'autorisation) */
async function autoSave(){
  if(!S.dir || !S.dirty) return;
  try{
    if(await S.dir.queryPermission({mode:"readwrite"}) !== "granted"){ S.autoMsg=""; statut("Non enregistré : cliquez sur Enregistrer", true); return; }
    const v = S.version;
    await ecrireDossier(!S.sauvegardeSession);
    if(S.version === v){ const d = new Date(); S.autoMsg = "✓ Enregistré à " + d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}); setDirty(false); }
  }catch(e){ statut("Échec de l'enregistrement automatique : cliquez sur Enregistrer", true); }
}
async function ecrireDossier(avecCopie){
  S.data.derniereModification = new Date().toISOString();
  const txt = JSON.stringify(S.data, null, 2);
  const fh = await S.dir.getFileHandle(FILE, {create:true});
  const w = await fh.createWritable(); await w.write(txt); await w.close();
  if(avecCopie){
    const sv = await S.dir.getDirectoryHandle("Sauvegardes", {create:true});
    const bh = await sv.getFileHandle(`lmnp-donnees_${horodatage()}.json`, {create:true});
    const bw = await bh.createWritable(); await bw.write(txt); await bw.close();
    S.sauvegardeSession = true;
  }
}
window.addEventListener("beforeunload", e => { if(S.dirty){ e.preventDefault(); e.returnValue=""; } });

/* ============ Modèle : migration ============ */
function normalize(d){
  d.dossier ??= {}; d.immobilisations ??= []; d.emprunts ??= []; d.exercices ??= {};
  d.dossier.declarant ??= "1";
  d.reports ??= {};
  if(!Array.isArray(d.reports.deficits)) d.reports.deficits = [];
  d.reports.amortissementsDifferes ??= 0;
  delete d.reports.deficitsAnterieurs;
  for(const [y,ex] of Object.entries(d.exercices)){
    if(ex.ecritures) ex.ecritures.forEach(e => { e.id ??= uid(); });
  }
  d.immobilisations.forEach(i => { i.id ??= uid(); i.quotePartTerrain ??= 0; });
  d.banque ??= {};
  d.documents ??= [];
  d.banque.regles ??= []; d.banque.aTrier ??= []; d.banque.ignorees ??= [];
  return d;
}
function newDossier(){
  const y = new Date().getFullYear();
  return normalize({format:"outil-lmnp",version:1,dossier:{nom:"Mon LMNP",regime:"reel-simplifie",debutLocationMeublee:y+"-01-01"},
    immobilisations:[],emprunts:[],exercices:{[y]:{statut:"en-cours",ecritures:[]}},reports:{}});
}

/* ============ Calculs : amortissements ============ */
function debutLMNP(){ return S.data.dossier.debutLocationMeublee || "1900-01-01"; }
function baseAmort(i){ return r2(i.valeurOrigine * (1 - (i.quotePartTerrain||0))); }
function planAmort(i){
  const base = baseAmort(i), annuite = base / i.dureeAns;
  const y0 = yearOf(i.miseEnService), m0 = monthOf(i.miseEnService);
  const plan = []; let cumul = 0, y = y0;
  while(cumul < base - 0.005 && y < y0 + i.dureeAns + 2){
    const mois = (y === y0) ? 13 - m0 : 12;
    let dot = Math.min(annuite * mois / 12, base - cumul);
    cumul += dot;
    plan.push({annee:y, dotation:dot, cumul, vnc: base - cumul, avantLMNP: y < yearOf(debutLMNP())});
    y++;
  }
  return plan;
}
function amortAnnee(i, y){
  const plan = planAmort(i);
  const row = plan.find(p => p.annee === y);
  const prev = plan.filter(p => p.annee < y);
  const cumulDebut = prev.length ? prev[prev.length-1].cumul : 0;
  return {dotation: row ? row.dotation : 0, cumulDebut, cumulFin: cumulDebut + (row ? row.dotation : 0), base: baseAmort(i)};
}
function anneeEntreeBilan(i){ return Math.max(yearOf(i.miseEnService), yearOf(debutLMNP())); }

/* ============ Calculs : emprunt ============ */
function echeancier(l){
  const r = l.tauxAnnuel / 12;
  let m = l.mensualite;
  if(!m) m = r ? l.capital * r / (1 - Math.pow(1+r, -l.dureeMois)) : l.capital / l.dureeMois;
  const rows = []; let crd = l.capital;
  const y0 = yearOf(l.premiereEcheance), m0 = monthOf(l.premiereEcheance);
  for(let k=0;k<l.dureeMois && crd>0.005;k++){
    const interet = crd * r;
    let capital = m - interet;
    if(k === l.dureeMois-1 || capital > crd) capital = crd;
    crd -= capital;
    const mm = m0 - 1 + k;
    rows.push({n:k+1, annee: y0 + Math.floor(mm/12), mois: (mm%12)+1, interet, capital, crd});
  }
  return rows;
}
function empruntAnnee(l, y){
  const rows = echeancier(l);
  const inY = rows.filter(r => r.annee === y);
  const before = rows.filter(r => r.annee <= y);
  return {interets: inY.reduce((s,r)=>s+r.interet,0), capital: inY.reduce((s,r)=>s+r.capital,0),
          crdFin: before.length ? before[before.length-1].crd : (yearOf(l.premiereEcheance) > y ? 0 : l.capital), demarre: yearOf(l.premiereEcheance) <= y};
}

/* ============ Calculs : exercice ============ */
function exercice(y){ return S.data.exercices[y]; }
function isHistorique(y){ const ex = exercice(y); return ex && ex.statut === "historique"; }
function anneesCalculees(){
  return Object.keys(S.data.exercices).map(Number).filter(y => !isHistorique(y)).sort((a,b)=>a-b);
}
function totauxEcritures(y){
  const ex = exercice(y) || {}; const t = {parNature:{}, recettes:0, c242:0, c244:0, c294:0, remb:0, inconnues:0};
  (ex.ecritures||[]).forEach(e => {
    const nat = NATURES[e.nature] || {g: e.sens === "recette" ? "recette" : "charge", l: e.sens==="recette"?"218":"242", inconnue:true};
    if(nat.inconnue) t.inconnues++;
    t.parNature[e.nature] = (t.parNature[e.nature]||0) + e.montant;
    if(nat.g === "recette") t.recettes += e.montant;
    else if(nat.g === "bilan") t.remb += e.montant;
    else if(nat.l === "244") t.c244 += e.montant;
    else if(nat.l === "294") t.c294 += e.montant;
    else t.c242 += e.montant;
  });
  return t;
}
function calculAnnee(y){
  const t = totauxEcritures(y);
  const lmnpActif = y >= yearOf(debutLMNP());
  // Intérêts : réels si saisis, sinon échéancier
  let interetsEch = 0, capitalEch = 0, crd = 0;
  S.data.emprunts.forEach(l => { const a = empruntAnnee(l,y); interetsEch += a.interets; capitalEch += a.capital; crd += a.crdFin; });
  const interetsSaisis = (t.parNature["Intérêts emprunt"]||0) > 0;
  const interets = interetsSaisis ? t.c294 : t.c294 + interetsEch;
  const ex = exercice(y) || {};
  const crdRetenu = (ex.crdBanque != null && ex.crdBanque !== "") ? Number(ex.crdBanque) : crd;
  // Amortissements
  const immos = S.data.immobilisations.map(i => ({i, a: amortAnnee(i,y), entree: anneeEntreeBilan(i)}));
  const dotations = immos.reduce((s,x)=> s + (x.entree <= y ? x.a.dotation : 0), 0);
  const produits = t.recettes;
  const resultatAvantAmort = produits - t.c242 - t.c244 - interets;
  const resultatComptable = resultatAvantAmort - dotations;
  return {y, t, lmnpActif, produits, c242:t.c242, c244:t.c244, interets, interetsEch, interetsSaisis, capitalEch,
          crdEch:crd, crd:crdRetenu, dotations, immos, resultatAvantAmort, resultatComptable};
}
/* Chaîne fiscale (art. 39 C : les amortissements ne peuvent pas créer ou augmenter un déficit) */
function fiscalJusqua(yCible){
  let ard = Number(S.data.reports.amortissementsDifferes)||0;
  let deficits = (S.data.reports.deficits||[]).map(d => ({...d}));
  let res = null;
  for(const y of anneesCalculees()){
    if(y > yCible) break;
    const c = calculAnnee(y);
    const ardDebut = ard, deficitsDebut = deficits.map(d=>({...d}));
    // déficits périmés
    const perimes = deficits.filter(d => y - d.annee > DUREE_DEFICIT);
    deficits = deficits.filter(d => y - d.annee <= DUREE_DEFICIT);
    let R0 = c.resultatAvantAmort, dotDeductible = 0, ardUtilise = 0, ardNouveau = 0, deficitAnnee = 0;
    if(R0 <= 0){
      ardNouveau = c.dotations; deficitAnnee = -R0;
    } else {
      dotDeductible = Math.min(c.dotations, R0);
      ardNouveau = c.dotations - dotDeductible;
      // priorité aux déficits antérieurs (limités à 10 ans), puis aux amortissements différés (sans limite)
      const defDispo = deficits.reduce((s,d)=>s+d.montant,0);
      ardUtilise = Math.min(ard, Math.max(0, R0 - dotDeductible - defDispo));
    }
    ard = ard - ardUtilise + ardNouveau;
    const resultatFiscal = R0 - dotDeductible - ardUtilise; // >= 0 si R0>0, sinon = R0 (déficit)
    // Imputation des déficits antérieurs sur le bénéfice
    let deficitsImputes = 0, reste = Math.max(resultatFiscal,0);
    deficits.sort((a,b)=>a.annee-b.annee).forEach(d => { const u = Math.min(d.montant, reste); d.montant -= u; reste -= u; deficitsImputes += u; });
    deficits = deficits.filter(d => d.montant > 0.005);
    if(deficitAnnee > 0) deficits.push({annee:y, montant:deficitAnnee});
    if(y === yCible) res = {c, R0, dotDeductible, ardUtilise, ardNouveau, ardDebut, ardFin:ard, reintegration:c.dotations - dotDeductible,
      resultatFiscal, deficitsImputes, deficitsDebut, deficitsFin:deficits.map(d=>({...d})), deficitAnnee, perimes};
  }
  return res;
}
function bilan(y){
  if(isHistorique(y)){
    const h = exercice(y).chiffres || {};
    return {historique:true, immoNettes:h.immobilisationsNettes, crd:h.capitalRestantDu, capital:h.capitalExploitant, resultat:h.resultat};
  }
  const c = calculAnnee(y);
  let brut = 0, amort = 0;
  const lignes = {terrain:{}, construction:{}, travaux:{}, mobilier:{}};
  for(const k in lignes) lignes[k] = {brutDebut:0, aug:0, brutFin:0, amDebut:0, dot:0, amFin:0};
  S.data.immobilisations.forEach(i => {
    const entree = anneeEntreeBilan(i); if(entree > y) return;
    const a = amortAnnee(i,y);
    const terrain = r2(i.valeurOrigine - baseAmort(i));
    const cat = i.categorie === "construction" ? "construction" : (i.categorie === "mobilier" ? "mobilier" : "travaux");
    const add = (L, v, isNew) => { if(isNew) L.aug += v; else L.brutDebut += v; L.brutFin += v; };
    if(terrain > 0) add(lignes.terrain, terrain, entree === y);
    add(lignes[cat], baseAmort(i), entree === y);
    lignes[cat].amDebut += (entree === y ? 0 : a.cumulDebut);
    lignes[cat].dot += a.dotation + (entree === y ? a.cumulDebut : 0);
    lignes[cat].amFin += a.cumulFin;
    brut += i.valeurOrigine; amort += a.cumulFin;
  });
  const immoNettes = brut - amort;
  return {historique:false, brut, amort, immoNettes, crd:c.crd, resultat:c.resultatComptable,
          capital: immoNettes - c.resultatComptable - c.crd, lignes};
}

const idb = {
  db(){ return new Promise((ok,ko)=>{ try{ const r = indexedDB.open("outil-lmnp",1); r.onupgradeneeded=()=>r.result.createObjectStore("k"); r.onsuccess=()=>ok(r.result); r.onerror=()=>ko(r.error);}catch(e){ko(e)} }); },
  async get(k){ try{ const db=await this.db(); return await new Promise(ok=>{const q=db.transaction("k").objectStore("k").get(k); q.onsuccess=()=>ok(q.result); q.onerror=()=>ok(null);}); }catch(e){return null} },
  async set(k,v){ try{ const db=await this.db(); db.transaction("k","readwrite").objectStore("k").put(v,k); }catch(e){} }
};
function chargerDonnees(obj, nom){
  if(!obj || obj.format !== "outil-lmnp") throw new Error("Ce fichier n'est pas un dossier de l'outil LMNP.");
  S.data = normalize(obj); S.fileName = nom; S.autoMsg = ""; S.sauvegardeSession = false;
  const ys = Object.keys(S.data.exercices).map(Number).sort((a,b)=>a-b);
  S.year = ys.filter(y=>!isHistorique(y)).pop() ?? ys.pop();
  setDirty(false); renderAll();
}
async function ouvrirDossier(){
  try{
    const dir = await window.showDirectoryPicker({id:"lmnp", mode:"readwrite"});
    S.dir = dir; await idb.set("dir", dir);
    await lireDepuisDossier();
  }catch(e){ if(e.name !== "AbortError") alert("Impossible d'ouvrir ce dossier : " + e.message + "\n\nSi le dossier est dans iCloud Drive et que le navigateur le refuse, essayez un dossier de « Documents » synchronisé avec iCloud."); }
}
async function reprendreDossier(dir){
  if(await dir.requestPermission({mode:"readwrite"}) !== "granted") return;
  S.dir = dir; await lireDepuisDossier();
}
async function lireDepuisDossier(){
  try{
    const fh = await S.dir.getFileHandle(FILE);
    const txt = await (await fh.getFile()).text();
    chargerDonnees(JSON.parse(txt), S.dir.name + "/" + FILE);
  }catch(e){
    if(e.name === "NotFoundError"){
      if(confirm("Aucun fichier « "+FILE+" » dans ce dossier. Créer un dossier comptable vide ici ?")){
        chargerDonnees(newDossier(), S.dir.name + "/" + FILE); await enregistrer();
      }
    } else alert("Lecture impossible : " + e.message);
  }
}

$("#fileInput").addEventListener("change", async ev => {
  const f = ev.target.files[0]; if(!f) return;
  try{ chargerDonnees(JSON.parse(await f.text()), f.name); S.dir = null; }catch(e){ alert(e.message); }
  ev.target.value = "";

function horodatage(){ const d=new Date(), p=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}h${p(d.getMinutes())}`; }
async function enregistrer(){
  if(!S.data) return;
  S.data.derniereModification = new Date().toISOString();
  const txt = JSON.stringify(S.data, null, 2);
  if(S.dir){
    try{
      if(await S.dir.queryPermission({mode:"readwrite"}) !== "granted" && await S.dir.requestPermission({mode:"readwrite"}) !== "granted") throw new Error("permission refusée");
      clearTimeout(S.autoT); await ecrireDossier(true);
      S.autoMsg = "✓ Enregistré à " + new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
      setDirty(false); toast("Enregistré dans « "+S.dir.name+" » (+ copie dans Sauvegardes)");
      return;
    }catch(e){ alert("Enregistrement dans le dossier impossible ("+e.message+"). Le fichier va être téléchargé à la place."); }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([txt],{type:"application/json"}));
  a.download = FILE; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  setDirty(false); toast("Fichier téléchargé : déplacez-le dans votre dossier iCloud pour remplacer l'ancien.");
}

/* ============ Graphiques (SVG, sans bibliothèque) ============ */
const pctTxt = p => Math.round(p*100) + " %";
/* Anneau de progression : p entre 0 et 1 */
function anneau(p, centre, couleur="var(--accent)", taille=92){
  const r = 38, L = 2*Math.PI*r, v = Math.max(0, Math.min(1, p||0));
  return `<svg viewBox="0 0 92 92" width="${taille}" height="${taille}" role="img" aria-label="${pctTxt(v)}"><circle cx="46" cy="46" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="9"/>
    <circle cx="46" cy="46" r="${r}" fill="none" stroke="${couleur}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(v*L).toFixed(1)} ${L.toFixed(1)}" transform="rotate(-90 46 46)"/>
    <text x="46" y="51" text-anchor="middle" font-size="17" font-weight="600" fill="var(--text)">${centre}</text></svg>`;
}
/* Anneau découpé en parts : [[libellé, valeur, couleur]] */
function donut(parts, centre, sous){
  const tot = parts.reduce((s,p)=>s+Math.max(0,p[1]),0) || 1, r = 60, L = 2*Math.PI*r; let off = 0;
  return `<svg viewBox="0 0 160 160" width="170" height="170" role="img"><circle cx="80" cy="80" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="22"/>
    ${parts.filter(p=>p[1]>0.5).map(([l,v,col]) => { const d = v/tot*L, s = `<circle cx="80" cy="80" r="${r}" fill="none" stroke="${col}" stroke-width="22" stroke-dasharray="${Math.max(0,d-1.5).toFixed(1)} ${L.toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}" transform="rotate(-90 80 80)"><title>${l} : ${eur0(v)}</title></circle>`; off += d; return s; }).join("")}
    <text x="80" y="78" text-anchor="middle" font-size="20" font-weight="600" fill="var(--text)">${centre}</text><text x="80" y="98" text-anchor="middle" font-size="11.5" fill="var(--muted)">${sous}</text></svg>`;
}
/* Barres groupées par mois : séries [[libellé, couleur, valeurs[12]]] */
function barresMois(series, hauteur=170){
  const W = 640, H = hauteur, pad = 22, max = Math.max(1, ...series.flatMap(s=>s[2])), bw = (W - 10) / 12, n = series.length, b = Math.min(16, (bw - 10) / n);
  const ech = v => (H - pad - 6) * v / max;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="none" style="height:${H}px" role="img">
    <line x1="0" x2="${W}" y1="${H-pad}" y2="${H-pad}" stroke="var(--line)"/>
    ${[...Array(12).keys()].map(m => series.map(([l,col,vals],k) => { const h = ech(vals[m]||0), x = 5 + m*bw + (bw - n*b - (n-1)*3)/2 + k*(b+3);
      return h>0 ? `<rect x="${x.toFixed(1)}" y="${(H-pad-h).toFixed(1)}" width="${b.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${col}"><title>${MOIS_LONG[m]} · ${l} : ${eur(vals[m])}</title></rect>` : ""; }).join("") +
      `<text x="${(5 + m*bw + bw/2).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--faint)">${MOIS[m].replace(".","")}</text>`).join("")}
  </svg>`;
}
/* Barre de progression horizontale, segments [[valeur, couleur, titre]] sur un total */
function jauge(segs, total, h=12){
  const t = total || 1;
  return `<div class="jauge" style="height:${h}px">${segs.filter(s=>s[0]>0.005).map(([v,col,tt])=>`<span style="width:${Math.min(100,v/t*100).toFixed(2)}%;background:${col}" ${tt?`title="${esc(tt)}"`:""}></span>`).join("")}</div>`;
}

  const charges = c.c242 + c.c244 + c.interets;

  const rec = Array(12).fill(0), dep = Array(12).fill(0);

  // Indicateurs de suivi
  const debut = y === yearOf(debutLMNP()) ? monthOf(debutLMNP()) : 1;
  const moisAttendus = [...Array(13-debut).keys()].map(i=>i+debut).filter(m => y < new Date().getFullYear() || m <= new Date().getMonth()+1);
  const moisLoyer = new Set(es.filter(e=>e.nature==="Loyer").map(e=>monthOf(e.date)));
  const loyersOk = moisAttendus.filter(m=>moisLoyer.has(m)).length;

/* ---- Amortissements consommés (déduits) et en réserve, pour la plus-value à la revente ---- */
/* Art. 150 VB III du CGI (cessions depuis le 15/02/2025) : le prix d'acquisition est minoré des amortissements
   admis en déduction ; ceux restés en réserve (art. 39 C) ne le minorent pas. */
function suiviAmortissements(yMax){
  const lignes = [];
  const hist = Object.keys(S.data.exercices).map(Number).filter(y => isHistorique(y) && y <= yMax).sort((a,b)=>a-b);
  const dotHist = hist.reduce((s,y)=>s + (Number(exercice(y).chiffres?.dotationsAmortissements)||0), 0);
  const reserveOuverture = Number(S.data.reports.amortissementsDifferes)||0;
  hist.forEach(y => lignes.push({y, historique:true, dotations:Number(exercice(y).chiffres?.dotationsAmortissements)||0}));
  // Années reprises de l'Excel : seul le total est connu = dotations déclarées − réserve encore disponible à l'ouverture
  const consommesHist = Math.max(0, dotHist - reserveOuverture);
  let cumul = consommesHist;
  anneesCalculees().filter(y => y <= yMax && y >= yearOf(debutLMNP())).forEach(y => {
    const f = fiscalJusqua(y), consommes = f.dotDeductible + f.ardUtilise;
    cumul += consommes;
    lignes.push({y, dotations:f.c.dotations, deduites:f.dotDeductible, reserveUtilisee:f.ardUtilise, consommes, cumul, reserveFin:f.ardFin});
  });
  const der = lignes.filter(l => !l.historique).pop();
  return {lignes, consommesHist, dotHist, reserveOuverture, cumul, reserveFin: der ? der.reserveFin : reserveOuverture};
}
function vueConsommes(y){
  if(isHistorique(y)) return "";
  const t = suiviAmortissements(y);

  return `<div class="card"><h3>Amortissements consommés et en réserve</h3>
    <div class="conso">
      <div class="centre">${donut([["Consommés", t.cumul, "var(--accent)"],["En réserve", t.reserveFin, "var(--warn)"]], eur0(tot), "amortissements")}

          <i style="height:${(l.reserveUtilisee/max*100).toFixed(1)}%;background:#7C93F0" title="Réserve utilisée : ${eur0(l.reserveUtilisee)}"></i>
          <i style="height:${(Math.max(0,l.dotations-l.deduites)/max*100).toFixed(1)}%;background:var(--warn)" title="Mis en réserve : ${eur0(l.dotations-l.deduites)}"></i></div><span>${l.y}</span></div>`).join("")}</div>
        <div class="leg" style="margin-top:8px"><span><i style="background:var(--accent)"></i>Déduits</span><span><i style="background:#7C93F0"></i>Réserve utilisée</span><span><i style="background:var(--warn)"></i>Mis en réserve</span>${det.some(l=>l.historique)?'<span><i style="background:var(--seg-2)"></i>Années Excel</span>':""}</div></div>

      ? `<tr class="muted"><td>${l.y} <span class="pill">Excel</span></td><td class="n">${eur(l.dotations)}</td><td class="n" colspan="5"></td></tr>`
      : `<tr class="${l.y===y?"tot":""}"><td>${l.y}</td><td class="n">${eur(l.dotations)}</td><td class="n">${eur(l.deduites)}</td><td class="n">${eur(l.reserveUtilisee)}</td><td class="n">${eur(l.consommes)}</td><td class="n">${eur(l.cumul)}</td><td class="n">${eur(l.reserveFin)}</td></tr>`).join("")}

/* Courbe du capital restant dû, avec l'année affichée mise en évidence */
function courbeCRD(l, y){
  const rows = echeancier(l), ans = [...new Set(rows.map(r=>r.annee))], W = 640, H = 200, px = 34, py = 16;
  const pts = [[yearOf(l.premiereEcheance) - 0.001, l.capital], ...ans.map(a => [a + 1, empruntAnnee(l,a).crdFin])];
  const x0 = pts[0][0], x1 = pts[pts.length-1][0], X = a => px + (a - x0) / (x1 - x0 || 1) * (W - px - 8), Y = v => py + (1 - v / (l.capital||1)) * (H - py - 24);
  const d = pts.map((p,k)=>`${k?"L":"M"}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(" ");
  const yc = Math.min(Math.max(y+1, x0), x1), vc = empruntAnnee(l, y).crdFin;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Capital restant dû">
    <path d="${d} L${X(x1)},${H-24} L${X(x0)},${H-24}Z" fill="var(--accent-soft)"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
    <line x1="${X(x0)}" x2="${X(x1)}" y1="${H-24}" y2="${H-24}" stroke="var(--line)"/>
    ${ans.filter((a,k)=>ans.length<=12||k%3===0||a===y).map(a=>`<text x="${X(a+0.5).toFixed(1)}" y="${H-7}" text-anchor="middle" font-size="11" fill="var(--faint)">${a}</text>`).join("")}
    <circle cx="${X(yc).toFixed(1)}" cy="${Y(vc).toFixed(1)}" r="6" fill="var(--accent)" stroke="var(--surface)" stroke-width="2.5"/>
    <text x="${Math.min(X(yc)+10, W-90).toFixed(1)}" y="${(Y(vc)-10).toFixed(1)}" font-size="12.5" font-weight="600" fill="var(--text)">${eur0(vc)}</text>
  </svg>`;
}

/* Reconstitue les écritures comptables d'un exercice à partir des saisies (rien n'est stocké en plus) */
function ecrituresComptables(y){
  const out = [], c = calculAnnee(y), fin = `${y}-12-31`, debut = `${y}-01-01`;
  const add = (journal, date, lib, lignes, piece) => { lignes = lignes.filter(l => Math.abs(l.d||0) > 0.004 || Math.abs(l.cr||0) > 0.004); if(lignes.length) out.push({journal, date, lib, lignes, piece}); };
  // À-nouveaux : immobilisations, amortissements antérieurs, emprunt ; le compte de l'exploitant équilibre
  const an = [];
  S.data.immobilisations.forEach(i => {
    if(anneeEntreeBilan(i) > y) return;
    const a = amortAnnee(i, y), k = CPT_IMMO[i.categorie] || CPT_IMMO.travaux, terrain = r2(i.valeurOrigine - baseAmort(i));
    if(terrain > 0) an.push({c:"211000", d:terrain});
    an.push({c:k.brut, d:baseAmort(i)}, {c:k.am, cr:r2(a.cumulDebut)});
  });
  const crdPrec = exercice(y-1) ? Number(bilan(y-1).crd) : NaN;
  const crdDebut = crdPrec >= 0 ? crdPrec : S.data.emprunts.reduce((s,l)=>s+empruntAnnee(l,y-1).crdFin,0);
  if(crdDebut > 0) an.push({c:"164000", cr:r2(crdDebut)});
  const solde = r2(an.reduce((s,l)=>s+(l.d||0)-(l.cr||0),0));
  an.push(solde >= 0 ? {c:"108000", cr:solde} : {c:"108000", d:-solde});
  add("AN", debut, "À-nouveaux au 1er janvier", an);
  // Mouvements de banque saisis
  [...(exercice(y).ecritures||[])].sort((a,b)=>a.date.localeCompare(b.date)).forEach(e => {
    const k = compteNature(e.nature), m = r2(e.montant), lib = [e.tiers, e.nature].filter(Boolean).join(" - ");
    const recette = (NATURES[e.nature]?.g || (e.sens==="recette"?"recette":"charge")) === "recette";
    add("BQ", e.date, lib, recette ? [{c:"512000", d:m}, {c:k, cr:m}] : [{c:k, d:m}, {c:"512000", cr:m}], e.piece ? e.piece.split("/").pop() : e.id);
  });
  if(S.data.emprunts.length && !c.interetsSaisis && c.interetsEch > 0.004)
    add("OD", fin, "Intérêts d'emprunt selon l'échéancier", [{c:"661160", d:r2(c.interetsEch)}, {c:"512000", cr:r2(c.interetsEch)}]);
  // Dotations aux amortissements, par catégorie
  const dot = {};
  c.immos.forEach(x => { if(x.entree <= y && x.a.dotation > 0){ const k = (CPT_IMMO[x.i.categorie] || CPT_IMMO.travaux).am; dot[k] = (dot[k]||0) + x.a.dotation; } });
  Object.entries(dot).forEach(([k,v]) => add("OD", fin, "Dotation aux amortissements " + y, [{c:"681120", d:r2(v)}, {c:k, cr:r2(v)}]));
  return out;
}
function balance(y){
  const b = {};
  ecrituresComptables(y).forEach(e => e.lignes.forEach(l => { const x = b[l.c] ??= {d:0, cr:0}; x.d += l.d||0; x.cr += l.cr||0; }));
  return Object.entries(b).sort((a,b)=>a[0].localeCompare(b[0])).map(([c,x]) => ({c, lib:COMPTES[c]||"", d:r2(x.d), cr:r2(x.cr), solde:r2(x.d-x.cr)}));
}
function vueBalance(y){
  const rows = balance(y), tot = rows.reduce((s,r)=>({d:s.d+r.d, cr:s.cr+r.cr}),{d:0,cr:0});
  return `<div class="card noprint"><h3 style="margin-top:0">Balance des comptes ${y}</h3><div class="tablewrap"><table>
    <tr><th>Compte</th><th>Libellé</th><th class="n">Débit</th><th class="n">Crédit</th><th class="n">Solde</th></tr>
    ${rows.map(r=>`<tr><td>${r.c}</td><td>${esc(r.lib)}</td><td class="n">${eur(r.d)}</td><td class="n">${eur(r.cr)}</td><td class="n">${eur(Math.abs(r.solde))} ${r.solde>=0.005?"D":r.solde<=-0.005?"C":""}</td></tr>`).join("")}
    <tr class="tot"><td></td><td>Total</td><td class="n">${eur(tot.d)}</td><td class="n">${eur(tot.cr)}</td><td></td></tr>
  </table></div><p class="sub" style="margin:8px 0 0">Reconstituée à partir des écritures : le compte 512 (banque) ne suit que les mouvements liés à la location, sans solde d'ouverture.</p></div>`;
}
/* Fichier des écritures comptables (art. A.47 A-1 du LPF) : 18 colonnes, tabulations, ISO-8859-15 */
function exporterFEC(y){
  const num = v => (v||0).toFixed(2).replace(".", ","), dt = d => d.replace(/-/g,"");
  const net = t => String(t||"").replace(/[\t\r\n|]+/g," ").trim();
  const JL = {AN:"A-nouveaux", BQ:"Banque", OD:"Opérations diverses"};
  const cols = ["JournalCode","JournalLib","EcritureNum","EcritureDate","CompteNum","CompteLib","CompAuxNum","CompAuxLib","PieceRef","PieceDate","EcritureLib","Debit","Credit","EcritureLet","DateLet","ValidDate","Montantdevise","Idevise"];
  const ecr = ecrituresComptables(y).sort((a,b)=>a.date.localeCompare(b.date) || (a.journal==="AN"?-1:b.journal==="AN"?1:0));
  const lignes = [cols.join("\t")];
  ecr.forEach((e,i) => e.lignes.forEach(l => lignes.push([e.journal, JL[e.journal], String(i+1).padStart(6,"0"), dt(e.date), l.c, net(COMPTES[l.c]), "", "", net(e.piece||e.journal+(i+1)), dt(e.date), net(e.lib), num(l.d), num(l.cr), "", "", dt(e.date), "", ""].join("\t"))));
  const txt = lignes.join("\r\n") + "\r\n";
  // Encodage ISO-8859-15 (€, œ, Œ ont leur propre code ; le reste du Latin-1 est identique)
  const spec = {"€":0xA4, "Œ":0xBC, "œ":0xBD, "Š":0xA6, "š":0xA8, "Ž":0xB4, "ž":0xB8, "Ÿ":0xBE, "’":0x27, "‘":0x27, "«":0xAB, "»":0xBB};
  const bytes = new Uint8Array([...txt].map(ch => spec[ch] ?? (ch.charCodeAt(0) < 256 ? ch.charCodeAt(0) : 0x3F)));
  const siren = (S.data.dossier.siren||"").padStart(9,"0").slice(-9);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([bytes], {type:"text/plain;charset=iso-8859-15"}));
  a.download = `${siren}FEC${y}1231.txt`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  toast(`FEC ${y} téléchargé : ${lignes.length-1} lignes.`);
}

/* ============ Simulations : micro-BIC contre réel, plus-value à la revente ============ */
const PS_REVENUS = 0.186;   // prélèvements sociaux sur les revenus LMNP depuis la LFSS 2026
const PS_PLUSVALUE = 0.172; // plus-values immobilières : taux inchangé
const MICRO = {plafond:77700, abattement:0.5, minimum:305}; // meublé de longue durée non classé
function simu(){ S.data.dossier.simu ??= {}; return S.data.dossier.simu; }
function majSimu(k, v){ simu()[k] = v; setDirty(); renderAll(); }
/* Projection : mêmes loyers et charges que l'année de référence (ou ceux des curseurs), intérêts selon l'échéancier, amortissements selon les plans */
function projection(y0, n, o){
  const c0 = calculAnnee(y0), f0 = fiscalJusqua(y0);
  const loyers = o?.loyers ?? c0.produits, charges = o?.charges ?? (c0.c242 + c0.c244);
  let ard = o ? f0.ardDebut : f0.ardFin, out = [];
  for(let y = y0; y < y0 + n; y++){
    let interets = 0; S.data.emprunts.forEach(l => interets += empruntAnnee(l, y).interets);
    if(y === y0) interets = c0.interets;
    const dot = S.data.immobilisations.reduce((s,i)=>s + (anneeEntreeBilan(i) <= y ? amortAnnee(i,y).dotation : 0), 0);
    const R0 = loyers - charges - interets;
    let base;
    if(y === y0 && !o) base = Math.max(0, f0.resultatFiscal - f0.deficitsImputes);
    else { const ded = Math.max(0, Math.min(dot, R0)); const reste = Math.max(0, R0 - ded); const use = Math.min(ard, reste); ard = ard - use + (dot - ded); base = Math.max(0, reste - use); }
    const micro = loyers <= MICRO.plafond ? Math.max(MICRO.minimum, loyers * (1 - MICRO.abattement)) : null;
    out.push({y, interets, dot, base, micro, ard, estime: !!o || y !== y0});
  }
  return out;
}
function abattements(n){
  const ir = n < 6 ? 0 : n <= 21 ? (n-5)*6 : 100;
  const ps = n < 6 ? 0 : n <= 21 ? (n-5)*1.65 : n === 22 ? 28 : n < 30 ? 28 + (n-22)*9 : 100;
  return {ir: Math.min(ir,100)/100, ps: Math.min(ps,100)/100};
}
function surtaxe(pv){
  const T = [[50000,60000,0.02,1/20],[60000,100000,0.02],[100000,110000,0.03,1/10],[110000,150000,0.03],[150000,160000,0.04,0.15],[160000,200000,0.04],[200000,210000,0.05,0.2],[210000,250000,0.05],[250000,260000,0.06,0.25]];
  if(pv <= 50000) return 0;
  if(pv > 260000) return pv * 0.06;
  const t = T.find(([a,b]) => pv > a && pv <= b);
  return t[3] ? pv * t[2] - (t[1] - pv) * t[3] : pv * t[2];
}
function calculPlusValue(p){
  const fraisAcq = p.fraisAcqForfait ? p.prixAchat * 0.075 : (p.fraisAcq||0);
  const ans = Math.floor((Date.parse(p.dateVente) - Date.parse(p.dateAchat)) / (365.25*864e5));
  const travaux = p.travauxForfait && ans > 5 ? p.prixAchat * 0.15 : (p.travaux||0);
  const calc = amort => {
    const prixRevient = p.prixAchat + fraisAcq + travaux - amort;
    const pv = Math.max(0, p.prixVente - (p.fraisVente||0) - prixRevient);
    const ab = abattements(ans), pvIR = pv * (1 - ab.ir), pvPS = pv * (1 - ab.ps);
    const ir = pvIR * 0.19, ps = pvPS * PS_PLUSVALUE, st = surtaxe(pvIR);
    return {prixRevient, pv, ab, pvIR, pvPS, ir, ps, st, total: ir + ps + st};
  };
  return {ans, fraisAcq, travaux, avec: calc(p.amortissements||0), sans: calc(0)};
}

function courbes(xs, series, marque, h = 210){
  const W = 640, px = 46, py = 14, pr = 22, max = Math.max(1, ...series.flatMap(s=>s.v)) * 1.08;
  const X = k => px + k / Math.max(1, xs.length-1) * (W - px - pr), Y = v => py + (1 - v/max) * (h - py - 26);
  const grad = [0, 0.5, 1].map(f => `<line x1="${px}" x2="${W-pr}" y1="${Y(max*f/1.08)}" y2="${Y(max*f/1.08)}" stroke="var(--line)" stroke-dasharray="${f?"3 4":""}"/><text x="${px-6}" y="${Y(max*f/1.08)+4}" text-anchor="end" font-size="10.5" fill="var(--faint)">${!f?"0":max>=3000?Math.round(max*f/1.08/1000)+" k":Math.round(max*f/1.08)}</text>`).join("");
  const km = xs.indexOf(marque);
  return `<svg viewBox="0 0 ${W} ${h}" width="100%" role="img">${grad}

function parametresRevenus(){

/* ---- Contrôles avant déclaration ---- */
/* Chaque contrôle : [niveau, texte, page] avec niveau "ok" (vérifié), "warn" (à regarder) ou "bad" (à corriger),
   et la page où régler le point (facultatif) */
function controles(y){
  const ex = exercice(y), es = ex.ecritures || [], c = calculAnnee(y), out = [];
  const chk = (cond, okTxt, niveau, koTxt, page) => out.push(cond ? ["ok", okTxt] : [niveau, koTxt, page]);
  const hors = es.filter(e => yearOf(e.date) !== y);
  chk(!hors.length, "Toutes les écritures sont datées de l'exercice.", "bad", `${hors.length} écriture(s) datée(s) hors de ${y} : corrigez leur date.`, "ecritures");
  const nuls = es.filter(e => !(e.montant > 0));
  chk(!nuls.length, "Aucun montant nul ou négatif.", "bad", `${nuls.length} écriture(s) à montant nul ou négatif.`, "ecritures");
  chk(!c.t.inconnues, "Toutes les natures sont reconnues.", "bad", `${c.t.inconnues} écriture(s) à nature inconnue, classées par défaut en charges externes.`, "ecritures");
  const moisLoyer = new Set(es.filter(e => e.nature === "Loyer").map(e => monthOf(e.date)));
  const debut = y === yearOf(debutLMNP()) ? monthOf(debutLMNP()) : 1;
  const attendus = [...Array(13 - debut).keys()].map(i => i + debut).filter(m => y < new Date().getFullYear() || m <= new Date().getMonth()+1);
  const manq = attendus.filter(m => !moisLoyer.has(m));
  chk(!manq.length, `Un loyer saisi pour chacun des ${attendus.length} mois.`, "warn", `Loyer manquant : ${manq.map(m=>MOIS[m-1]).join(", ")}.`, "ecritures");
  if(c.produits > 5000) chk(!!c.t.parNature["CFE"], "CFE saisie.", "warn", "Aucune CFE saisie alors que les recettes dépassent 5 000 € : vérifiez l'avis dans l'espace professionnel impots.gouv, puis saisissez-la comme dépense.", "ecritures");
  const pm = piecesManquantes(y).length;
  chk(!pm, "Toutes les pièces justificatives sont rattachées.", "warn", `${pm} justificatif(s) manquant(s).`, "pieces");
  const aTrier = (S.data.banque?.aTrier || []).filter(o => yearOf(o.date) === y).length;
  chk(!aTrier, "Aucune opération bancaire de l'année en attente de tri.", "warn", `${aTrier} opération(s) bancaire(s) de ${y} encore à trier.`, "banque");
  const vus = {}, dbl = [];
  es.forEach(e => { const k = `${e.date}|${e.nature}|${e.montant}`; if(vus[k]) dbl.push(e); vus[k] = true; });
  chk(!dbl.length, "Aucun doublon apparent.", "warn", `${dbl.length} écriture(s) en double apparent (même date, nature et montant) : vérifiez qu'il ne s'agit pas d'une saisie répétée.`, "ecritures");
  const gros = es.filter(e => e.nature === "Petit équipement (< 500 € HT)" && e.montant > 600);
  chk(!gros.length, "Aucun petit équipement au-dessus du seuil.", "warn", `${gros.length} « petit équipement » de plus de 600 € TTC : au-delà de 500 € HT par élément, il faut l'amortir (page Logement et meubles).`, "immos");
  if(S.data.emprunts.length){
    chk(c.interetsSaisis, "Intérêts d'emprunt saisis d'après la banque.", "warn", `Intérêts non saisis : l'échéancier théorique (${eur(c.interetsEch)}) est utilisé. Saisissez les montants réellement prélevés.`, "ecritures");
    const crdB = ex.crdBanque != null && ex.crdBanque !== "";
    chk(crdB, "Capital restant dû au 31/12 saisi d'après la banque.", "warn", "Capital restant dû au 31/12 non saisi : le bilan utilise l'échéancier théorique.", "emprunt");
    if(crdB && Math.abs(Number(ex.crdBanque) - c.crdEch) > 50) out.push(["warn", `Écart de ${eur(Math.abs(Number(ex.crdBanque) - c.crdEch))} entre le capital restant dû de la banque et l'échéancier : vérifiez les paramètres de l'emprunt.`, "emprunt"]);
  }
  const prec = exercice(y-1);
  if(y > yearOf(debutLMNP())) chk(!!prec && (!isHistorique(y-1) || prec.chiffres?.immobilisationsNettes != null), `Colonne N-1 (${y-1}) disponible pour la 2033-A.`, "warn", `Chiffres ${y-1} incomplets : la colonne « année précédente » du bilan (2033-A) sera à remplir à la main lors de la déclaration.`);
  const f = fiscalJusqua(y);
  if(f.perimes?.length) out.push(["warn", `Déficit(s) de plus de 10 ans perdu(s) cette année : ${f.perimes.map(d=>d.annee+" ("+eur(d.montant)+")").join(", ")}.`]);
  return out;
}

/* ============ Banque : import du relevé CSV et tri ============ */
const IGNORER = "__ignorer";
const norm = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/\s+/g," ").trim();
/* Lecture CSV : guillemets, séparateur ; , ou tabulation, retours à la ligne entre guillemets */
function parseCSV(txt, sep){
  const rows = []; let row = [], f = "", q = false;
  for(let i=0;i<txt.length;i++){
    const c = txt[i];
    if(q){ if(c === '"'){ if(txt[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if(c === '"' && f.trim() === ""){ q = true; f = ""; }
    else if(c === sep){ row.push(f); f = ""; }
    else if(c === "\n" || c === "\r"){ if(c === "\r" && txt[i+1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += c;
  }
  if(f !== "" || row.length){ row.push(f); rows.push(row); }
  return rows.map(r => r.map(x => x.trim())).filter(r => r.some(x => x !== ""));
}
function lireDate(s){
  s = String(s||"").trim(); let m, d;
  if((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/))) d = `${m[1]}-${m[2]}-${m[3]}`;
  else if((m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4}|\d{2})$/))) d = `${m[3].length===2?"20"+m[3]:m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  else return null;
  const t = new Date(d+"T12:00:00");
  return !isNaN(t) && t.toISOString().slice(0,10) === d ? d : null;
}
function lireMontant(s){
  let t = String(s||"").replace(/[\s  €"']/g,"").replace(/EUR$/i,"");
  if(!t) return null;
  let neg = false;
  if(/^\(.*\)$/.test(t)){ neg = true; t = t.slice(1,-1); }
  if(/-$/.test(t)){ neg = true; t = t.slice(0,-1); }
  const c = t.lastIndexOf(","), p = t.lastIndexOf(".");
  if(c > -1 && p > -1) t = c > p ? t.replace(/\./g,"").replace(",",".") : t.replace(/,/g,"");
  else if(c > -1) t = t.replace(",",".");
  if(!/^[+-]?\d+(\.\d+)?$/.test(t)) return null;
  return neg ? -Number(t) : Number(t);
}
async function lireTexte(file){
  const buf = await file.arrayBuffer();
  try{ return new TextDecoder("utf-8",{fatal:true}).decode(buf); }
  catch(_){ return new TextDecoder("windows-1252").decode(buf); } // exports des banques françaises souvent en Latin-1
}
function analyserCSV(txt, nom){
  txt = txt.replace(/^﻿/,"");
  let best = null;
  for(const sep of [";","\t",","]){
    const rows = parseCSV(txt, sep), cnt = {};
    rows.forEach(r => { if(r.length >= 3) cnt[r.length] = (cnt[r.length]||0) + 1; });
    const top = Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
    if(top && (!best || top[1] > best.f)) best = {sep, rows, n:Number(top[0]), f:top[1]};
  }
  if(!best) throw new Error("Aucun tableau reconnu dans ce fichier. Vérifiez qu'il s'agit bien d'un export CSV du compte.");

function devinerColonnes(header, data){
  const part = (i, fn) => data.slice(0,30).filter(r => fn(r[i])).length / Math.min(data.length,30);
  const idx = [...Array((header||data[0]).length).keys()];
  const h = re => header ? idx.find(i => re.test(norm(header[i]))) ?? -1 : -1;
  const m = {date:-1, lib:-1, lib2:-1, montant:-1, debit:-1, credit:-1, mode:"m"};
  m.date = h(/date.*op/); if(m.date < 0) m.date = h(/date/);
  if(m.date < 0) m.date = idx.find(i => part(i, lireDate) > .8) ?? -1;
  for(const re of [/libell/, /label|intitul|description/, /operation$/]){ m.lib = h(re); if(m.lib >= 0 && m.lib !== m.date) break; m.lib = -1; }
  m.montant = h(/montant|amount|somme/); m.debit = h(/debit/); m.credit = h(/credit/);
  if(m.debit >= 0 && m.credit >= 0 && m.montant < 0) m.mode = "dc";
  if(m.mode === "m" && m.montant < 0) m.montant = [...idx].reverse().find(i => i !== m.date && part(i, v => lireMontant(v) != null) > .8) ?? -1;
  if(m.lib < 0){ const lg = i => data.slice(0,30).reduce((s,r)=>s+(lireMontant(r[i])==null && !lireDate(r[i]) ? r[i].length : 0),0); m.lib = idx.filter(i=>i!==m.date).sort((a,b)=>lg(b)-lg(a))[0] ?? -1; }
  return m;
}
function operationsImport(imp){

    const date = lireDate(r[m.date]);

    const libelle = [r[m.lib], m.lib2 >= 0 ? r[m.lib2] : ""].filter(Boolean).join(" ").replace(/\s+/g," ").trim();
    if(!date || mt == null || isNaN(mt) || Math.abs(mt) < 0.005){ rejets++; return; }

function clesConnues(){

/* ---- Clôture guidée et ouverture de l'exercice suivant ---- */
function changementsAnnee(y){
  // Ce qui change entre y et y+1 : fins d'amortissement, fin du prêt, déficits qui expirent
  const out = [];
  S.data.immobilisations.forEach(i => {
    const plan = planAmort(i), der = plan[plan.length-1];
    if(der && der.annee === y) out.push(`${esc(i.libelle)} finit d'être amorti en ${y} : la dotation baisse de ${eur(amortAnnee(i,y).dotation)} en ${y+1}.`);
    if(der && der.annee === y+1) out.push(`${esc(i.libelle)} finit d'être amorti en ${y+1} (dernière dotation : ${eur(amortAnnee(i,y+1).dotation)}).`);
  });
  S.data.emprunts.forEach(l => { const r = echeancier(l), der = r[r.length-1]; if(der && (der.annee === y+1)) out.push(`Le prêt ${esc(l.banque)} se termine en ${MOIS_LONG[der.mois-1]} ${y+1} : plus d'intérêts déductibles ensuite.`); });
  const f = fiscalJusqua(y);
  (f.deficitsFin||[]).forEach(d => { if(y+1 - d.annee > DUREE_DEFICIT - 1) out.push(`Le déficit de ${d.annee} (${eur(d.montant)}) doit être imputé en ${y+1}, sinon il sera perdu.`); });
  if(f.ardFin > 0.5) out.push(`${eur(f.ardFin)} d'amortissements en réserve sont reportés sur ${y+1} et les années suivantes, sans limite de durée.`);
  return out;
}
function vueCloture(y){
  const ex = exercice(y), l = controles(y), bad = l.filter(x=>x[0]==="bad"), warn = l.filter(x=>x[0]==="warn");
  const f = fiscalJusqua(y), c = f.c, chg = changementsAnnee(y);
  const step = (n, titre, corps) => `<div class="card"><h3><span class="case" style="margin-right:8px">${n}</span>${titre}</h3>${corps}</div>`;
  return entete(`Clôturer ${y}`, "Vérifier, figer les chiffres déclarés, puis ouvrir l'année suivante. La clôture verrouille les saisies ; vous pourrez rouvrir l'année si besoin.") +
  step(1, "Contrôles", bad.length ? `<div class="alert bad">${bad.length} point(s) à corriger avant de clôturer :</div><ul>${bad.map(x=>`<li>${x[1]}</li>`).join("")}</ul>`
    : warn.length ? `<div class="alert warn">${warn.length} point(s) à vérifier. Vous pouvez clôturer si vous les avez regardés.</div><ul>${warn.map(x=>`<li>${x[1]}</li>`).join("")}</ul>` : `<div class="alert ok">Tous les contrôles sont validés.</div>`) +
  step(2, "Sommes dues et à recevoir au 31/12", `<p class="sub" style="margin:0 0 10px">En comptabilité super-simplifiée, seules les sommes dues ou à recevoir au 31 décembre s'ajoutent à la trésorerie. Par exemple : un loyer de décembre encaissé en janvier, une facture de décembre payée en janvier. Saisissez-les comme écritures datées du 31/12/${y}.</p>
    <label style="flex-direction:row;align-items:center;gap:8px;color:var(--text)"><input type="checkbox" id="clRegul"> J'ai vérifié les sommes dues et à recevoir au 31/12/${y}.</label>`) +
  step(3, "Chiffres figés à la clôture", `<table>
    <tr><td>Résultat fiscal ${y}</td><td class="n"><b>${eur(f.resultatFiscal)}</b></td></tr>
    <tr><td>Amortissements en réserve reportés sur ${y+1}</td><td class="n">${eur(f.ardFin)}</td></tr>
    <tr><td>Déficits reportables sur ${y+1}</td><td class="n">${eur(f.deficitsFin.reduce((s,d)=>s+d.montant,0))}</td></tr>
    <tr><td>Capital restant dû au 31/12/${y}</td><td class="n">${eur(c.crd)}</td></tr></table>
    <div class="form" style="margin-top:14px"><label>Date d'envoi de la déclaration (facultatif)<input type="date" id="clDecl" value="${ex.dateDeclaration||""}"></label></div>
    <p class="sub" style="margin:8px 0 0">Ces chiffres sont mémorisés : si une modification ultérieure les change, le tableau de bord vous préviendra.</p>`) +
  step(4, `Ce qui change en ${y+1}`, chg.length ? `<ul style="margin:0">${chg.map(t=>`<li>${t}</li>`).join("")}</ul>` : `<p class="sub" style="margin:0">Rien de particulier : mêmes amortissements et même emprunt.</p>`) +
  `<div class="row"><button class="btn" onclick="cloturer(${y})" ${bad.length?"disabled":""}>Clôturer ${y}${exercice(y+1)?"":` et ouvrir ${y+1}`}</button><button class="btn ghost" onclick="S.cloture=null;renderAll()">Annuler</button></div>`;
}
function cloturer(y){
  if(!$("#clRegul").checked) return alert("Cochez d'abord la vérification des sommes dues et à recevoir au 31/12 (étape 2).");
  const ex = exercice(y), f = fiscalJusqua(y), d = $("#clDecl").value;
  ex.statut = "cloture"; delete S.unlocked[y];
  ex.cloture = {date:new Date().toISOString().slice(0,10), resultatFiscal:r2(f.resultatFiscal), ardFin:r2(f.ardFin), deficitsFin:r2(f.deficitsFin.reduce((s,x)=>s+x.montant,0)), crdFin:r2(f.c.crd)};
  if(d) ex.dateDeclaration = d; else delete ex.dateDeclaration;
  const nouveau = !exercice(y+1);
  if(nouveau) S.data.exercices[y+1] = {statut:"en-cours", ecritures:[]};
  S.cloture = null; S.year = y+1; S.tab = "accueil"; setDirty(); renderAll(); scrollTo(0,0);
  toast(`Exercice ${y} clôturé${nouveau?`, exercice ${y+1} ouvert`:""}.`);
}

function nouvelExercice(){
  const y = Math.max(...Object.keys(S.data.exercices).map(Number)) + 1;
  S.data.exercices[y] = {statut:"en-cours", ecritures:[]}; S.year = y; S.tab = "ecritures"; setDirty(); renderAll();
}

addEventListener("beforeprint", () => document.querySelectorAll("#main details").forEach(d => { if(!d.open){ d.open = true; d.dataset.ferme = "1"; } }));
addEventListener("afterprint", () => document.querySelectorAll("#main details[data-ferme]").forEach(d => { d.open = false; delete d.dataset.ferme; }));
renderAll();
</script>
</body>
</html>
