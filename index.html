/* ============ Comptabilité : écritures en partie double, balance, FEC ============ */
/* Reconstitue les écritures comptables d'un exercice à partir des saisies (rien n'est stocké en plus) */
function ecrituresComptables(y){
  const out = [], c = calculAnnee(y), fin = `${y}-12-31`, debut = `${y}-01-01`;
  const add = (journal, date, lib, lignes, piece, src) => { lignes = lignes.filter(l => Math.abs(l.d||0) > 0.004 || Math.abs(l.cr||0) > 0.004); if(lignes.length) out.push({journal, date, lib, lignes, piece, src}); };
  // À-nouveaux : immobilisations, amortissements antérieurs, emprunt ; le compte de l'exploitant équilibre
  const an = [];
  S.data.immobilisations.forEach(i => {
    if(anneeEntreeBilan(i) > y) return;
    const a = amortAnnee(i, y), k = CPT_IMMO[i.categorie] || CPT_IMMO.travaux, terrain = r2(i.valeurOrigine - baseAmort(i));
    if(terrain > 0) an.push({c:"211000", d:terrain});
    an.push({c:k.brut, d:baseAmort(i)}, {c:k.am, cr:r2(a.cumulDebut)});
  });
  const crdDebut = soldeGL164(y-1);
  if(crdDebut > 0) an.push({c:"164000", cr:r2(crdDebut)});
  const solde = r2(an.reduce((s,l)=>s+(l.d||0)-(l.cr||0),0));
  an.push(solde >= 0 ? {c:"108000", cr:solde} : {c:"108000", d:-solde});
  add("AN", debut, "À-nouveaux au 1er janvier", an);
  // Mouvements de banque saisis
  [...(exercice(y).ecritures||[])].sort((a,b)=>a.date.localeCompare(b.date)).forEach(e => {
    const k = compteNature(e.nature), m = r2(e.montant), lib = [e.tiers, e.nature].filter(Boolean).join(" - ");
    const recette = (NATURES[e.nature]?.g || (e.sens==="recette"?"recette":"charge")) === "recette";
    add("BQ", e.date, lib, recette ? [{c:"512000", d:m}, {c:k, cr:m}] : [{c:k, d:m}, {c:"512000", cr:m}], e.piece ? e.piece.split("/").pop() : e.id, e);
  });
  // Dotations aux amortissements, par catégorie
  const dot = {};
  c.immos.forEach(x => { if(x.entree <= y && x.a.dotation > 0){ const k = (CPT_IMMO[x.i.categorie] || CPT_IMMO.travaux).am; dot[k] = (dot[k]||0) + x.a.dotation; } });
  Object.entries(dot).forEach(([k,v]) => add("OD", fin, "Dotation aux amortissements " + y, [{c:"681120", d:r2(v)}, {c:k, cr:r2(v)}]));
  // Régularisation du restant dû saisie dans le dossier (page Emprunt) : écart entre le 164 et l'échéancier de la banque
  const rg = regulCRD(y);
  if(rg) add("OD", fin, "Régularisation du capital restant dû selon l'échéancier" + (exercice(y).regulCRD.motif ? " - " + exercice(y).regulCRD.motif : ""), rg > 0 ? [{c:"108000", d:rg}, {c:"164000", cr:rg}] : [{c:"164000", d:-rg}, {c:"108000", cr:-rg}]);
  return out;
}
/* Solde du compte 164 au 31/12, repris au bilan : figé pour une année clôturée ou reprise, sinon celui de l'an passé moins le capital remboursé
   saisi en banque, plus la régularisation éventuelle */
const regulCRD = y => r2(Number(exercice(y)?.regulCRD?.montant) || 0);
function soldeGL164(y){
  const ex = exercice(y);
  if(!ex || ex.statut === "historique" || (ex.statut === "cloture" && ex.cloture?.crdFin != null)) return crdAu31(y);
  const rembourse = (ex.ecritures||[]).filter(e => e.nature === "Remboursement emprunt").reduce((s,e) => s + e.montant, 0);
  return r2(soldeGL164(y-1) - rembourse + regulCRD(y));
}
/* Écart à expliquer : restant dû de l'échéancier de la banque moins le solde du 164 au 31/12 (le bilan reprend le 164) */
function ecartCRD(y){
  const ex = exercice(y);
  if(!S.data.emprunts.length || !ex || ex.statut === "historique" || ex.statut === "cloture") return 0;
  return r2(crdEcheancier(y) - soldeGL164(y));
}
function regulariserCRD(){
  const y = S.year, ex = exercice(y), e = ecartCRD(y); if(verrouille(y) || Math.abs(e) < 0.005) return;
  const motif = prompt(`Régulariser ${eur(Math.abs(e))} au 31/12/${y} entre l'emprunt (164) et le compte de l'exploitant (108), pour que le grand livre retombe sur l'échéancier de la banque.\n\nMotif (facultatif) :`, ex.regulCRD?.motif || "Restant dû des bilans antérieurs");
  if(motif === null) return;
  ex.regulCRD = {montant:r2(regulCRD(y) + e), motif:motif.trim(), date:new Date().toISOString().slice(0,10)};
  setDirty(); renderAll();
}
function supprimerRegulCRD(){ const ex = exercice(S.year); if(verrouille(S.year) || !confirm("Supprimer la régularisation du restant dû ?")) return; delete ex.regulCRD; setDirty(); renderAll(); }
function balance(y){
  const b = {};
  ecrituresComptables(y).forEach(e => e.lignes.forEach(l => { const x = b[l.c] ??= {d:0, cr:0}; x.d += l.d||0; x.cr += l.cr||0; }));
  return Object.entries(b).sort((a,b)=>a[0].localeCompare(b[0])).map(([c,x]) => ({c, lib:COMPTES[c]||"", d:r2(x.d), cr:r2(x.cr), solde:r2(x.d-x.cr)}));
}
/* Fichier des écritures comptables (art. A.47 A-1 du LPF) : 18 colonnes, tabulations, ISO-8859-15 */
function exporterFEC(y){
  const num = v => (v||0).toFixed(2).replace(".", ","), dt = d => d.replace(/-/g,"");
  const net = t => String(t||"").replace(/[\t\r\n|]+/g," ").trim();
  const JL = {AN:"A-nouveaux", BQ:"Banque", OD:"Opérations diverses"};
  const cols = ["JournalCode","JournalLib","EcritureNum","EcritureDate","CompteNum","CompteLib","CompAuxNum","CompAuxLib","PieceRef","PieceDate","EcritureLib","Debit","Credit","EcritureLet","DateLet","ValidDate","Montantdevise","Idevise"];
  const ecr = ecrituresComptables(y).sort((a,b)=>a.date.localeCompare(b.date) || (a.journal==="AN"?-1:b.journal==="AN"?1:0));
  const lignes = [cols.join("\t")];
  ecr.forEach((e,i) => e.lignes.forEach(l => lignes.push([e.journal, JL[e.journal], String(i+1).padStart(6,"0"), dt(e.date), l.c, net(COMPTES[l.c]), "", "", net(e.piece||e.journal+(i+1)), dt(e.date), net(e.lib), num(l.d), num(l.cr), "", "", dt(e.date), "", ""].join("\t"))));
  const txt = lignes.join("\r\n") + "\r\n";
  // Encodage ISO-8859-15 (€, œ, Œ ont leur propre code ; le reste du Latin-1 est identique)
  const spec = {"€":0xA4, "Œ":0xBC, "œ":0xBD, "Š":0xA6, "š":0xA8, "Ž":0xB4, "ž":0xB8, "Ÿ":0xBE, "’":0x27, "‘":0x27, "«":0xAB, "»":0xBB};
  const bytes = new Uint8Array([...txt].map(ch => spec[ch] ?? (ch.charCodeAt(0) < 256 ? ch.charCodeAt(0) : 0x3F)));
  const siren = (S.data.dossier.siren||"").padStart(9,"0").slice(-9);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([bytes], {type:"text/plain;charset=iso-8859-15"}));
  a.download = `${siren}FEC${y}1231.txt`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  toast(`FEC ${y} téléchargé : ${lignes.length-1} lignes.`);
}

/* ============ Simulations : micro-BIC contre réel, plus-value à la revente ============ */
const PS_REVENUS = 0.186;   // prélèvements sociaux sur les revenus LMNP depuis la LFSS 2026
const PS_PLUSVALUE = 0.172; // plus-values immobilières : taux inchangé
const MICRO = {plafond:77700, abattement:0.5, minimum:305}; // meublé de longue durée non classé
function simu(){ S.data.dossier.simu ??= {}; return S.data.dossier.simu; }
function majSimu(k, v){ simu()[k] = v; setDirty(); renderAll(); }
/* Projection : mêmes loyers et charges que l'année de référence (ou ceux des curseurs), intérêts selon l'échéancier, amortissements selon les plans */
function projection(y0, n, o){
  const c0 = calculAnnee(y0), f0 = fiscalJusqua(y0);
  const loyers = o?.loyers ?? c0.produits, charges = o?.charges ?? (c0.c242 + c0.c244);
  let ard = o ? f0.ardDebut : f0.ardFin, out = [];
  for(let y = y0; y < y0 + n; y++){
    let interets = 0; S.data.emprunts.forEach(l => interets += empruntAnnee(l, y).interets);
    if(y === y0) interets = c0.interets;
    const dot = S.data.immobilisations.reduce((s,i)=>s + (anneeEntreeBilan(i) <= y ? amortAnnee(i,y).dotation : 0), 0);
    const R0 = loyers - charges - interets;
    let base;
    if(y === y0 && !o) base = Math.max(0, f0.resultatFiscal - f0.deficitsImputes);
    else { const ded = Math.max(0, Math.min(dot, R0)); const reste = Math.max(0, R0 - ded); const use = Math.min(ard, reste); ard = ard - use + (dot - ded); base = Math.max(0, reste - use); }
    const micro = loyers <= MICRO.plafond ? Math.max(MICRO.minimum, loyers * (1 - MICRO.abattement)) : null;
    out.push({y, interets, dot, base, micro, ard, estime: !!o || y !== y0});
  }
  return out;
}
function abattements(n){
  const ir = n < 6 ? 0 : n <= 21 ? (n-5)*6 : 100;
  const ps = n < 6 ? 0 : n <= 21 ? (n-5)*1.65 : n === 22 ? 28 : n < 30 ? 28 + (n-22)*9 : 100;
  return {ir: Math.min(ir,100)/100, ps: Math.min(ps,100)/100};
}
function surtaxe(pv){
  const T = [[50000,60000,0.02,1/20],[60000,100000,0.02],[100000,110000,0.03,1/10],[110000,150000,0.03],[150000,160000,0.04,0.15],[160000,200000,0.04],[200000,210000,0.05,0.2],[210000,250000,0.05],[250000,260000,0.06,0.25]];
  if(pv <= 50000) return 0;
  if(pv > 260000) return pv * 0.06;
  const t = T.find(([a,b]) => pv > a && pv <= b);
  return t[3] ? pv * t[2] - (t[1] - pv) * t[3] : pv * t[2];
}
function calculPlusValue(p){
  const fraisAcq = p.fraisAcqForfait ? p.prixAchat * 0.075 : (p.fraisAcq||0);
  const ans = Math.floor((Date.parse(p.dateVente) - Date.parse(p.dateAchat)) / (365.25*864e5));
  const travaux = p.travauxForfait && ans > 5 ? p.prixAchat * 0.15 : (p.travaux||0);
  const calc = amort => {
    const prixRevient = p.prixAchat + fraisAcq + travaux - amort;
    const pv = Math.max(0, p.prixVente - (p.fraisVente||0) - prixRevient);
    const ab = abattements(ans), pvIR = pv * (1 - ab.ir), pvPS = pv * (1 - ab.ps);
    const ir = pvIR * 0.19, ps = pvPS * PS_PLUSVALUE, st = surtaxe(pvIR);
    return {prixRevient, pv, ab, pvIR, pvPS, ir, ps, st, total: ir + ps + st};
  };
  return {ans, fraisAcq, travaux, avec: calc(p.amortissements||0), sans: calc(0)};
}

function courbes(xs, series, marque, h = 210){
  const W = 640, px = 46, py = 14, pr = 22, max = Math.max(1, ...series.flatMap(s=>s.v)) * 1.08;
  const X = k => px + k / Math.max(1, xs.length-1) * (W - px - pr), Y = v => py + (1 - v/max) * (h - py - 26);

  const km = xs.indexOf(marque);
  return `<svg viewBox="0 0 ${W} ${h}" width="100%" role="img" aria-label="${esc(series.map(s=>`${eur0(s.v[0])} en ${xs[0]}, ${eur0(s.v.at(-1))} en ${xs.at(-1)}`).join(" ; "))}">${grad}
    ${series.map(s=>`<path d="${s.v.map((v,k)=>`${k?"L":"M"}${X(k).toFixed(1)},${Y(v).toFixed(1)}`).join(" ")}" fill="none" stroke="${s.col}" stroke-width="${s.dash?2:2.5}" ${s.dash?'stroke-dasharray="5 5"':""}/>`).join("")}
    ${xs.map((x,k)=>xs.length<=16||k%5===0||k===km?`<text x="${X(k).toFixed(1)}" y="${h-8}" text-anchor="middle" font-size="10.5" fill="${k===km?"var(--text)":"var(--faint)"}" font-weight="${k===km?600:400}">${x}</text>`:"").join("")}
    ${km>=0?`<line x1="${X(km)}" x2="${X(km)}" y1="${py}" y2="${h-26}" stroke="var(--accent)" stroke-dasharray="2 3"/>${series.filter(s=>!s.dash).map(s=>`<circle cx="${X(km)}" cy="${Y(s.v[km])}" r="5.5" fill="${s.col}" stroke="var(--surface)" stroke-width="2"/>`).join("")}`:""}
  </svg>`;
}
function parametresRevenus(){

/* ---- Contrôles avant déclaration ---- */
/* Chaque contrôle : [niveau, texte, page] avec niveau "ok" (vérifié), "warn" (à regarder) ou "bad" (à corriger),
   et la page où régler le point (facultatif) */
function controles(y){
  const ex = exercice(y), es = ex.ecritures || [], c = calculAnnee(y), out = [];
  const chk = (cond, okTxt, niveau, koTxt, page) => out.push(cond ? ["ok", okTxt] : [niveau, koTxt, page]);
  const hors = es.filter(e => yearOf(e.date) !== y);
  chk(!hors.length, "Toutes les écritures sont datées de l'exercice.", "bad", `${hors.length} écriture${pl(hors.length)} datée${pl(hors.length)} hors de ${y} : corrigez leur date.`, "ecritures");
  const nuls = es.filter(e => !(e.montant > 0));
  chk(!nuls.length, "Aucun montant nul ou négatif.", "bad", `${nuls.length} écriture${pl(nuls.length)} à montant nul ou négatif.`, "ecritures");
  chk(!c.t.inconnues, "Toutes les natures sont reconnues.", "bad", `${c.t.inconnues} écriture${pl(c.t.inconnues)} à nature inconnue, classées par défaut en charges externes.`, "ecritures");
  const moisLoyer = new Set(es.filter(e => e.nature === "Loyer").map(e => monthOf(e.date)));
  const debut = y === yearOf(debutLMNP()) ? monthOf(debutLMNP()) : 1;
  const attendus = [...Array(13 - debut).keys()].map(i => i + debut).filter(m => y < new Date().getFullYear() || m <= new Date().getMonth()+1);
  const manq = attendus.filter(m => !moisLoyer.has(m));
  chk(!manq.length, `Un loyer saisi pour chacun des ${attendus.length} mois.`, "warn", `Loyer${pl(manq.length)} manquant${pl(manq.length)} : ${manq.map(m=>MOIS[m-1]).join(", ").replace(/\.$/, "")}.`, "ecritures");
  if(c.produits > 5000) chk(!!c.t.parNature["CFE"], "CFE saisie.", "warn", "Aucune CFE saisie alors que les recettes dépassent 5 000 € : vérifiez l'avis dans l'espace professionnel impots.gouv, puis saisissez-la comme dépense.", "ecritures");
  const pm = piecesManquantes(y).length;
  chk(!pm, "Toutes les pièces justificatives sont rattachées.", "warn", `${pm} justificatif${pl(pm)} manquant${pl(pm)}.`, "pieces");
  const aTrier = (S.data.banque?.aTrier || []).filter(o => yearOf(o.date) === y).length;
  chk(!aTrier, "Aucune opération bancaire de l'année en attente de tri.", "warn", `${aTrier} opération${pl(aTrier)} bancaire${pl(aTrier)} de ${y} encore à trier.`, "banque");
  const vus = {}, dbl = [];
  es.forEach(e => { const k = `${e.date}|${e.nature}|${e.montant}`; if(vus[k]) dbl.push(e); vus[k] = true; });
  chk(!dbl.length, "Aucun doublon apparent.", "warn", `${dbl.length} écriture${pl(dbl.length)} en double apparent (même date, nature et montant) : vérifiez qu'il ne s'agit pas d'une saisie répétée.`, "ecritures");
  const gros = es.filter(e => e.nature === "Petit équipement (< 500 € HT)" && e.montant > 600);
  chk(!gros.length, "Aucun petit équipement au-dessus du seuil.", "warn", `${gros.length} « petit équipement » de plus de 600 € TTC : au-delà de 500 € HT par élément, il faut l'amortir (page Immobilisations).`, "immos");
  if(S.data.emprunts.length){
    chk(c.interetsSaisis, "Intérêts d'emprunt saisis d'après la banque.", "warn", `Aucun intérêt d'emprunt comptabilisé : seuls les prélèvements de la banque comptent (${eur(c.interetsEch)} attendus selon l'échéancier). L'échéancier de la page Emprunt montre les mois à rapprocher.`, "emprunt");
    chk(S.data.emprunts.every(l => lignesBanque(l)), "Échéancier de la banque déposé : il sert à contrôler le restant dû.", "warn", "Échéancier de la banque non déposé : le restant dû comptable est contrôlé avec l'échéancier calculé d'après le contrat. Déposez-le sur la page Emprunt.", "emprunt");
    const rp = S.data.emprunts.flatMap(l => etatsRapprochement(l, y).filter(e => e.c !== "ok"));
    chk(!rp.length, "Échéances du prêt rapprochées des écritures bancaires.", "warn", `${rp.length} échéance${rp.length>1?"s":""} du prêt sans écriture ou avec un écart : ${rp.map(e => MOIS[e.r.mois-1]).join(", ").replace(/\.$/, "")}. L'échéancier de la page Emprunt détaille chaque mois.`, "emprunt");
    const ec = ecartCRD(y);
    chk(Math.abs(ec) < 1, "Grand livre de l'emprunt conforme à l'échéancier de la banque.", "warn", `Le grand livre donne ${eur(soldeGL164(y))} de restant dû au 31/12, l'échéancier de la banque ${eur(crdEcheancier(y))} : écart de ${eur(Math.abs(ec))} à expliquer, et à régulariser le cas échéant sur la page Emprunt.`, "emprunt");
  }
  const prec = exercice(y-1);
  if(y > yearOf(debutLMNP())) chk(!!prec && (!isHistorique(y-1) || prec.chiffres?.immobilisationsNettes != null), `Colonne N-1 (${y-1}) disponible pour la 2033-A.`, "warn", `Chiffres ${y-1} incomplets : la colonne « année précédente » du bilan (2033-A) sera à remplir à la main lors de la déclaration.`);
  const xl = ex.reprise?.chiffres?.resultat;
  if(xl != null) chk(Math.abs(c.resultatComptable - xl) < 1, `Résultat comptable identique à l'Excel repris (${eur(xl)}).`, "warn", `Résultat comptable de ${eur(c.resultatComptable)} contre ${eur(xl)} dans l'Excel repris : vérifiez les écritures et les immobilisations.`, "ecritures");
  const f = fiscalJusqua(y);
  if(f.perimes?.length) out.push(["warn", `Déficit${pl(f.perimes.length)} de plus de 10 ans perdu${pl(f.perimes.length)} cette année : ${f.perimes.map(d=>d.annee+" ("+eur(d.montant)+")").join(", ")}.`]);
  return out;
}

const slug = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,30) || "piece";
async function dossierRequis(){
  if(!S.dir){ alert(PARTAGE ? "Sur iPhone, l'outil ne peut pas lire le dossier LMNP : ouvrez la pièce depuis l'app Fichiers (dossier Justificatifs), ou sur ordinateur dans Chrome." : "Les justificatifs sont rangés dans le dossier LMNP : ouvrez l'outil dans Chrome via « Ouvrir le dossier LMNP… »."); return false; }
  if(await S.dir.queryPermission({mode:"readwrite"}) !== "granted" && await S.dir.requestPermission({mode:"readwrite"}) !== "granted") return false;
  return true;

async function justifDir(y, create=true){ return (await S.dir.getDirectoryHandle("Justificatifs",{create})).getDirectoryHandle(String(y),{create}); }
async function handleDepuisChemin(chemin){
  const parts = chemin.split("/"); let d = S.dir;
  for(const p of parts.slice(0,-1)) d = await d.getDirectoryHandle(p);
  return d.getFileHandle(parts[parts.length-1]);
}
async function attacherPiece(id){
  if(PARTAGE && !S.dir) return choisirPieceIPhone(id);
  if(!await dossierRequis()) return;
  const e = findEcr(id);
  let fh;
  try{ [fh] = await window.showOpenFilePicker({id:"pieces", types:[{description:"Justificatifs", accept:{"application/pdf":[".pdf"],"image/*":[".jpg",".jpeg",".png",".heic"]}}]}); }
  catch(err){ return; }
  const file = await fh.getFile();
  const y = yearOf(e.date), dir = await justifDir(y);
  // Fichier déjà dans Justificatifs/<année> ? on le rattache sans copie
  let dejaLa = false;
  try{ const ex = await dir.getFileHandle(file.name); dejaLa = await ex.isSameEntry(fh); }catch(_){}
  let nom = file.name;
  if(!dejaLa){
    const ext = (file.name.match(/\.[A-Za-z0-9]+$/)||[".pdf"])[0].toLowerCase();
    const base = `${e.date}_${slug(e.tiers)}_${slug(e.nature)}`;
    nom = base + ext; let k = 2;
    while(true){ try{ await dir.getFileHandle(nom); nom = `${base}-${k++}${ext}`; }catch(_){ break; } }
    const out = await dir.getFileHandle(nom,{create:true}); const w = await out.createWritable(); await w.write(file); await w.close();
  }
  e.piece = `Justificatifs/${y}/${nom}`; delete e.sansPiece;
  setDirty(); renderAll(); toast(dejaLa ? "Justificatif rattaché." : `Copié dans Justificatifs/${y}/ sous le nom « ${nom} ».`);
}

/* Copie un fichier dans le dossier LMNP et renvoie son chemin relatif */
async function copierDansDossier(file, dossiers, base){
  let dir = S.dir; for(const p of dossiers) dir = await dir.getDirectoryHandle(p, {create:true});
  const ext = (file.name.match(/\.[A-Za-z0-9]+$/)||[".pdf"])[0].toLowerCase();
  let nom = base + ext, k = 2;
  while(true){ try{ await dir.getFileHandle(nom); nom = `${base}-${k++}${ext}`; }catch(_){ break; } }
  const out = await dir.getFileHandle(nom, {create:true}), w = await out.createWritable(); await w.write(file); await w.close();
  return [...dossiers, nom].join("/");
}

/* Fichiers de Justificatifs/<année>/ liés à rien : une facture électronique y est reconnue et rattachée seule, le reste est proposé au rattachement */
async function scanPieces(y){
  if(!S.dir || S.scanPieces) return;
  S.scanPieces = true;
  try{
    if(await S.dir.queryPermission({mode:"readwrite"}) !== "granted") return;
    let dir; try{ dir = await justifDir(y,false); }catch(_){ return; }
    const lies = cheminsLies(), lus = new Set(S.data.facturesLues), libres = [], fichiers = {};
    for await (const [nom, h] of dir.entries()) if(h.kind === "file" && !nom.startsWith(".") && !lies.has(`Justificatifs/${y}/${nom}`)) fichiers[nom] = h;
    let n = 0;
    // Déposés depuis l'iPhone (app Fichiers) : on regarde une seule fois chaque PDF ou XML
    const aLire = [];
    for(const [nom, h] of Object.entries(fichiers)){
      if(!/\.(pdf|xml)$/i.test(nom)) continue;
      const f = await h.getFile(), sig = `${y}/${nom}|${f.size}|${f.lastModified}`;
      if(!lus.has(sig)){ aLire.push(f); S.data.facturesLues.push(sig); }
    }
    if(aLire.length){
      const {out} = await analyserFichiersFactures(aLire);
      for(const {meta, piece, xml} of out) if(enregistrerFacture(meta, `Justificatifs/${y}/${piece.name}`, xml && `Justificatifs/${y}/${xml.name}`)) n++;
      rapprocherFactures(); setDirty();
    }
    const lies2 = cheminsLies();
    for(const nom of Object.keys(fichiers)) if(!lies2.has(`Justificatifs/${y}/${nom}`)) libres.push(nom);
    libres.sort();
    const avant = JSON.stringify(S.libres);
    S.libres = {y, noms:libres};
    if(n || avant !== JSON.stringify(S.libres)) renderAll();
  }catch(_){ }
  finally{ S.scanPieces = false; }
}

/* ============ Factures électroniques reçues (plateforme agréée) ============ */
/* L'export de la plateforme (PDF Factur-X, XML UBL ou CII, ou ZIP de ces fichiers) est déposé sur la page Pièces,
   comme n'importe quelle pièce. Tout est lu dans le navigateur : rien n'est envoyé sur internet. */
const AVOIRS = ["381","261","262","396"];
const factures = () => (S.data.factures ??= []);
const estAvoir = f => AVOIRS.includes(f.type);
/* Écriture qui porte la facture (le lien saute si l'écriture est supprimée ou son justificatif détaché) */
const ecrDeFacture = f => { const e = f.ecriture && findEcr(f.ecriture); return e && e.piece === f.fichier ? e : null; };
const facturesEnAttente = () => factures().filter(f => !f.ignoree && !ecrDeFacture(f));
async function decompresser(u8, format){
  return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream(format))).arrayBuffer());
}
/* XML embarqué dans un PDF Factur-X : on parcourt les flux du PDF et on garde le premier qui contient une facture */
async function xmlDuPdf(u8){
  const t = new TextDecoder("windows-1252").decode(u8); // un caractère par octet : les positions restent celles du fichier
  let i = 0;
  while((i = t.indexOf("stream", i)) >= 0){
    const debut = t.startsWith("\r\n", i+6) ? i+8 : t[i+6] === "\n" ? i+7 : -1;
    if(t.slice(i-3, i) === "end" || debut < 0){ i += 6; continue; }
    const dict = t.slice(t.lastIndexOf("obj", i), i);
    i = debut;
    if(!/EmbeddedFile|text#2Fxml|text\/xml/.test(dict)) continue;
    const lg = dict.match(/\/Length\s+(\d+)(?!\s+\d+\s+R)/);
    let fin = lg ? debut + Number(lg[1]) : t.indexOf("endstream", debut);
    if(!lg) while(fin > debut && (t[fin-1] === "\n" || t[fin-1] === "\r")) fin--;
    let data = u8.subarray(debut, fin);
    try{ if(/FlateDecode/.test(dict)) data = await decompresser(data, "deflate"); }catch(_){ continue; }
    const xml = new TextDecoder().decode(data);
    if(/CrossIndustryInvoice|<(\w+:)?(Invoice|CreditNote)[\s>]/.test(xml)) return xml;
  }
  return null;
}
/* Lecture d'un ZIP (export groupé de la plateforme) */
async function fichiersDuZip(u8){
  return (await entreesZip(u8)).map(e => new File([e.data], e.nom.split("/").pop()));
}
/* Contenu d'un ZIP (chemin complet et octets) : sert aux factures de la plateforme et aux classeurs Excel */
async function entreesZip(u8){
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength), out = [];
  let e = u8.length - 22; while(e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
  if(e < 0) throw new Error("ZIP illisible");
  let p = dv.getUint32(e+16, true);
  for(let k = dv.getUint16(e+10, true); k > 0 && dv.getUint32(p, true) === 0x02014b50; k--){
    const meth = dv.getUint16(p+10, true), taille = dv.getUint32(p+20, true), off = dv.getUint32(p+42, true);
    const ln = dv.getUint16(p+28, true), nom = new TextDecoder().decode(u8.subarray(p+46, p+46+ln));

function chercherDoublon(o){
  const ex = exercice(yearOf(o.date)); if(!ex || !ex.ecritures) return;
  const pris = new Set(S.data.banque.aTrier.filter(x => x !== o && x.doublon).map(x => x.doublon));
  const t = Date.parse(o.date), credit = o.montant > 0;
  const e = ex.ecritures.find(e => !e.banque && !pris.has(e.id) && Math.abs(e.montant - Math.abs(o.montant)) < 0.005
    && ((NATURES[e.nature]?.g === "recette") === credit) && Math.abs(Date.parse(e.date) - t) <= 6*864e5);
  if(e) o.doublon = e.id; else delete o.doublon;
}

function validerImport(){

  const {ops, rejets} = operationsImport(imp);
  if(!ops.length) return alert("Aucune opération lisible avec ces colonnes. Vérifiez la colonne des dates et celle des montants.");
  const B = S.data.banque, connues = clesConnues();
  const nouvelles = ops.filter(o => !connues.has(o.cle));
  let auto = 0;
  nouvelles.forEach(o => {
    const item = appliquerRegles({id:uid(), cle:o.cle, date:o.date, libelle:o.libelle, montant:o.montant, nature:"", tiers:tiersSuggere(o.libelle)});
    if(item.regle) auto++;

  S.imp = null; setDirty(); renderAll();
  toast(`${nouvelles.length} opération${pl(nouvelles.length)} ajoutée${pl(nouvelles.length)} à trier${auto?`, dont ${auto} classée${pl(auto)} par vos règles`:""}. ${ops.length-nouvelles.length} déjà connue${pl(ops.length-nouvelles.length)}${rejets?`, ${rejets} ligne${pl(rejets)} illisible${pl(rejets)} ignorée${pl(rejets)}`:""}.`);
}
function trouverOp(id){ return S.data.banque.aTrier.find(o => o.id === id); }
function majOp(id, k, v){

function memoriserRegle(id){
  const o = trouverOp(id), B = S.data.banque;
  if(!o.nature) return alert("Choisissez d'abord la nature de cette opération, ou « Ignorer ».");
  const mc = prompt("Mot-clé à reconnaître dans le libellé bancaire. Les prochaines opérations qui le contiennent seront classées pareil :", motCleSuggere(o.libelle) || o.libelle.slice(0,20));
  if(!mc || !mc.trim()) return;
  if(!norm(o.libelle).includes(norm(mc))) return alert("Ce mot-clé n'apparaît pas dans le libellé de cette opération.");
  B.regles = B.regles.filter(r => !(norm(r.motCle) === norm(mc) && r.sens === sensOp(o)));
  B.regles.push({id:uid(), motCle:mc.trim(), sens:sensOp(o), nature:o.nature, tiers:o.nature === IGNORER ? "" : (o.tiers||"")});
  o.regle = mc.trim();
  let n = 0;
  B.aTrier.forEach(x => { if(!x.nature && !x.parent){ appliquerRegles(x); if(x.nature){ n++; if(x.nature === IGNORER) delete x.doublon; } } });
  setDirty(); renderAll(); toast(`Règle « ${mc.trim()} » mémorisée${n?`, ${n} autre${pl(n)} opération${pl(n)} classée${pl(n)}`:""}.`);
}
function scinderOp(id){
  const o = trouverOp(id), tot = Math.abs(o.montant), fr = x => x.toLocaleString("fr-FR", {minimumFractionDigits:2, maximumFractionDigits:2});
  // Échéance de prêt reconnue (même mois, même total) : la ventilation de l'échéancier est proposée, natures comprises
  const ech = S.data.emprunts.flatMap(l => echeancier(l)).find(r => r.date.slice(0,7) === o.date.slice(0,7) && Math.abs(r.interet + r.capital + (r.assurance||0) - tot) < 0.02);
  const defaut = ech ? [ech.interet, ...(ech.assurance > 0 ? [ech.capital] : [])].map(fr).join(" + ") : "";
  const v = prompt(`Ventiler ${eur(tot)} sur plusieurs lignes.\nMontants des premières lignes, séparés par « + » : le reste va sur la dernière ligne.${ech ? `\n\nÉchéance de prêt reconnue : intérêts ${eur(ech.interet)}, capital ${eur(ech.capital)}${ech.assurance > 0 ? `, assurance ${eur(ech.assurance)}` : ""}.` : "\nPar exemple, pour une échéance de prêt : intérêts + capital, le reste étant l'assurance."}`, defaut);
  if(v == null || !v.trim()) return;
  const parts = v.split("+").map(x => r2(parseMontant(x))), reste = r2(tot - parts.reduce((t,x) => t + x, 0));
  if(parts.some(x => !(x > 0)) || !(reste > 0)) return alert(`Chaque montant doit être positif, et leur total inférieur à ${eur(tot)}.`);
  const montants = [...parts, reste], sg = Math.sign(o.montant), B = S.data.banque, i = B.aTrier.indexOf(o);
  const natEch = ech && v.trim() === defaut ? ["Intérêts emprunt", ...(ech.assurance > 0 ? ["Remboursement emprunt", "Assurance emprunt"] : ["Remboursement emprunt"])] : null;
  const lignes = montants.map((m, k) => ({...o, id:uid(), montant:r2(sg*m), parent:true, nature: natEch ? natEch[k] : k === 0 ? o.nature : "", tiers:o.tiers}));
  lignes.forEach(p => { delete p.regle; delete p.doublon; });
  B.aTrier.splice(i, 1, ...lignes);
  lignes.forEach(p => { if(p.nature !== IGNORER) chercherDoublon(p); });
  setDirty(); renderAll();
}
function confirmerDoublon(id, oui){
  const o = trouverOp(id), B = S.data.banque;
  if(oui){ const e = findEcr(o.doublon); e.banque = o.cle; e.libelleBanque = o.libelle; B.aTrier = B.aTrier.filter(x => x !== o); toast("Opération rapprochée de l'écriture déjà saisie."); }
  else { delete o.doublon; o.pasDoublon = true; }
  setDirty(); renderAll();
}
function validerTri(){
  const B = S.data.banque, prets = B.aTrier.filter(o => o.nature);
  if(!prets.length) return alert("Aucune opération classée pour l'instant.");
  const derniere = Math.max(...Object.keys(S.data.exercices).map(Number));
  let n = 0, ign = 0; const bloques = new Set(), faites = new Set();
  for(const o of prets){
    if(o.nature === IGNORER){ B.ignorees.push({cle:o.cle, date:o.date, libelle:o.libelle, montant:o.montant}); ign++; faites.add(o); continue; }
    const y = yearOf(o.date);
    if(!exercice(y) && y > derniere) S.data.exercices[y] = {statut:"en-cours", ecritures:[]};
    if(!exercice(y) || isHistorique(y) || verrouille(y)){ bloques.add(y); continue; }
    const ex = exercice(y); ex.ecritures ??= [];
    ex.ecritures.push({id:uid(), date:o.date, tiers:o.tiers||"", nature:o.nature, montant:r2(Math.abs(o.montant)),
      sens: NATURES[o.nature].g === "recette" ? "recette" : "depense", banque:o.cle, libelleBanque:o.libelle});
    n++; faites.add(o);
  }
  B.aTrier = B.aTrier.filter(o => !faites.has(o));
  const lies = rapprocherFactures();
  setDirty(); renderAll();
  toast(`${n} écriture${pl(n)} créée${pl(n)}, ${ign} opération${pl(ign)} ignorée${pl(ign)}${lies?`, ${lies} facture${pl(lies)} reçue${pl(lies)} rattachée${pl(lies)}`:""}.`);
  if(bloques.size) alert(`Certaines opérations restent à trier : l'exercice ${[...bloques].sort().join(", ")} est clôturé, repris de l'Excel ou n'existe pas. Rouvrez-le ou ignorez ces opérations.`);
}

function postesFrequents(credit){
  const freq = {};
  Object.values(S.data.exercices).forEach(ex => (ex.ecritures||[]).forEach(e => freq[e.nature] = (freq[e.nature]||0) + 1));
  S.data.banque.regles.forEach(r => freq[r.nature] = (freq[r.nature]||0) + 2);
  const base = credit ? ["Loyer","Charges refacturées","Autre recette"] : ["Copropriété","Taxe foncière","Intérêts emprunt","Remboursement emprunt","Assurance","Entretien et réparations"];
  const nats = Object.keys(NATURES).filter(n => (NATURES[n].g === "recette") === credit);
  return [...new Set([...nats.filter(n=>freq[n]).sort((a,b)=>freq[b]-freq[a]), ...base])].slice(0, credit ? 3 : 7);
}

/* ---- Clôture guidée et ouverture de l'exercice suivant ---- */
function changementsAnnee(y){
  // Ce qui change entre y et y+1 : fins d'amortissement, fin du prêt, déficits qui expirent
  const out = [];
  S.data.immobilisations.forEach(i => {
    const plan = planAmort(i), der = plan[plan.length-1];
    if(der && der.annee === y) out.push(`${esc(i.libelle)} finit d'être amorti en ${y} : la dotation baisse de ${eur(amortAnnee(i,y).dotation)} en ${y+1}.`);
    if(der && der.annee === y+1) out.push(`${esc(i.libelle)} finit d'être amorti en ${y+1} (dernière dotation : ${eur(amortAnnee(i,y+1).dotation)}).`);
  });
  S.data.emprunts.forEach(l => { const r = echeancier(l), der = r[r.length-1]; if(der && (der.annee === y+1)) out.push(`Le prêt ${esc(l.banque)} se termine en ${MOIS_LONG[der.mois-1]} ${y+1} : plus d'intérêts déductibles ensuite.`); });
  const f = fiscalJusqua(y);
  (f.deficitsFin||[]).forEach(d => { if(y+1 - d.annee > DUREE_DEFICIT - 1) out.push(`Le déficit de ${d.annee} (${eur(d.montant)}) doit être imputé en ${y+1}, sinon il sera perdu.`); });
  if(f.ardFin > 0.5) out.push(`${eur(f.ardFin)} d'amortissements en réserve sont reportés sur ${y+1} et les années suivantes, sans limite de durée.`);
  return out;
}

    <tr><td>Résultat fiscal ${y}</td><td class="n"><b>${eur(f.resultatFiscal)}</b></td></tr>
    <tr><td>Amortissements en réserve reportés sur ${y+1}</td><td class="n">${eur(f.ardFin)}</td></tr>
    <tr><td>Déficits reportables sur ${y+1}</td><td class="n">${eur(f.deficitsFin.reduce((s,d)=>s+d.montant,0))}</td></tr>
    <tr><td>Capital restant dû au 31/12/${y}</td><td class="n">${eur(c.crd)}</td></tr></table>
    <div class="form" style="margin-top:14px"><label>Date d'envoi de la déclaration (facultatif)<input type="date" id="clDecl" value="${ex.dateDeclaration||""}"></label></div>
    <p class="sub" style="margin:8px 0 0">Ces chiffres sont mémorisés : si une modification ultérieure les change, le tableau de bord vous préviendra.</p>`) +
  step(4, `Ce qui change en ${y+1}`, chg.length ? `<ul style="margin:0">${chg.map(t=>`<li>${t}</li>`).join("")}</ul>` : `<p class="sub" style="margin:0">Rien de particulier : mêmes amortissements et même emprunt.</p>`) +
  `<div class="row"><button class="btn" onclick="cloturer(${y})" ${bad.length?"disabled":""}>Clôturer ${y}${exercice(y+1)?"":` et ouvrir ${y+1}`}</button><button class="btn ghost" onclick="S.cloture=null;renderAll()">Annuler</button></div>`;
}
/* Réouverture d'un exercice clôturé : la plus récente seulement, confirmée par la saisie de l'année, motif conservé dans le dossier */
function rouvrirExercice(y){
  const ex = exercice(y); if(ex?.statut !== "cloture" || y !== derniereCloture()) return;
  const decl = ex.dateDeclaration;
  if(!confirm(`Rouvrir ${y} ?\n\n${y} est clôturé${decl ? ` et déclaré le ${fmtDate(decl)}` : ""} : ses chiffres ont pu être transmis à l'administration. Une fois rouvert, ses écritures et ses immobilisations redeviennent modifiables, et toute modification change le résultat ${y} et les reports des années suivantes, qu'il faudrait alors déclarer à nouveau (déclaration rectificative).`)) return;
  const t = prompt(`Pour confirmer, tapez l'année à rouvrir (${y}) :`); if(t === null) return;
  if(t.trim() !== String(y)) return alert("L'année tapée ne correspond pas : rien n'a été rouvert.");
  const motif = (prompt("Motif de la réouverture (obligatoire, conservé dans le dossier) :") || "").trim();
  if(!motif) return alert("Sans motif, rien n'a été rouvert.");
  (ex.reouvertures ??= []).push({date:new Date().toISOString().slice(0,10), motif, cloture:ex.cloture || null});
  ex.statut = "en-cours";
  setDirty(); renderAll(); toast(`${y} est rouvert. Pensez à le clôturer à nouveau une fois la correction faite.`);
}
function cloturer(y){
  if(!$("#clRegul").checked) return alert("Cochez d'abord la vérification des sommes dues et à recevoir au 31/12 (étape 2).");
  const ex = exercice(y), f = fiscalJusqua(y), d = $("#clDecl").value;
  ex.statut = "cloture";
  ex.cloture = {date:new Date().toISOString().slice(0,10), resultatFiscal:r2(f.resultatFiscal), ardFin:r2(f.ardFin), deficitsFin:r2(f.deficitsFin.reduce((s,x)=>s+x.montant,0)), crdFin:r2(f.c.crd)};
  if(d) ex.dateDeclaration = d; else delete ex.dateDeclaration;
  const nouveau = !exercice(y+1);
  if(nouveau) S.data.exercices[y+1] = {statut:"en-cours", ecritures:[]};
  S.cloture = null; S.year = y+1; S.tab = "accueil"; setDirty(); renderAll(); haut();
  toast(`Exercice ${y} clôturé${nouveau?`, exercice ${y+1} ouvert`:""}.`);
}

function nouvelExercice(){
  const y = Math.max(...Object.keys(S.data.exercices).map(Number)) + 1;
  S.data.exercices[y] = {statut:"en-cours", ecritures:[]}; S.year = y; S.tab = "ecritures"; setDirty(); renderAll();
}

/* ---- Reprise d'une année antérieure depuis l'ancien classeur Excel (« Dossier de travail ») ---- */
/* Le classeur est lu dans le navigateur : rien n'est envoyé sur internet. On en tire les écritures des onglets
   mensuels (livre des recettes à gauche, registre des dépenses à droite) ; « Compte de résultat » et « BILAN »
   servent de contrôle. L'année reprise devient une année calculée comme les autres. */
async function lireClasseur(u8){
  const ent = Object.fromEntries((await entreesZip(u8)).map(e => [e.nom, e.data]));
  if(!ent["xl/workbook.xml"]) throw new Error("Ce fichier n'est pas un classeur Excel (.xlsx).");
  const xml = n => new DOMParser().parseFromString(ent[n] ? new TextDecoder().decode(ent[n]) : "<x/>", "application/xml");
  const partages = [...xml("xl/sharedStrings.xml").getElementsByTagName("si")].map(si => [...si.getElementsByTagName("t")].map(t => t.textContent).join(""));
  const rels = Object.fromEntries([...xml("xl/_rels/workbook.xml.rels").getElementsByTagName("Relationship")].map(r => [r.getAttribute("Id"), r.getAttribute("Target")]));
  const colNum = c => [...c].reduce((n, ch) => n*26 + ch.charCodeAt(0) - 64, 0);
  const feuilles = {};
  for(const f of xml("xl/workbook.xml").getElementsByTagName("sheet")){
    const cible = (rels[f.getAttribute("r:id")] || "").replace(/^\//, "").replace(/^(?!xl\/)/, "xl/");
    const g = [];
    for(const c of xml(cible).getElementsByTagName("c")){
      const m = (c.getAttribute("r") || "").match(/^([A-Z]+)(\d+)$/), t = c.getAttribute("t"), v = c.getElementsByTagName("v")[0]?.textContent;
      const val = t === "s" ? partages[+v] : t === "inlineStr" ? c.getElementsByTagName("t")[0]?.textContent : t === "str" ? v : t === "e" || t === "b" ? null : (v != null && v !== "" ? Number(v) : null);
      if(m && val != null && val !== "") (g[+m[2]-1] ??= [])[colNum(m[1])-1] = val;
    }
    feuilles[f.getAttribute("name")] = g;
  }
  return feuilles;
}
const MOIS_XL = MOIS_LONG.map(m => norm(m));
const dateExcel = n => typeof n === "number" ? new Date(Date.UTC(1899, 11, 30) + Math.round(n) * 864e5).toISOString().slice(0,10) : null;
/* Libellés de l'Excel → natures de l'outil (ajustables avant la reprise) */
const NAT_XL = [[/loyer/, "Loyer"], [/refactur|provision/, "Charges refacturées"], [/interet/, "Intérêts emprunt"], [/assurance.*(credit|pret|emprunt)/, "Assurance emprunt"],
  [/copro|syndic/, "Copropriété"], [/assurance|pno/, "Assurance"], [/foncier|fonciere/, "Taxe foncière"], [/\bcfe\b|cotisation fonc/, "CFE"], [/\beau\b/, "Eau"],
  [/electri|\bgaz\b/, "Électricité / gaz"], [/internet|\bbox\b|telecom/, "Internet"], [/entretien|reparation/, "Entretien et réparations"], [/frais bancaire|tenue de compte/, "Frais bancaires"],
  [/honoraire|comptab|\boga\b|\bcga\b/, "Honoraires"], [/agence|gestion/, "Frais de gestion / agence"], [/capital|rembours/, "Remboursement emprunt"], [/petit equip|electromenager/, "Petit équipement (< 500 € HT)"]];
const natureXL = (lib, recette) => (NAT_XL.find(([re, n]) => re.test(norm(lib)) && (NATURES[n].g === "recette") === recette) || [0, recette ? "Autre recette" : "Autre charge"])[1];
function analyserDossierExcel(feuilles, fichier){
  let annee = null; const lignes = [];
  for(const [nom, g] of Object.entries(feuilles)){
    const m = MOIS_XL.indexOf(norm(nom)) + 1; if(!m) continue;
    g.forEach(r => r && r.forEach((v, j) => { if(norm(v).startsWith("annee") && typeof r[j+1] === "number") annee ??= r[j+1]; }));
    const iH = g.findIndex(r => r && r.some(v => norm(v) === "nature") && r.some(v => norm(v) === "montant"));
    if(iH < 0) continue;
    const h = g[iH].map(norm), blocs = [];
    h.forEach((v, j) => { if(v === "nature") blocs.push({nat:j, mt:h.indexOf("montant", j), date:h.lastIndexOf("date", j), recette:!blocs.length}); });
    for(let i = iH + 1; i < g.length; i++){
      const r = g[i] || [];
      blocs.forEach(b => {
        if(norm(r[b.nat]).startsWith("total")) b.fin = true;
        if(b.fin || typeof r[b.mt] !== "number" || Math.abs(r[b.mt]) < 0.005) return;
        lignes.push({mois:m, jour:dateExcel(r[b.date]), tiers:String(r[b.nat-1] ?? "").trim(), lib:String(r[b.nat] ?? "").trim(), montant:r2(r[b.mt]), recette:b.recette});
      });
    }
  }
  if(!lignes.length) throw new Error("Aucune écriture trouvée : le classeur doit avoir un onglet par mois (Janvier, Février…) avec les colonnes « Nature » et « Montant ».");
  // Chiffres de contrôle : premier montant à droite du libellé (colonne « Exercice N »)
  const feuille = re => Object.entries(feuilles).find(([n]) => re.test(norm(n)))?.[1] || [];
  const apres = (g, re, rang = 0, somme = false) => { let tot = null;
    for(const r of g){ if(!r) continue; const j = r.findIndex(v => typeof v === "string" && re.test(norm(v))); if(j < 0) continue;
      const n = r.slice(j+1).filter(v => typeof v === "number"); if(n.length <= rang) continue; if(!somme) return n[rang]; tot = (tot||0) + n[rang]; }
    return tot; };
  const cr = feuille(/compte de resultat/), bi = feuille(/^bilan/);
  const ben = apres(cr, /solde crediteur/), per = apres(cr, /solde debiteur/);
  const ctl = {loyers:apres(cr, /production vendue/), chargesExternes:apres(cr, /autres achats et charges externes/), impotsTaxes:apres(cr, /^impots, taxes/),
    interets:apres(cr, /interets et charges assimilees/), dotationsAmortissements:apres(cr, /dotations aux amortissements/, 0, true),
    resultat:ben == null && per == null ? null : r2((ben||0) - (per||0)), immobilisationsNettes:apres(bi, /immobilisations corporelles/, 2),
    capitalRestantDu:apres(bi, /emprunts et dettes/), capitalExploitant:apres(bi, /^capital$/)};
  for(const k in ctl) if(ctl[k] != null) ctl[k] = r2(ctl[k]);
  return {fichier, annee, lignes, ctl};
}
const cleXL = l => (l.recette ? "R|" : "D|") + l.lib;
function ecrituresReprise(R){
  const y = R.y;
  return R.lu.lignes.map(l => {
    const mm = String(l.mois).padStart(2, "0"), j = l.jour && l.jour.startsWith(`${y}-${mm}`) ? l.jour : `${y}-${mm}-01`;
    return {id:uid(), date:j, tiers:l.tiers, nature:R.natures[cleXL(l)], montant:l.montant, commentaire:`Repris de l'Excel (${l.lib || "sans nature"})`};
  });
}
/* Écrit la reprise dans les données d mais ne clôture pas (la clôture a besoin des calculs) */
function appliquerReprise(d, R){
  const avant = d.exercices[R.y] || {}, ex = {statut:"en-cours", ecritures:ecrituresReprise(R)};
  ex.reprise = {source:"Excel", fichier:R.lu.fichier, date:new Date().toISOString().slice(0,10), chiffres:R.lu.ctl};
  if(avant.chiffres) ex.reprise.anciensChiffres = avant.chiffres;
  d.exercices[R.y] = ex;
  return ex;
}
function avecDonnees(d, fn){ const s = S.data; S.data = d; try{ return fn(); } finally { S.data = s; } }
function simulerReprise(R){
  const y = R.y, suiv = d => d.exercices[y+1] && d.exercices[y+1].statut !== "historique";
  const avantSuiv = suiv(S.data) ? fiscalJusqua(y+1) : null;
  const d = normalize(JSON.parse(JSON.stringify(S.data)));
  return avecDonnees(d, () => { appliquerReprise(d, R);
    return {c:calculAnnee(y), f:fiscalJusqua(y), b:bilan(y), crdEch:calculAnnee(y).crdEch, avantSuiv, apresSuiv:suiv(d) ? fiscalJusqua(y+1) : null}; });
}
function anneeReprenable(){
  const ys = Object.keys(S.data.exercices).map(Number), y = Math.min(...ys) - 1;
  return y >= yearOf(debutLMNP()) ? y : null;
}
function ouvrirReprise(y){ S.reprise = {y, cloturer:true}; S.tab = "dossier"; renderAll(); haut(); }
async function lireRepriseExcel(f){
  if(!f) return;
  try{
    const lu = analyserDossierExcel(await lireClasseur(new Uint8Array(await f.arrayBuffer())), f.name), R = S.reprise;
    if(lu.annee && lu.annee !== R.y) return alert(`Ce classeur porte sur ${lu.annee}, pas sur ${R.y}.`);
    R.lu = lu; R.natures = {};
    lu.lignes.forEach(l => R.natures[cleXL(l)] ??= natureXL(l.lib, l.recette));
    renderAll();
  }catch(e){ alert("Lecture impossible : " + e.message); }
}
function deposerRepriseExcel(ev){ ev.preventDefault(); ev.currentTarget.classList.remove("survol"); lireRepriseExcel(ev.dataTransfer.files[0]); }
function validerReprise(){
  const R = S.reprise, y = R.y, ex = exercice(y);
  if(ex && !isHistorique(y) && (ex.ecritures||[]).length) return alert(`${y} contient déjà des écritures : la reprise ne peut se faire que sur une année absente ou reprise en synthèse.`);
  const nouv = appliquerReprise(S.data, R);
  if(R.cloturer){
    const f = fiscalJusqua(y);
    nouv.statut = "cloture";
    nouv.cloture = {date:new Date().toISOString().slice(0,10), resultatFiscal:r2(f.resultatFiscal), ardFin:r2(f.ardFin), deficitsFin:r2(f.deficitsFin.reduce((s,x)=>s+x.montant,0)), crdFin:r2(f.c.crd)};
  }
  S.reprise = null; S.year = y; S.tab = "ecritures"; setDirty(); renderAll(); haut();
  toast(`${y} repris de l'Excel : ${nouv.ecritures.length} écritures${R.cloturer ? ", année clôturée" : ""}.`);
}
function creerAnneeVide(y){
  S.data.exercices[y] = {statut:"en-cours", ecritures:[]};
  S.reprise = null; S.year = y; S.tab = "ecritures"; setDirty(); renderAll(); haut();
}
function vueReprise(y){
  const R = S.reprise, ex = exercice(y), tete = entete(`Reprendre ${y}`, `Les écritures de l'ancien classeur Excel deviennent celles de ${y}, contrôlées avec son compte de résultat et son bilan.`);
  const annuler = `<button class="btn ghost" onclick="S.reprise=null;renderAll()">Annuler</button>`;
  if(!R.lu) return tete + `<div class="card">${zoneDepot(`Déposer le classeur Excel ${y}`, "« Dossier de travail » .xlsx avec un onglet par mois · glisser ici ou cliquer · lu sur cet ordinateur, rien n'est envoyé", "$('#repriseInput').click()", "deposerRepriseExcel(event)")}
    <input type="file" id="repriseInput" accept=".xlsx" class="hide" onchange="lireRepriseExcel(this.files[0])"></div>
    <div class="row">${annuler}${ex ? "" : `<button class="btn ghost" onclick="creerAnneeVide(${y})">Créer ${y} vide, sans Excel</button>`}</div>`;
  const s = simulerReprise(R), C = R.lu.ctl, c = s.c;
  const groupes = {};
  R.lu.lignes.forEach(l => { const k = cleXL(l); (groupes[k] ??= {l, n:0, tot:0}); groupes[k].n++; groupes[k].tot += l.montant; });
  const optsNat = rec => Object.keys(NATURES).filter(n => (NATURES[n].g === "recette") === rec);
  const ecart = (a, b) => a != null && b != null && Math.abs(a - b) >= 1;
  const ligne = (lib, xl, outil, note) => `<tr><td>${lib}${note ? `<br><small class="muted-s">${note}</small>` : ""}</td><td class="n">${eur(xl)}</td><td class="n">${eur(outil)}</td><td class="n">${xl == null || outil == null ? "" : ecart(xl, outil) ? `<b style="color:var(--warn)">${eur(outil - xl)}</b>` : `<span style="color:var(--pos)">✓</span>`}</td></tr>`;
  const sv = s.avantSuiv, sa = s.apresSuiv, suivOk = !sv || !sa || Math.abs(sv.resultatFiscal - sa.resultatFiscal) < 0.5;
  const nbEcarts = [[C.loyers, c.produits], [C.chargesExternes, c.c242], [C.impotsTaxes, c.c244], [C.interets, c.interets], [C.dotationsAmortissements, c.dotations], [C.resultat, c.resultatComptable], [C.immobilisationsNettes, s.b.immoNettes]].filter(([a, b]) => ecart(a, b)).length;
  return tete + `<div class="card"><h3>1. ${R.lu.lignes.length} lignes lues dans « ${esc(R.lu.fichier)} »</h3>
    <div class="tablewrap"><table><tr><th>Dans l'Excel</th><th class="n">Lignes</th><th class="n">Total</th><th>Nature dans l'outil</th></tr>
    ${Object.entries(groupes).map(([k, g]) => `<tr><td>${esc(g.l.lib || "(sans nature)")} <span class="pill">${g.l.recette ? "recette" : "dépense"}</span></td><td class="n">${g.n}</td><td class="n">${eur(g.tot)}</td>
      <td><select onchange="S.reprise.natures[this.dataset.k]=this.value;renderAll()" data-k="${esc(k)}">${optsNat(g.l.recette).map(n => optNature(n, R.natures[k])).join("")}</select></td></tr>`).join("")}
    </table></div></div>
  <div class="card"><h3>2. Contrôle avec l'Excel</h3>
    ${nbEcarts ? `<div class="alert warn">${nbEcarts} écart${pl(nbEcarts)} avec l'Excel : vérifiez les natures ci-dessus, ou les immobilisations si l'écart porte sur les amortissements.</div>` : `<div class="alert ok">L'outil retrouve les chiffres de l'Excel.</div>`}
    <div class="tablewrap"><table><tr><th></th><th class="n">Excel</th><th class="n">Outil</th><th class="n">Écart</th></tr>
    ${ligne("Loyers et recettes", C.loyers, c.produits)}${ligne("Charges externes", C.chargesExternes, c.c242)}${ligne("Impôts et taxes", C.impotsTaxes, c.c244)}
    ${ligne("Intérêts d'emprunt", C.interets, c.interets)}${ligne("Amortissements", C.dotationsAmortissements, c.dotations, "calculés d'après les immobilisations du dossier")}
    ${ligne("Résultat comptable", C.resultat, c.resultatComptable)}${ligne(`Immobilisations nettes au 31/12/${y}`, C.immobilisationsNettes, s.b.immoNettes)}
    </table></div>
    <p class="sub" style="margin:10px 0 0">Résultat fiscal ${y} dans l'outil : <b>${eur(s.f.resultatFiscal)}</b>${s.f.ardFin > 0.5 ? ` · ${eur(s.f.ardFin)} d'amortissements en réserve fin ${y}` : ""}${s.f.deficitsFin.length ? ` · déficits reportables : ${eur(s.f.deficitsFin.reduce((t, x) => t + x.montant, 0))}` : ""}.</p></div>
  <div class="card"><h3>3. Capital restant dû au 31/12/${y}</h3>
    <p class="sub" style="margin:0">D'après les écritures reprises : <b>${eur(s.b.crd)}</b>. Échéancier du prêt : ${eur(s.crdEch)}${C.capitalRestantDu != null ? ` · Excel : ${eur(C.capitalRestantDu)}` : ""}.${Math.abs(s.b.crd - s.crdEch) > 1 ? " Un écart avec l'échéancier sera signalé dans les contrôles : à expliquer, et à régulariser le cas échéant sur la page Emprunt d'une année ouverte." : ""}</p></div>
  <div class="card"><h3>4. Effet sur ${y+1}</h3>
    ${!sv ? `<p class="sub" style="margin:0">Pas d'année ${y+1} calculée dans le dossier.</p>` : suivOk
      ? `<div class="alert ok">Le résultat fiscal ${y+1} ne change pas : ${eur(sa.resultatFiscal)}.</div>`
      : `<div class="alert warn">Le résultat fiscal ${y+1} passerait de ${eur(sv.resultatFiscal)} à ${eur(sa.resultatFiscal)} : les reports d'ouverture (amortissements en réserve, déficits) s'appliquent désormais à partir de ${y}. Vérifiez-les dans les paramètres du dossier.</div>`}
    <p class="sub" style="margin:8px 0 0">La colonne N-1 de la déclaration ${y+1} sera calculée à partir de ces écritures.</p></div>
  <div class="card"><label style="flex-direction:row;align-items:center;gap:8px;color:var(--text)"><input type="checkbox" ${R.cloturer ? "checked" : ""} onchange="S.reprise.cloturer=this.checked"> ${y} est déjà déclarée : la clôturer (saisies verrouillées, réouverture possible)</label></div>
  <div class="row"><button class="btn" onclick="validerReprise()">Reprendre ${y}</button><button class="btn sec" onclick="S.reprise.lu=null;renderAll()">Autre fichier…</button>${annuler}</div>`;
}

addEventListener("beforeprint", () => document.querySelectorAll("#main details").forEach(d => { if(!d.open){ d.open = true; d.dataset.ferme = "1"; } }));
addEventListener("afterprint", () => document.querySelectorAll("#main details[data-ferme]").forEach(d => { d.open = false; delete d.dataset.ferme; }));
renderAll();
</script>
