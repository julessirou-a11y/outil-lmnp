<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outil LMNP</title>
<style>
:root{
  --bg:#f6f5f2; --surface:#ffffff; --surface-2:#f0eee9; --text:#1d1d1b; --muted:#6b6a65;
  --line:#dedbd3; --accent:#2f5d50; --accent-soft:#e3ece8; --warn:#9a5b00; --warn-soft:#fbf0dc;
  --bad:#a1312a; --bad-soft:#f8e3e1; --ok:#2f6b3a; --ok-soft:#e2f0e4;
  --radius:10px; --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161715; --surface:#1f201e; --surface-2:#272825; --text:#ecebe6; --muted:#a3a29b;
    --line:#383934; --accent:#8cc2ad; --accent-soft:#25332d; --warn:#e5b25d; --warn-soft:#3a3020;
    --bad:#ef8a80; --bad-soft:#3d2422; --ok:#8fd19b; --ok-soft:#21352a;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-weight:650;letter-spacing:-.01em;margin-right:auto}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px}
nav{max-width:1100px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;color:var(--muted);font:inherit;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
h2{font-size:20px;margin:0 0 4px}
h3{font-size:16px;margin:24px 0 8px}
p.sub{color:var(--muted);margin:0 0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.kpi .l{color:var(--muted);font-size:13px}.kpi .v{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;font-weight:550;cursor:pointer}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#10201a}}
.btn.sec{background:var(--surface-2);color:var(--text);border:1px solid var(--line)}
.btn.small{padding:4px 9px;font-size:13px}
.btn.danger{background:var(--bad-soft);color:var(--bad);border:1px solid transparent}
.btn:disabled{opacity:.5;cursor:default}
select,input,textarea{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 8px;max-width:100%}
label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted)}
.form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.tot td{font-weight:650;border-top:2px solid var(--line)}
tr.muted td{color:var(--muted)}
.case{font-family:var(--mono);background:var(--accent-soft);color:var(--accent);border-radius:5px;padding:1px 6px;font-size:13px;white-space:nowrap}
.alert{border-radius:8px;padding:10px 12px;margin:8px 0;font-size:14px}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.info{background:var(--accent-soft);color:var(--accent)}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.alert.ok{background:var(--ok-soft);color:var(--ok)}
.pill{display:inline-block;font-size:12px;border-radius:99px;padding:1px 8px;background:var(--surface-2);color:var(--muted)}
.dirty{color:var(--warn);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hide{display:none!important}
details summary{cursor:pointer;color:var(--accent)}
.fiche h3{border-bottom:1px solid var(--line);padding-bottom:4px}
dialog#viewer{width:min(1000px,96vw);height:92vh;padding:0;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--text)}
dialog#viewer{overscroll-behavior:contain}
html.modal-open,html.modal-open body{overflow:hidden}
dialog#viewer::backdrop{background:rgba(0,0,0,.45)}
#viewer .vbar{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
#viewer iframe{width:100%;height:calc(92vh - 50px);border:0;background:#fff}
.badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:99px;background:var(--warn-soft);color:var(--warn);font-size:12px;font-weight:600;text-align:center}
.pj{font-size:13px;white-space:nowrap}
@media print{
  header,nav,.noprint{display:none!important}
  body{background:#fff;color:#000}
  .card{border:0;padding:0}
  main{padding:0}
}

<body>
<header>
  <div class="bar">
    <div class="brand" id="brand">Outil LMNP<small id="fileinfo">Aucun dossier ouvert</small></div>
    <span class="dirty hide" id="dirty">● Modifications non enregistrées</span>
    <label class="noprint" style="flex-direction:row;align-items:center;gap:6px">Exercice
      <select id="yearSel"></select></label>
    <button class="btn" id="saveBtn" disabled>Enregistrer</button>
  </div>
  <nav id="tabs"></nav>
</header>
<main id="main"></main>
<input type="file" id="fileInput" accept=".json,application/json" class="hide">
<dialog id="viewer"><div class="vbar"><b id="vTitle" style="margin-right:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></b><a class="btn small sec" id="vOpen" target="_blank">Ouvrir dans un onglet</a><button class="btn small" onclick="fermerPiece()">Fermer</button></div><iframe id="vFrame" title="Justificatif"></iframe></dialog>

<script>
"use strict";
/* ============ Paramètres ============ */
const NATURES = {
  "Loyer":{g:"recette",l:"218",piece:false},
  "Charges refacturées":{g:"recette",l:"218"},
  "Autre recette":{g:"recette",l:"218"},
  "Copropriété":{g:"charge",l:"242"},
  "Assurance":{g:"charge",l:"242"},
  "Assurance emprunt":{g:"charge",l:"242",piece:false},
  "Eau":{g:"charge",l:"242"},
  "Électricité / gaz":{g:"charge",l:"242"},
  "Internet":{g:"charge",l:"242"},
  "Entretien et réparations":{g:"charge",l:"242"},
  "Petit équipement (< 500 € HT)":{g:"charge",l:"242"},
  "Frais de gestion / agence":{g:"charge",l:"242"},
  "Honoraires":{g:"charge",l:"242"},
  "Frais bancaires":{g:"charge",l:"242"},
  "Autre charge":{g:"charge",l:"242"},
  "Taxe foncière":{g:"charge",l:"244"},
  "CFE":{g:"charge",l:"244"},
  "Intérêts emprunt":{g:"charge",l:"294",piece:false},
  "Remboursement emprunt":{g:"bilan",l:"",piece:false}
};
const CATEGORIES = {construction:"Logement (bâti + terrain)", travaux:"Travaux / agencements", mobilier:"Mobilier et équipements"};
const DUREE_DEFICIT = 10;

/* ============ État ============ */
const S = {data:null, dirty:false, dir:null, fileName:null, year:null, tab:"accueil", editId:null, editImmo:null, unlocked:{}};

/* ============ Utilitaires ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const eur = n => (n==null||isNaN(n)) ? "–" : n.toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2}) + " €";
const eur0 = n => (n==null||isNaN(n)) ? "–" : Math.round(n).toLocaleString("fr-FR") + " €";
const uid = () => Math.random().toString(36).slice(2,10);
const yearOf = d => parseInt(String(d).slice(0,4),10);
const monthOf = d => parseInt(String(d).slice(5,7),10);
const MOIS = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const fmtDate = d => d ? d.slice(8,10)+"/"+d.slice(5,7)+"/"+d.slice(0,4) : "";

function setDirty(v=true){
  S.dirty=v; if(v) S.version = (S.version||0) + 1;
  const el = $("#dirty"); el.classList.toggle("hide", !v && !S.autoMsg);
  el.textContent = v ? (S.dir ? "● Enregistrement…" : "● Modifications non enregistrées") : (S.autoMsg||"");
  el.style.color = v ? "var(--warn)" : "var(--muted)";
  $("#saveBtn").disabled = !S.data;
  if(v && S.dir){ clearTimeout(S.autoT); S.autoT = setTimeout(autoSave, 1200); }
}
/* Enregistrement automatique dans le dossier (sans demander d'autorisation) */
async function autoSave(){
  if(!S.dir || !S.dirty) return;
  try{
    if(await S.dir.queryPermission({mode:"readwrite"}) !== "granted"){ S.autoMsg=""; $("#dirty").textContent = "● Non enregistré : cliquez sur Enregistrer"; return; }
    const v = S.version;
    await ecrireDossier(!S.sauvegardeSession);
    if(S.version === v){ const d = new Date(); S.autoMsg = "✓ Enregistré à " + d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}); setDirty(false); }
  }catch(e){ $("#dirty").textContent = "● Échec de l'enregistrement automatique : cliquez sur Enregistrer"; }
}
async function ecrireDossier(avecCopie){
  S.data.derniereModification = new Date().toISOString();
  const txt = JSON.stringify(S.data, null, 2);
  const fh = await S.dir.getFileHandle(FILE, {create:true});
  const w = await fh.createWritable(); await w.write(txt); await w.close();
  if(avecCopie){
    const sv = await S.dir.getDirectoryHandle("Sauvegardes", {create:true});
    const bh = await sv.getFileHandle(`lmnp-donnees_${horodatage()}.json`, {create:true});
    const bw = await bh.createWritable(); await bw.write(txt); await bw.close();
    S.sauvegardeSession = true;
  }
}
window.addEventListener("beforeunload", e => { if(S.dirty){ e.preventDefault(); e.returnValue=""; } });

/* ============ Modèle : migration ============ */
function normalize(d){
  d.dossier ??= {}; d.immobilisations ??= []; d.emprunts ??= []; d.exercices ??= {};
  d.dossier.declarant ??= "1";
  d.reports ??= {};
  if(!Array.isArray(d.reports.deficits)) d.reports.deficits = [];
  d.reports.amortissementsDifferes ??= 0;
  delete d.reports.deficitsAnterieurs;
  for(const [y,ex] of Object.entries(d.exercices)){
    if(ex.ecritures) ex.ecritures.forEach(e => { e.id ??= uid(); });
  }
  d.immobilisations.forEach(i => { i.id ??= uid(); i.quotePartTerrain ??= 0; });
  return d;
}
function newDossier(){
  const y = new Date().getFullYear();
  return normalize({format:"outil-lmnp",version:1,dossier:{nom:"Mon LMNP",regime:"reel-simplifie",debutLocationMeublee:y+"-01-01"},
    immobilisations:[],emprunts:[],exercices:{[y]:{statut:"en-cours",ecritures:[]}},reports:{}});
}

/* ============ Calculs : amortissements ============ */
function debutLMNP(){ return S.data.dossier.debutLocationMeublee || "1900-01-01"; }
function baseAmort(i){ return r2(i.valeurOrigine * (1 - (i.quotePartTerrain||0))); }
function planAmort(i){
  const base = baseAmort(i), annuite = base / i.dureeAns;
  const y0 = yearOf(i.miseEnService), m0 = monthOf(i.miseEnService);
  const plan = []; let cumul = 0, y = y0;
  while(cumul < base - 0.005 && y < y0 + i.dureeAns + 2){
    const mois = (y === y0) ? 13 - m0 : 12;
    let dot = Math.min(annuite * mois / 12, base - cumul);
    cumul += dot;
    plan.push({annee:y, dotation:dot, cumul, vnc: base - cumul, avantLMNP: y < yearOf(debutLMNP())});
    y++;
  }
  return plan;
}
function amortAnnee(i, y){
  const plan = planAmort(i);
  const row = plan.find(p => p.annee === y);
  const prev = plan.filter(p => p.annee < y);
  const cumulDebut = prev.length ? prev[prev.length-1].cumul : 0;
  return {dotation: row ? row.dotation : 0, cumulDebut, cumulFin: cumulDebut + (row ? row.dotation : 0), base: baseAmort(i)};
}
function anneeEntreeBilan(i){ return Math.max(yearOf(i.miseEnService), yearOf(debutLMNP())); }

/* ============ Calculs : emprunt ============ */
function echeancier(l){
  const r = l.tauxAnnuel / 12;
  let m = l.mensualite;
  if(!m) m = r ? l.capital * r / (1 - Math.pow(1+r, -l.dureeMois)) : l.capital / l.dureeMois;
  const rows = []; let crd = l.capital;
  const y0 = yearOf(l.premiereEcheance), m0 = monthOf(l.premiereEcheance);
  for(let k=0;k<l.dureeMois && crd>0.005;k++){
    const interet = crd * r;
    let capital = m - interet;
    if(k === l.dureeMois-1 || capital > crd) capital = crd;
    crd -= capital;
    const mm = m0 - 1 + k;
    rows.push({n:k+1, annee: y0 + Math.floor(mm/12), mois: (mm%12)+1, interet, capital, crd});
  }
  return rows;
}
function empruntAnnee(l, y){
  const rows = echeancier(l);
  const inY = rows.filter(r => r.annee === y);
  const before = rows.filter(r => r.annee <= y);
  return {interets: inY.reduce((s,r)=>s+r.interet,0), capital: inY.reduce((s,r)=>s+r.capital,0),
          crdFin: before.length ? before[before.length-1].crd : (yearOf(l.premiereEcheance) > y ? 0 : l.capital), demarre: yearOf(l.premiereEcheance) <= y};
}

/* ============ Calculs : exercice ============ */
function exercice(y){ return S.data.exercices[y]; }
function isHistorique(y){ const ex = exercice(y); return ex && ex.statut === "historique"; }
function anneesCalculees(){
  return Object.keys(S.data.exercices).map(Number).filter(y => !isHistorique(y)).sort((a,b)=>a-b);
}
function totauxEcritures(y){
  const ex = exercice(y) || {}; const t = {parNature:{}, recettes:0, c242:0, c244:0, c294:0, remb:0, inconnues:0};
  (ex.ecritures||[]).forEach(e => {
    const nat = NATURES[e.nature] || {g: e.sens === "recette" ? "recette" : "charge", l: e.sens==="recette"?"218":"242", inconnue:true};
    if(nat.inconnue) t.inconnues++;
    t.parNature[e.nature] = (t.parNature[e.nature]||0) + e.montant;
    if(nat.g === "recette") t.recettes += e.montant;
    else if(nat.g === "bilan") t.remb += e.montant;
    else if(nat.l === "244") t.c244 += e.montant;
    else if(nat.l === "294") t.c294 += e.montant;
    else t.c242 += e.montant;
  });
  return t;
}
function calculAnnee(y){
  const t = totauxEcritures(y);
  const lmnpActif = y >= yearOf(debutLMNP());
  // Intérêts : réels si saisis, sinon échéancier
  let interetsEch = 0, capitalEch = 0, crd = 0;
  S.data.emprunts.forEach(l => { const a = empruntAnnee(l,y); interetsEch += a.interets; capitalEch += a.capital; crd += a.crdFin; });
  const interetsSaisis = (t.parNature["Intérêts emprunt"]||0) > 0;
  const interets = interetsSaisis ? t.c294 : t.c294 + interetsEch;
  const ex = exercice(y) || {};
  const crdRetenu = (ex.crdBanque != null && ex.crdBanque !== "") ? Number(ex.crdBanque) : crd;
  // Amortissements
  const immos = S.data.immobilisations.map(i => ({i, a: amortAnnee(i,y), entree: anneeEntreeBilan(i)}));
  const dotations = immos.reduce((s,x)=> s + (x.entree <= y ? x.a.dotation : 0), 0);
  const produits = t.recettes;
  const resultatAvantAmort = produits - t.c242 - t.c244 - interets;
  const resultatComptable = resultatAvantAmort - dotations;
  return {y, t, lmnpActif, produits, c242:t.c242, c244:t.c244, interets, interetsEch, interetsSaisis, capitalEch,
          crdEch:crd, crd:crdRetenu, dotations, immos, resultatAvantAmort, resultatComptable};
}
/* Chaîne fiscale (art. 39 C : les amortissements ne peuvent pas créer ou augmenter un déficit) */
function fiscalJusqua(yCible){
  let ard = Number(S.data.reports.amortissementsDifferes)||0;
  let deficits = (S.data.reports.deficits||[]).map(d => ({...d}));
  let res = null;
  for(const y of anneesCalculees()){
    if(y > yCible) break;
    const c = calculAnnee(y);
    const ardDebut = ard, deficitsDebut = deficits.map(d=>({...d}));
    // déficits périmés
    const perimes = deficits.filter(d => y - d.annee > DUREE_DEFICIT);
    deficits = deficits.filter(d => y - d.annee <= DUREE_DEFICIT);
    let R0 = c.resultatAvantAmort, dotDeductible = 0, ardUtilise = 0, ardNouveau = 0, deficitAnnee = 0;
    if(R0 <= 0){
      ardNouveau = c.dotations; deficitAnnee = -R0;
    } else {
      dotDeductible = Math.min(c.dotations, R0);
      ardNouveau = c.dotations - dotDeductible;
      // priorité aux déficits antérieurs (limités à 10 ans), puis aux amortissements différés (sans limite)
      const defDispo = deficits.reduce((s,d)=>s+d.montant,0);
      ardUtilise = Math.min(ard, Math.max(0, R0 - dotDeductible - defDispo));
    }
    ard = ard - ardUtilise + ardNouveau;
    const resultatFiscal = R0 - dotDeductible - ardUtilise; // >= 0 si R0>0, sinon = R0 (déficit)
    // Imputation des déficits antérieurs sur le bénéfice
    let deficitsImputes = 0, reste = Math.max(resultatFiscal,0);
    deficits.sort((a,b)=>a.annee-b.annee).forEach(d => { const u = Math.min(d.montant, reste); d.montant -= u; reste -= u; deficitsImputes += u; });
    deficits = deficits.filter(d => d.montant > 0.005);
    if(deficitAnnee > 0) deficits.push({annee:y, montant:deficitAnnee});
    if(y === yCible) res = {c, R0, dotDeductible, ardUtilise, ardNouveau, ardDebut, ardFin:ard, reintegration:c.dotations - dotDeductible,
      resultatFiscal, deficitsImputes, deficitsDebut, deficitsFin:deficits.map(d=>({...d})), deficitAnnee, perimes};
  }
  return res;
}
function bilan(y){
  if(isHistorique(y)){
    const h = exercice(y).chiffres || {};
    return {historique:true, immoNettes:h.immobilisationsNettes, crd:h.capitalRestantDu, capital:h.capitalExploitant, resultat:h.resultat};
  }
  const c = calculAnnee(y);
  let brut = 0, amort = 0;
  const lignes = {terrain:{}, construction:{}, travaux:{}, mobilier:{}};
  for(const k in lignes) lignes[k] = {brutDebut:0, aug:0, brutFin:0, amDebut:0, dot:0, amFin:0};
  S.data.immobilisations.forEach(i => {
    const entree = anneeEntreeBilan(i); if(entree > y) return;
    const a = amortAnnee(i,y);
    const terrain = r2(i.valeurOrigine - baseAmort(i));
    const cat = i.categorie === "construction" ? "construction" : (i.categorie === "mobilier" ? "mobilier" : "travaux");
    const add = (L, v, isNew) => { if(isNew) L.aug += v; else L.brutDebut += v; L.brutFin += v; };
    if(terrain > 0) add(lignes.terrain, terrain, entree === y);
    add(lignes[cat], baseAmort(i), entree === y);
    lignes[cat].amDebut += (entree === y ? 0 : a.cumulDebut);
    lignes[cat].dot += a.dotation + (entree === y ? a.cumulDebut : 0);
    lignes[cat].amFin += a.cumulFin;
    brut += i.valeurOrigine; amort += a.cumulFin;
  });
  const immoNettes = brut - amort;
  return {historique:false, brut, amort, immoNettes, crd:c.crd, resultat:c.resultatComptable,
          capital: immoNettes - c.resultatComptable - c.crd, lignes};
}

/* ============ Fichiers : ouverture / enregistrement ============ */
const FS = "showDirectoryPicker" in window;
const FILE = "lmnp-donnees.json";
const idb = {
  db(){ return new Promise((ok,ko)=>{ try{ const r = indexedDB.open("outil-lmnp",1); r.onupgradeneeded=()=>r.result.createObjectStore("k"); r.onsuccess=()=>ok(r.result); r.onerror=()=>ko(r.error);}catch(e){ko(e)} }); },
  async get(k){ try{ const db=await this.db(); return await new Promise(ok=>{const q=db.transaction("k").objectStore("k").get(k); q.onsuccess=()=>ok(q.result); q.onerror=()=>ok(null);}); }catch(e){return null} },
  async set(k,v){ try{ const db=await this.db(); db.transaction("k","readwrite").objectStore("k").put(v,k); }catch(e){} }
};
function chargerDonnees(obj, nom){
  if(!obj || obj.format !== "outil-lmnp") throw new Error("Ce fichier n'est pas un dossier de l'outil LMNP.");
  S.data = normalize(obj); S.fileName = nom; S.autoMsg = ""; S.sauvegardeSession = false;
  const ys = Object.keys(S.data.exercices).map(Number).sort((a,b)=>a-b);
  S.year = ys.filter(y=>!isHistorique(y)).pop() ?? ys.pop();
  setDirty(false); renderAll();
}
async function ouvrirDossier(){
  try{
    const dir = await window.showDirectoryPicker({id:"lmnp", mode:"readwrite"});
    S.dir = dir; await idb.set("dir", dir);
    await lireDepuisDossier();
  }catch(e){ if(e.name !== "AbortError") alert("Impossible d'ouvrir ce dossier : " + e.message + "\n\nSi le dossier est dans iCloud Drive et que le navigateur le refuse, essayez un dossier de « Documents » synchronisé avec iCloud."); }
}
async function reprendreDossier(dir){
  if(await dir.requestPermission({mode:"readwrite"}) !== "granted") return;
  S.dir = dir; await lireDepuisDossier();
}
async function lireDepuisDossier(){
  try{
    const fh = await S.dir.getFileHandle(FILE);
    const txt = await (await fh.getFile()).text();
    chargerDonnees(JSON.parse(txt), S.dir.name + "/" + FILE);
  }catch(e){
    if(e.name === "NotFoundError"){
      if(confirm("Aucun fichier « "+FILE+" » dans ce dossier. Créer un dossier comptable vide ici ?")){
        chargerDonnees(newDossier(), S.dir.name + "/" + FILE); await enregistrer();
      }
    } else alert("Lecture impossible : " + e.message);
  }
}
function ouvrirFichier(){ $("#fileInput").click(); }
$("#fileInput").addEventListener("change", async ev => {
  const f = ev.target.files[0]; if(!f) return;
  try{ chargerDonnees(JSON.parse(await f.text()), f.name); S.dir = null; }catch(e){ alert(e.message); }
  ev.target.value = "";
});
function horodatage(){ const d=new Date(), p=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}h${p(d.getMinutes())}`; }
async function enregistrer(){
  if(!S.data) return;
  S.data.derniereModification = new Date().toISOString();
  const txt = JSON.stringify(S.data, null, 2);
  if(S.dir){
    try{
      if(await S.dir.queryPermission({mode:"readwrite"}) !== "granted" && await S.dir.requestPermission({mode:"readwrite"}) !== "granted") throw new Error("permission refusée");
      clearTimeout(S.autoT); await ecrireDossier(true);
      S.autoMsg = "✓ Enregistré à " + new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
      setDirty(false); toast("Enregistré dans « "+S.dir.name+" » (+ copie dans Sauvegardes)");
      return;
    }catch(e){ alert("Enregistrement dans le dossier impossible ("+e.message+"). Le fichier va être téléchargé à la place."); }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([txt],{type:"application/json"}));
  a.download = FILE; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  setDirty(false); toast("Fichier téléchargé : déplacez-le dans votre dossier iCloud pour remplacer l'ancien.");
}
$("#saveBtn").addEventListener("click", enregistrer);
document.addEventListener("keydown", e => { if((e.metaKey||e.ctrlKey) && e.key === "s"){ e.preventDefault(); enregistrer(); } });
function toast(msg){ const el = document.createElement("div"); el.className="alert ok noprint"; el.style.cssText="position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:9;box-shadow:0 4px 16px rgba(0,0,0,.15);max-width:90vw"; el.textContent=msg; document.body.appendChild(el); setTimeout(()=>el.remove(), 3500); }

function vueAccueil(){
  const y = S.year;
  if(isHistorique(y)){

    return `<h2>Exercice ${y}</h2><p class="sub">Exercice historique repris de l'Excel (chiffres de synthèse uniquement).</p>
      <div class="card"><table>${Object.entries({loyers:"Loyers",chargesExternes:"Charges externes",impotsTaxes:"Impôts et taxes",dotationsAmortissements:"Dotations aux amortissements",interets:"Intérêts",resultat:"Résultat",immobilisationsNettes:"Immobilisations nettes",capitalRestantDu:"Capital restant dû"}).map(([k,l])=>`<tr><td>${l}</td><td class="n">${eur(h[k])}</td></tr>`).join("")}</table></div>`;
  }
  const f = fiscalJusqua(y), c = f.c;
  const alerts = [];
  if(!c.lmnpActif) alerts.push(["info", `La location meublée démarre le ${fmtDate(debutLMNP())} : rien à déclarer pour ${y}.`]);
  if(exercice(y).statut === "cloture") alerts.push(["info","Exercice clôturé. Les écritures sont verrouillées (déverrouillables dans l'onglet Écritures)."]);
  const loyers = (exercice(y).ecritures||[]).filter(e=>e.nature==="Loyer").map(e=>monthOf(e.date));
  const manquants = [...Array(12).keys()].map(i=>i+1).filter(m => !loyers.includes(m) && (y < new Date().getFullYear() || m <= new Date().getMonth()+1));
  if(c.lmnpActif && manquants.length && manquants.length < 12) alerts.push(["warn", `Pas de loyer saisi pour : ${manquants.map(m=>MOIS[m-1]).join(", ")}.`]);
  if(c.lmnpActif && !c.t.parNature["CFE"] && c.produits > 5000) alerts.push(["warn","Aucune CFE saisie. Au-delà de 5 000 € de recettes, la CFE est en principe due : vérifiez l'avis dans l'espace professionnel impots.gouv.fr (il n'est pas envoyé par courrier)."]);
  if(S.data.emprunts.length && !c.interetsSaisis) alerts.push(["info", `Intérêts non saisis : l'outil utilise l'échéancier théorique (${eur(c.interetsEch)}). Saisissez les montants réels prélevés par la banque si possible.`]);
  if(S.data.emprunts.length && c.interetsSaisis && Math.abs(c.interets - c.interetsEch) > 1) alerts.push(["info", `Intérêts saisis ${eur(c.interets)} contre ${eur(c.interetsEch)} selon l'échéancier théorique. C'est le montant saisi (réel) qui est retenu.`]);
  if(c.t.inconnues) alerts.push(["warn", `${c.t.inconnues} écriture(s) avec une nature inconnue, classée(s) par défaut en charges externes.`]);
  if(f.reintegration > 0.5) alerts.push(["info", `${eur(f.reintegration)} d'amortissements ne sont pas déductibles cette année (ils ne peuvent pas créer de déficit) : ils sont reportés sans limite de durée.`]);
  const decl = exercice(y).chiffresDeclares;
  let comp = "";
  if(decl){
    const rows = [["Loyers",decl.loyers,c.produits],["Charges externes",decl.chargesExternes,c.c242],["Impôts et taxes",decl.impotsTaxes,c.c244],["Dotations aux amortissements",decl.dotationsAmortissements,c.dotations],["Intérêts",decl.interets,c.interets],["Résultat",decl.resultat,c.resultatComptable]];
    comp = `<div class="card"><h3 style="margin-top:0">Contrôle : outil / chiffres de l'Excel</h3><div class="tablewrap"><table><tr><th></th><th class="n">Excel</th><th class="n">Outil</th><th class="n">Écart</th></tr>
      ${rows.map(([l,a,b])=>`<tr><td>${l}</td><td class="n">${eur(a)}</td><td class="n">${eur(b)}</td><td class="n">${Math.abs(b-a)<0.02?'<span class="pill">=</span>':eur(b-a)}</td></tr>`).join("")}</table></div></div>`;
  }
  return `<h2>Exercice ${y}</h2><p class="sub">${esc(S.data.dossier.nom)} · régime réel simplifié</p>
    <div class="grid" style="margin-bottom:16px">
      ${kpi("Recettes", c.produits)}${kpi("Charges (hors amort.)", c.c242+c.c244+c.interets)}
      ${kpi("Amortissements", c.dotations)}${kpi("Résultat fiscal", f.resultatFiscal, true)}
    </div>
    ${alerts.map(([k,t])=>`<div class="alert ${k}">${t}</div>`).join("")}
    ${comp}
    <div class="card"><h3 style="margin-top:0">Détail par nature</h3><div class="tablewrap"><table>
      ${Object.entries(c.t.parNature).sort((a,b)=>b[1]-a[1]).map(([n,v])=>`<tr><td>${esc(n)} ${NATURES[n]?.l?`<span class="case">${NATURES[n].l}</span>`:'<span class="pill">hors résultat</span>'}</td><td class="n">${eur(v)}</td></tr>`).join("") || '<tr><td class="muted">Aucune écriture</td></tr>'}
    </table></div></div>`;
}

function parseMontant(s){ return Number(String(s).replace(/\s/g,"").replace(",", ".")); }
function saveEcriture(){
  const ex = exercice(S.year);
  const e = {date:$("#eDate").value, tiers:$("#eTiers").value.trim(), nature:$("#eNat").value, montant:r2(parseMontant($("#eMont").value)), commentaire:$("#eCom").value.trim()};
  if(!e.date || isNaN(e.montant) || e.montant <= 0) return alert("Date et montant positif obligatoires.");
  if(yearOf(e.date) !== S.year) return alert("La date doit être dans l'exercice " + S.year + ".");
  e.sens = NATURES[e.nature].g === "recette" ? "recette" : "depense";
  if(!e.commentaire) delete e.commentaire;
  if(S.editId){ Object.assign(ex.ecritures.find(x=>x.id===S.editId), e); S.editId = null; }

function delEcriture(id){ if(!confirm("Supprimer cette écriture ?")) return; const ex = exercice(S.year); ex.ecritures = ex.ecritures.filter(e=>e.id!==id); setDirty(); renderAll(); }
function dupliquerMois(){
  const ex = exercice(S.year); if(!ex.ecritures.length) return alert("Aucune écriture à recopier.");
  const last = ex.ecritures.map(e=>monthOf(e.date)).reduce((a,b)=>Math.max(a,b));
  if(last === 12) return alert("Le dernier mois saisi est décembre.");
  const src = ex.ecritures.filter(e=>monthOf(e.date)===last);
  if(!confirm(`Recopier ${src.length} écriture(s) de ${MOIS[last-1]} sur ${MOIS[last]} ? Pensez à ajuster les montants qui changent (intérêts, eau…).`)) return;
  src.forEach(e => { const d = `${S.year}-${String(last+1).padStart(2,"0")}-${e.date.slice(8,10)}`;
    const valid = new Date(d).getMonth()+1 === last+1 ? d : `${S.year}-${String(last+1).padStart(2,"0")}-28`;
    ex.ecritures.push({...e, id:uid(), date:valid}); });
  setDirty(); renderAll();
}

/* ============ Justificatifs ============ */
function pieceRequise(e){ return !e.sansPiece && (NATURES[e.nature]?.piece !== false); }
function piecesManquantes(y){ const ex = S.data && exercice(y); return (ex && ex.ecritures ? ex.ecritures : []).filter(e => pieceRequise(e) && !e.piece); }
function findEcr(id){ for(const ex of Object.values(S.data.exercices)) { const e = (ex.ecritures||[]).find(x=>x.id===id); if(e) return e; } }
function cellPiece(e){
  if(e.piece) return `<button class="btn small sec pj" title="${esc(e.piece)}" style="color:var(--accent)" onclick="ouvrirPiece('${e.id}')">📎 Voir</button>`;
  if(!pieceRequise(e)) return `<span class="pill" title="${e.sansPiece?"Marquée sans justificatif":"Pas de justificatif nécessaire pour cette nature"}">non requise</span>`;
  return `<button class="btn small sec pj" onclick="attacherPiece('${e.id}')">Ajouter</button>`;
}
const slug = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,30) || "piece";
async function dossierRequis(){
  if(!S.dir){ alert("Les justificatifs sont rangés dans le dossier LMNP : ouvrez l'outil dans Chrome via « Ouvrir le dossier LMNP… »."); return false; }
  if(await S.dir.queryPermission({mode:"readwrite"}) !== "granted" && await S.dir.requestPermission({mode:"readwrite"}) !== "granted") return false;
  return true;
}
async function justifDir(y, create=true){ return (await S.dir.getDirectoryHandle("Justificatifs",{create})).getDirectoryHandle(String(y),{create}); }
async function handleDepuisChemin(chemin){
  const parts = chemin.split("/"); let d = S.dir;
  for(const p of parts.slice(0,-1)) d = await d.getDirectoryHandle(p);
  return d.getFileHandle(parts[parts.length-1]);
}
async function attacherPiece(id){
  if(!await dossierRequis()) return;
  const e = findEcr(id);
  let fh;
  try{ [fh] = await window.showOpenFilePicker({id:"pieces", types:[{description:"Justificatifs", accept:{"application/pdf":[".pdf"],"image/*":[".jpg",".jpeg",".png",".heic"]}}]}); }
  catch(err){ return; }
  const file = await fh.getFile();
  const y = yearOf(e.date), dir = await justifDir(y);
  // Fichier déjà dans Justificatifs/<année> ? on le rattache sans copie
  let dejaLa = false;
  try{ const ex = await dir.getFileHandle(file.name); dejaLa = await ex.isSameEntry(fh); }catch(_){}
  let nom = file.name;
  if(!dejaLa){
    const ext = (file.name.match(/\.[A-Za-z0-9]+$/)||[".pdf"])[0].toLowerCase();
    const base = `${e.date}_${slug(e.tiers)}_${slug(e.nature)}`;
    nom = base + ext; let k = 2;
    while(true){ try{ await dir.getFileHandle(nom); nom = `${base}-${k++}${ext}`; }catch(_){ break; } }
    const out = await dir.getFileHandle(nom,{create:true}); const w = await out.createWritable(); await w.write(file); await w.close();
  }
  e.piece = `Justificatifs/${y}/${nom}`; delete e.sansPiece;
  setDirty(); renderAll(); toast(dejaLa ? "Justificatif rattaché." : `Copié dans Justificatifs/${y}/ sous le nom « ${nom} ».`);
}
async function ouvrirPiece(id){
  const e = findEcr(id);
  if(!await dossierRequis()) return;
  try{
    const file = await (await handleDepuisChemin(e.piece)).getFile();
    const url = urlPiece(file);
    $("#vTitle").textContent = `${fmtDate(e.date)} · ${e.tiers||""} · ${e.nature} · ${eur(e.montant)}`;
    $("#vFrame").src = url; $("#vOpen").href = url;
    S.pieceOuverte = id; ouvrirViewer();
  }catch(err){ alert("Justificatif introuvable : « "+e.piece+" ». A-t-il été déplacé ou renommé ?"); }
}
function urlPiece(file){
  const ext = (file.name.split(".").pop()||"").toLowerCase();
  const type = file.type || ({pdf:"application/pdf",jpg:"image/jpeg",jpeg:"image/jpeg",png:"image/png",heic:"image/heic"})[ext] || "application/octet-stream";
  return URL.createObjectURL(new Blob([file],{type}));
}
function ouvrirViewer(){ document.documentElement.classList.add("modal-open"); $("#viewer").showModal(); }
function fermerPiece(){ $("#viewer").close(); }
$("#viewer").addEventListener("close", () => { document.documentElement.classList.remove("modal-open"); const f = $("#vFrame"); if(f.src.startsWith("blob:")) URL.revokeObjectURL(f.src); f.src = "about:blank"; });
function detacherPiece(id){ const e = findEcr(id); if(!confirm("Détacher ce justificatif de l'écriture ? (le fichier reste dans le dossier)")) return; delete e.piece; setDirty(); renderAll(); }
function marquerSansPiece(id, v){ const e = findEcr(id); if(v) e.sansPiece = true; else delete e.sansPiece; setDirty(); renderAll(); }

  <div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">À fournir</h3>
    ${manq.length>3?`<button class="btn small sec noprint" onclick="if(confirm('Marquer les ${manq.length} écritures comme ne nécessitant pas de justificatif dans l\\'outil (par ex. pièces archivées ailleurs) ?')){piecesManquantes(${y}).forEach(e=>e.sansPiece=true);setDirty();renderAll()}">Tout marquer « classé ailleurs »</button>`:""}</div>
  ${manq.length ? `<div class="tablewrap"><table><tr><th>Date</th><th>Tiers</th><th>Nature</th><th class="n">Montant</th><th></th></tr>
    ${manq.map(e=>ligneE(e, `<button class="btn small" onclick="attacherPiece('${e.id}')">Ajouter</button> <button class="btn small sec" title="Cette écriture n'a pas besoin de justificatif dans l'outil" onclick="marquerSansPiece('${e.id}',true)">Non requis</button>`)).join("")}</table></div>`
    : `<div class="alert ok">Toutes les pièces sont là.</div>`}</div>
  <div class="card" id="nonRattaches"><h3 style="margin-top:0">Fichiers déposés non rattachés</h3><p class="sub" style="margin:0">${S.dir?"Recherche dans Justificatifs/"+y+"/…":"Disponible quand le dossier LMNP est ouvert."}</p></div>
  ${ok.length?`<div class="card"><h3 style="margin-top:0">Pièces rattachées</h3><div class="tablewrap"><table><tr><th>Date</th><th>Tiers</th><th>Nature</th><th class="n">Montant</th><th></th></tr>
    ${ok.map(e=>ligneE(e, `<button class="btn small sec" onclick="ouvrirPiece('${e.id}')">📎 Voir</button> <button class="btn small danger" title="Détacher" onclick="detacherPiece('${e.id}')">×</button>`)).join("")}</table></div></div>`:""}`;
}
function kpiN(l,v,col){ return `<div class="card kpi" style="margin:0"><div class="l">${l}</div><div class="v" style="${col?"color:"+col:""}">${v}</div></div>`; }
async function scanNonRattaches(y){
  const box = $("#nonRattaches"); if(!box || !S.dir) return;
  try{
    if(await S.dir.queryPermission({mode:"read"}) !== "granted") { box.querySelector("p").textContent = "Cliquez sur « Enregistrer » ou « Ajouter » pour autoriser l'accès au dossier, puis revenez ici."; return; }
    let dir; try{ dir = await justifDir(y,false); }catch(_){ box.querySelector("p").textContent = `Aucun dossier Justificatifs/${y}/ pour l'instant. Ta sœur peut y déposer ses factures depuis son iPhone (app Fichiers) : elles apparaîtront ici.`; return; }
    const lies = new Set(Object.values(S.data.exercices).flatMap(ex=>(ex.ecritures||[]).map(e=>e.piece)).filter(Boolean));
    const libres = [];
    for await (const [nom, h] of dir.entries()) if(h.kind === "file" && !nom.startsWith(".") && !lies.has(`Justificatifs/${y}/${nom}`)) libres.push(nom);
    libres.sort();
    S.libres = libres;
    const manq = piecesManquantes(y);
    box.innerHTML = `<h3 style="margin-top:0">Fichiers déposés non rattachés</h3>` + (libres.length ? `<p class="sub">Fichiers présents dans Justificatifs/${y}/ mais liés à aucune écriture : rattachez-les.</p><div class="tablewrap"><table>
      ${libres.map((n,i)=>`<tr><td>${esc(n)}</td><td class="n noprint"><button class="btn small sec" onclick="voirLibre(${y},${i})">Voir</button>
      <select id="lib${i}" style="max-width:280px"><option value="">Rattacher à…</option>${manq.map(e=>`<option value="${e.id}">${fmtDate(e.date)} · ${esc(e.tiers)} · ${eur(e.montant)}</option>`).join("")}</select>
      <button class="btn small" onclick="rattacherLibre(${y},${i})">OK</button></td></tr>`).join("")}</table></div>` : `<p class="sub" style="margin:0">Aucun fichier en attente dans Justificatifs/${y}/.</p>`);
  }catch(err){ box.querySelector("p").textContent = "Lecture du dossier impossible : " + err.message; }
}
async function voirLibre(y,i){
  const nom = S.libres[i]; const file = await (await (await justifDir(y,false)).getFileHandle(nom)).getFile();
  const url = urlPiece(file); $("#vTitle").textContent = nom; $("#vFrame").src = url; $("#vOpen").href = url; ouvrirViewer();
}
function rattacherLibre(y,i){
  const id = $("#lib"+i).value; if(!id) return alert("Choisissez l'écriture correspondante.");
  const e = findEcr(id); e.piece = `Justificatifs/${y}/${S.libres[i]}`; delete e.sansPiece; setDirty(); renderAll();
}

function nouvelExercice(){
  const y = Math.max(...Object.keys(S.data.exercices).map(Number)) + 1;
  S.data.exercices[y] = {statut:"en-cours", ecritures:[]}; S.year = y; S.tab = "ecritures"; setDirty(); renderAll();
}

renderAll();
</script>
</body>
</html>
