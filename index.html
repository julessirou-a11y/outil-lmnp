<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carnet LMNP</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232F4BB8'/%3E%3Cpath d='M9 22V13l7-5 7 5v9h-5v-5h-4v5z' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --surface-2:#F7F8FA; --text:#1B2430; --muted:#5F6B7A; --faint:#8C96A3;
  --line:#E3E7EC; --accent:#2F4BB8; --accent-ink:#FFFFFF; --accent-soft:#E9EDFA;
  --pos:#157A57; --pos-soft:#E3F3EC; --neg:#B83A2B; --neg-soft:#FBE9E6; --warn:#8F5B00; --warn-soft:#FFF3DA;
  --seg-1:#AEB8C6; --seg-2:#C9D1DB; --seg-3:#8592A3;
  --r-lg:14px; --r-md:9px; --r-sm:6px;
  --font:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#101318; --surface:#181C23; --surface-2:#1E232B; --text:#E7EAF0; --muted:#A0A9B6; --faint:#77808D;
  --line:#2A303A; --accent:#93A6FF; --accent-ink:#0F1530; --accent-soft:#232B48;
  --pos:#5FD0A0; --pos-soft:#17302A; --neg:#F08A7C; --neg-soft:#3A201D; --warn:#E9B65C; --warn-soft:#33291A;
  --seg-1:#4A5463; --seg-2:#394150; --seg-3:#5E6979; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:15px/1.55 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- Mise en page : menu latéral ---------- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh;background:linear-gradient(90deg,var(--surface) 247px,var(--line) 247px 248px,var(--bg) 248px)}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;padding:20px 14px;background:var(--surface);border-right:1px solid var(--line);overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.brand svg{flex:none}
.brand b{display:block;font-size:16px;font-weight:600;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:12.5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px}
.yearbox{padding:0 6px}
.yearbox select{width:100%;font-weight:600}
.menu{display:flex;flex-direction:column;gap:2px}
.menu button{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border:0;border-radius:var(--r-md);background:none;color:var(--muted);font:inherit;font-size:14.5px;text-align:left;cursor:pointer}
.menu button svg{flex:none;opacity:.85}
.menu button:hover{background:var(--surface-2);color:var(--text)}
.menu button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.menu .sep{height:1px;background:var(--line);margin:8px 10px}
.badge{margin-left:auto;min-width:22px;padding:0 7px;border-radius:99px;background:var(--warn-soft);color:var(--warn);font-size:12px;font-weight:600;text-align:center;line-height:20px}
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:0 6px}
.status{font-size:12.5px;color:var(--muted);min-height:18px}
.status.warn{color:var(--warn)}
.prefs{display:flex;gap:6px}
.prefs button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);font:inherit;font-size:12.5px;padding:5px 6px;border-radius:var(--r-md);cursor:pointer}
.prefs button:hover{color:var(--text)}
.prefs button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.cpt{font-size:12px;font-weight:500;color:var(--faint);margin-right:6px;font-variant-numeric:tabular-nums}
.topbar{display:none}
main{padding:36px 44px 80px;max-width:1080px;width:100%;min-width:0}

@media (max-width: 860px){
  .app{grid-template-columns:1fr;background:var(--bg)}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
  .topbar .brand{padding:0;margin-right:auto}
  .side{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:30;transform:translateX(-100%);transition:transform .22s ease;box-shadow:0 0 40px rgba(0,0,0,.25)}
  body.menu-open .side{transform:none}
  body.menu-open .scrim{display:block}
  .scrim{display:none;position:fixed;inset:0;background:rgba(10,15,25,.4);z-index:25}
  main{padding:22px 16px 60px}
}
@media (prefers-reduced-motion: reduce){ .side{transition:none} }

/* ---------- Typographie ---------- */
.pagehead{margin-bottom:26px}
.pagehead h1{font-size:28px;line-height:1.2;font-weight:600;letter-spacing:-.02em;margin:0}
.pagehead p{color:var(--muted);margin:6px 0 0;max-width:64ch}
h2{font-size:20px;font-weight:600;letter-spacing:-.01em;margin:0 0 4px}
h3{font-size:16px;font-weight:600;margin:0 0 12px}
p.sub{color:var(--muted);margin:0 0 16px;max-width:70ch}
code{font-size:.92em;background:var(--surface-2);padding:1px 5px;border-radius:5px}

/* ---------- Blocs ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px 24px;margin-bottom:20px}
.card > h3:first-child{margin-top:0}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{padding:16px 18px;margin:0}
.kpi .l{color:var(--muted);font-size:13px}
.kpi .v{font-size:22px;font-weight:600;letter-spacing:-.01em;margin-top:2px}

/* ---------- Boutons et champs ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--accent-ink);border:1px solid transparent;border-radius:var(--r-md);padding:8px 15px;font:inherit;font-size:14.5px;font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.07)}
.btn.sec{background:var(--surface);color:var(--text);border-color:var(--line)}
.btn.sec:hover{background:var(--surface-2);filter:none}
.btn.ghost{background:none;color:var(--muted);border-color:transparent;padding:6px 8px}
.btn.ghost:hover{background:var(--surface-2);color:var(--text);filter:none}
.btn.small{padding:5px 11px;font-size:13px}
.btn.danger{background:var(--neg-soft);color:var(--neg)}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.btn.wide{width:100%;justify-content:center}
select,input,textarea{font:inherit;font-size:14.5px;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:8px 10px;max-width:100%}
input:focus,select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
.form{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));align-items:end}

/* ---------- Tableaux allégés ---------- */
.tablewrap{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:13px;color:var(--faint);font-weight:500;border-bottom-color:var(--line)}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}
tr.tot td{font-weight:600;border-top:1px solid var(--text);border-bottom:0}
tr.muted td{color:var(--muted)}
.case{display:inline-block;min-width:38px;text-align:center;background:var(--accent-soft);color:var(--accent);border-radius:var(--r-sm);padding:1px 7px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill{display:inline-block;font-size:12.5px;border-radius:99px;padding:2px 9px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hide{display:none!important}
details summary{cursor:pointer;color:var(--accent);font-size:13.5px}

/* ---------- Alertes ---------- */
.alerts{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:var(--r-md);padding:11px 14px;font-size:14px;margin:0}
.alert::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;margin-top:7px;background:currentColor}
.alert{margin-bottom:14px}
.alerts .alert{margin-bottom:0}
.card table + h3,.card .tablewrap + h3{margin-top:26px}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.info{background:var(--accent-soft);color:var(--accent)}
.alert.bad{background:var(--neg-soft);color:var(--neg)}
.alert.ok{background:var(--pos-soft);color:var(--pos)}

/* ---------- Tableau de bord : des loyers au résultat ---------- */
.flow{padding:26px 28px}
.flow .lead{font-size:17px;color:var(--muted);margin:0 0 4px}
.flow .big{font-size:44px;font-weight:600;letter-spacing:-.03em;line-height:1.1;margin:0}
.flow .big.neg{color:var(--neg)}
.flow .phrase{margin:10px 0 22px;color:var(--muted);max-width:62ch}
.bar{display:flex;height:30px;border-radius:8px;overflow:hidden;background:var(--surface-2)}
.bar span{display:block;height:100%;min-width:2px}
.bar span + span{border-left:2px solid var(--surface)}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:14px 18px;margin-top:16px}
.legend div{font-size:13px;color:var(--muted)}
.legend b{display:block;font-size:16px;font-weight:600;color:var(--text);margin-top:2px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:-1px}

/* ---------- Écritures groupées par mois ---------- */
.month{margin-bottom:14px;padding:6px 8px 4px}
.month header{display:flex;align-items:baseline;gap:12px;padding:12px 14px 8px}
.month header h3{margin:0;font-size:15.5px;text-transform:capitalize}
.month header span{margin-left:auto;font-size:13px;color:var(--muted)}
.ecr{display:grid;grid-template-columns:44px minmax(0,1fr) 120px 236px;gap:4px 12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.ecr .d{font-size:13px;color:var(--faint);text-align:center;line-height:1.1}
.ecr .d b{display:block;font-size:17px;color:var(--text);font-weight:500}
.ecr .t b{font-weight:500}
.ecr .t small{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.ecr .t small i{width:7px;height:7px;border-radius:50%;background:var(--seg-3);flex:none}
.ecr .t small i.recette{background:var(--pos)}
.ecr .t small i.bilan{background:transparent;border:1.5px solid var(--faint)}
.ecr .m{font-weight:500;text-align:right;white-space:nowrap}
.ecr .m.recette{color:var(--pos)}
.ecr .a{display:flex;gap:2px;justify-content:flex-end;align-items:center}
.ecr.editing{background:var(--accent-soft)}
.ecr .c{grid-column:2 / -1;font-size:13px;color:var(--muted)}
@media (max-width:600px){ .ecr{grid-template-columns:38px minmax(0,1fr) auto} .ecr .a{grid-column:2 / -1;justify-content:flex-start} }
.composer{border:1px dashed var(--line);background:var(--surface-2)}
.pj{white-space:nowrap}

/* ---------- Visionneuse ---------- */
dialog#viewer{width:min(1000px,96vw);height:92vh;padding:0;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);color:var(--text);overscroll-behavior:contain}
html.modal-open,html.modal-open body{overflow:hidden}
dialog#viewer::backdrop{background:rgba(10,15,25,.5)}
#viewer .vbar{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
#viewer iframe{width:100%;height:calc(92vh - 56px);border:0;background:#fff}

/* ---------- Banque : opérations à trier ---------- */
.op{display:grid;grid-template-columns:44px minmax(0,1fr) 120px;gap:6px 12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.op:first-of-type{border-top:0}
.op .d{font-size:13px;color:var(--faint);text-align:center;line-height:1.1}
.op .d b{display:block;font-size:17px;color:var(--text);font-weight:500}
.op .d small{display:block;font-size:11.5px}
.op .t{font-size:13.5px;overflow-wrap:anywhere}
.op .t small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.op .m{font-weight:500;text-align:right;white-space:nowrap}
.op .m.recette{color:var(--pos)}
.op .f{grid-column:2 / -1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.op .f select{min-width:200px}
.op .f input{flex:1;min-width:150px}
.op.classe{background:var(--surface-2)}
.op .dbl{grid-column:2 / -1;margin:0}
@media (max-width:600px){ .op{grid-template-columns:38px minmax(0,1fr) auto} .op .f select{min-width:0;flex:1} }

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:50;box-shadow:0 8px 24px rgba(10,15,25,.18);max-width:90vw}
.fiche .card h3{padding-bottom:8px;border-bottom:1px solid var(--line)}

@media print{
  .side,.topbar,.scrim,.noprint{display:none!important}
  .app{display:block}
  body{background:#fff;color:#000}
  main{padding:0;max-width:none}
  .card{border:0;padding:0;margin-bottom:18px}
}
</style>
</head>
<body>
<div class="topbar noprint">
  <button class="btn ghost" aria-label="Ouvrir le menu" onclick="document.body.classList.add('menu-open')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <div class="brand"><b>Carnet LMNP</b></div>
  <span class="status" id="statusTop"></span>
</div>
<div class="scrim" onclick="document.body.classList.remove('menu-open')"></div>
<div class="app">
  <aside class="side noprint">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="var(--accent)"/><path d="M9 22.5V13.2L16 8l7 5.2v9.3h-5.2v-5.1h-3.6v5.1z" fill="var(--accent-ink)"/></svg>
      <div><b>Carnet LMNP</b><small id="fileinfo">Aucun dossier ouvert</small></div>
    </div>
    <div class="yearbox" id="yearbox"><label>Exercice<select id="yearSel"></select></label></div>
    <nav class="menu" id="tabs" aria-label="Sections"></nav>
    <div class="sidefoot">
      <div class="status" id="dirty"></div>
      <button class="btn wide" id="saveBtn" disabled>Enregistrer</button>
      <div class="prefs">
        <button id="cptBtn" aria-pressed="false" title="Afficher les numéros de comptes à côté des natures">N° de comptes</button>
        <button id="themeBtn" aria-pressed="false" title="Basculer entre le thème clair et le thème sombre"></button>
      </div>
    </div>
  </aside>
  <main id="main"></main>
</div>

<input type="file" id="fileInput" accept=".json,application/json" class="hide">
<input type="file" id="csvInput" accept=".csv,.txt,text/csv" class="hide">
<dialog id="viewer"><div class="vbar"><b id="vTitle" style="margin-right:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></b><a class="btn small sec" id="vOpen" target="_blank">Ouvrir dans un onglet</a><button class="btn small" onclick="fermerPiece()">Fermer</button></div><iframe id="vFrame" title="Justificatif"></iframe></dialog>

<script>
"use strict";
/* ============ Paramètres ============ */
const NATURES = {
  "Loyer":{g:"recette",l:"218",c:"706000",piece:false},
  "Charges refacturées":{g:"recette",l:"218",c:"708400"},
  "Autre recette":{g:"recette",l:"218",c:"708800"},
  "Copropriété":{g:"charge",l:"242",c:"614000"},
  "Assurance":{g:"charge",l:"242",c:"616000"},
  "Assurance emprunt":{g:"charge",l:"242",c:"616100",piece:false},
  "Eau":{g:"charge",l:"242",c:"606110"},
  "Électricité / gaz":{g:"charge",l:"242",c:"606120"},
  "Internet":{g:"charge",l:"242",c:"626000"},
  "Entretien et réparations":{g:"charge",l:"242",c:"615000"},
  "Petit équipement (< 500 € HT)":{g:"charge",l:"242",c:"606300"},
  "Frais de gestion / agence":{g:"charge",l:"242",c:"622800"},
  "Honoraires":{g:"charge",l:"242",c:"622600"},
  "Frais bancaires":{g:"charge",l:"242",c:"627000"},
  "Autre charge":{g:"charge",l:"242",c:"628000"},
  "Taxe foncière":{g:"charge",l:"244",c:"635120"},
  "CFE":{g:"charge",l:"244",c:"635110"},
  "Intérêts emprunt":{g:"charge",l:"294",c:"661160",piece:false},
  "Remboursement emprunt":{g:"bilan",l:"",c:"164000",piece:false}
};
/* Plan comptable général : libellés des comptes utilisés (natures, immobilisations, export FEC) */
const COMPTES = {
  "108000":"Compte de l'exploitant", "164000":"Emprunts auprès des établissements de crédit",
  "211000":"Terrains", "213000":"Constructions", "213500":"Installations générales, agencements des constructions", "218400":"Mobilier",
  "281300":"Amortissements des constructions", "281350":"Amortissements des installations et agencements", "281840":"Amortissements du mobilier",
  "512000":"Banque", "606110":"Eau", "606120":"Électricité, gaz", "606300":"Fournitures d'entretien et de petit équipement",
  "614000":"Charges locatives et de copropriété", "615000":"Entretien et réparations", "616000":"Primes d'assurance", "616100":"Assurance emprunteur",
  "622600":"Honoraires", "622800":"Frais de gestion locative", "626000":"Frais de télécommunications", "627000":"Services bancaires", "628000":"Charges diverses",
  "635110":"Cotisation foncière des entreprises", "635120":"Taxe foncière", "661160":"Intérêts des emprunts", "681120":"Dotations aux amortissements des immobilisations corporelles",
  "706000":"Prestations de services (loyers)", "708400":"Charges refacturées aux locataires", "708800":"Autres produits des activités annexes"
};
const CPT_IMMO = {construction:{brut:"213000", am:"281300"}, travaux:{brut:"213500", am:"281350"}, mobilier:{brut:"218400", am:"281840"}};
const compteNature = n => NATURES[n]?.c || (NATURES[n] ? "" : "628000");
/* Nature affichée, précédée de son compte si l'option « N° de comptes » est active */
const libNature = n => (comptesVisibles() && compteNature(n) ? `<span class="cpt">${compteNature(n)}</span>` : "") + esc(n);
const optNature = (n, sel) => `<option value="${esc(n)}" ${n===sel?"selected":""}>${comptesVisibles()&&compteNature(n)?compteNature(n)+" · ":""}${esc(n)}</option>`;
const CATEGORIES = {construction:"Logement (bâti + terrain)", travaux:"Travaux / agencements", mobilier:"Mobilier et équipements"};
const DUREE_DEFICIT = 10;

/* ============ État ============ */
const S = {data:null, dirty:false, dir:null, fileName:null, year:null, tab:"accueil", editId:null, editImmo:null, unlocked:{}};

/* ============ Utilitaires ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const eur = n => (n==null||isNaN(n)) ? "–" : n.toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2}) + " €";
const eur0 = n => (n==null||isNaN(n)) ? "–" : Math.round(n).toLocaleString("fr-FR") + " €";
const uid = () => Math.random().toString(36).slice(2,10);
const yearOf = d => parseInt(String(d).slice(0,4),10);
const monthOf = d => parseInt(String(d).slice(5,7),10);
const MOIS = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const fmtDate = d => d ? d.slice(8,10)+"/"+d.slice(5,7)+"/"+d.slice(0,4) : "";

function setDirty(v=true){
  S.dirty=v; if(v) S.version = (S.version||0) + 1;
  statut(v ? (S.dir ? "Enregistrement…" : "Modifications non enregistrées") : (S.autoMsg||""), v && !S.dir);
  $("#saveBtn").disabled = !S.data;
  if(v && S.dir){ clearTimeout(S.autoT); S.autoT = setTimeout(autoSave, 1200); }
}
function statut(txt, alerte){ for(const id of ["#dirty","#statusTop"]){ const el = $(id); if(el){ el.textContent = txt; el.classList.toggle("warn", !!alerte); } } }
/* Enregistrement automatique dans le dossier (sans demander d'autorisation) */
async function autoSave(){
  if(!S.dir || !S.dirty) return;
  try{
    if(await S.dir.queryPermission({mode:"readwrite"}) !== "granted"){ S.autoMsg=""; statut("Non enregistré : cliquez sur Enregistrer", true); return; }
    const v = S.version;
    await ecrireDossier(!S.sauvegardeSession);
    if(S.version === v){ const d = new Date(); S.autoMsg = "✓ Enregistré à " + d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}); setDirty(false); }
  }catch(e){ statut("Échec de l'enregistrement automatique : cliquez sur Enregistrer", true); }
}
async function ecrireDossier(avecCopie){

/* ============ Modèle : migration ============ */
function normalize(d){
  d.dossier ??= {}; d.immobilisations ??= []; d.emprunts ??= []; d.exercices ??= {};
  d.dossier.declarant ??= "1";
  d.reports ??= {};
  if(!Array.isArray(d.reports.deficits)) d.reports.deficits = [];
  d.reports.amortissementsDifferes ??= 0;
  delete d.reports.deficitsAnterieurs;
  for(const [y,ex] of Object.entries(d.exercices)){
    if(ex.ecritures) ex.ecritures.forEach(e => { e.id ??= uid(); });
  }
  d.immobilisations.forEach(i => { i.id ??= uid(); i.quotePartTerrain ??= 0; });
  d.banque ??= {};
  d.banque.regles ??= []; d.banque.aTrier ??= []; d.banque.ignorees ??= [];
  return d;
}
function newDossier(){
  const y = new Date().getFullYear();
  return normalize({format:"outil-lmnp",version:1,dossier:{nom:"Mon LMNP",regime:"reel-simplifie",debutLocationMeublee:y+"-01-01"},
    immobilisations:[],emprunts:[],exercices:{[y]:{statut:"en-cours",ecritures:[]}},reports:{}});
}

/* ============ Calculs : amortissements ============ */
function debutLMNP(){ return S.data.dossier.debutLocationMeublee || "1900-01-01"; }
function baseAmort(i){ return r2(i.valeurOrigine * (1 - (i.quotePartTerrain||0))); }
function planAmort(i){
  const base = baseAmort(i), annuite = base / i.dureeAns;
  const y0 = yearOf(i.miseEnService), m0 = monthOf(i.miseEnService);
  const plan = []; let cumul = 0, y = y0;
  while(cumul < base - 0.005 && y < y0 + i.dureeAns + 2){
    const mois = (y === y0) ? 13 - m0 : 12;
    let dot = Math.min(annuite * mois / 12, base - cumul);
    cumul += dot;
    plan.push({annee:y, dotation:dot, cumul, vnc: base - cumul, avantLMNP: y < yearOf(debutLMNP())});
    y++;
  }
  return plan;
}
function amortAnnee(i, y){
  const plan = planAmort(i);
  const row = plan.find(p => p.annee === y);
  const prev = plan.filter(p => p.annee < y);
  const cumulDebut = prev.length ? prev[prev.length-1].cumul : 0;
  return {dotation: row ? row.dotation : 0, cumulDebut, cumulFin: cumulDebut + (row ? row.dotation : 0), base: baseAmort(i)};
}
function anneeEntreeBilan(i){ return Math.max(yearOf(i.miseEnService), yearOf(debutLMNP())); }

/* ============ Calculs : emprunt ============ */
function echeancier(l){
  const r = l.tauxAnnuel / 12;
  let m = l.mensualite;
  if(!m) m = r ? l.capital * r / (1 - Math.pow(1+r, -l.dureeMois)) : l.capital / l.dureeMois;
  const rows = []; let crd = l.capital;
  const y0 = yearOf(l.premiereEcheance), m0 = monthOf(l.premiereEcheance);
  for(let k=0;k<l.dureeMois && crd>0.005;k++){
    const interet = crd * r;
    let capital = m - interet;
    if(k === l.dureeMois-1 || capital > crd) capital = crd;
    crd -= capital;
    const mm = m0 - 1 + k;
    rows.push({n:k+1, annee: y0 + Math.floor(mm/12), mois: (mm%12)+1, interet, capital, crd});
  }
  return rows;
}
function empruntAnnee(l, y){
  const rows = echeancier(l);
  const inY = rows.filter(r => r.annee === y);
  const before = rows.filter(r => r.annee <= y);
  return {interets: inY.reduce((s,r)=>s+r.interet,0), capital: inY.reduce((s,r)=>s+r.capital,0),
          crdFin: before.length ? before[before.length-1].crd : (yearOf(l.premiereEcheance) > y ? 0 : l.capital), demarre: yearOf(l.premiereEcheance) <= y};
}

/* ============ Calculs : exercice ============ */
function exercice(y){ return S.data.exercices[y]; }
function isHistorique(y){ const ex = exercice(y); return ex && ex.statut === "historique"; }
function anneesCalculees(){
  return Object.keys(S.data.exercices).map(Number).filter(y => !isHistorique(y)).sort((a,b)=>a-b);
}
function totauxEcritures(y){
  const ex = exercice(y) || {}; const t = {parNature:{}, recettes:0, c242:0, c244:0, c294:0, remb:0, inconnues:0};
  (ex.ecritures||[]).forEach(e => {
    const nat = NATURES[e.nature] || {g: e.sens === "recette" ? "recette" : "charge", l: e.sens==="recette"?"218":"242", inconnue:true};
    if(nat.inconnue) t.inconnues++;
    t.parNature[e.nature] = (t.parNature[e.nature]||0) + e.montant;
    if(nat.g === "recette") t.recettes += e.montant;
    else if(nat.g === "bilan") t.remb += e.montant;
    else if(nat.l === "244") t.c244 += e.montant;
    else if(nat.l === "294") t.c294 += e.montant;
    else t.c242 += e.montant;
  });
  return t;
}
function calculAnnee(y){
  const t = totauxEcritures(y);
  const lmnpActif = y >= yearOf(debutLMNP());
  // Intérêts : réels si saisis, sinon échéancier
  let interetsEch = 0, capitalEch = 0, crd = 0;
  S.data.emprunts.forEach(l => { const a = empruntAnnee(l,y); interetsEch += a.interets; capitalEch += a.capital; crd += a.crdFin; });
  const interetsSaisis = (t.parNature["Intérêts emprunt"]||0) > 0;
  const interets = interetsSaisis ? t.c294 : t.c294 + interetsEch;
  const ex = exercice(y) || {};
  const crdRetenu = (ex.crdBanque != null && ex.crdBanque !== "") ? Number(ex.crdBanque) : crd;
  // Amortissements
  const immos = S.data.immobilisations.map(i => ({i, a: amortAnnee(i,y), entree: anneeEntreeBilan(i)}));
  const dotations = immos.reduce((s,x)=> s + (x.entree <= y ? x.a.dotation : 0), 0);
  const produits = t.recettes;
  const resultatAvantAmort = produits - t.c242 - t.c244 - interets;
  const resultatComptable = resultatAvantAmort - dotations;
  return {y, t, lmnpActif, produits, c242:t.c242, c244:t.c244, interets, interetsEch, interetsSaisis, capitalEch,
          crdEch:crd, crd:crdRetenu, dotations, immos, resultatAvantAmort, resultatComptable};
}
/* Chaîne fiscale (art. 39 C : les amortissements ne peuvent pas créer ou augmenter un déficit) */
function fiscalJusqua(yCible){
  let ard = Number(S.data.reports.amortissementsDifferes)||0;
  let deficits = (S.data.reports.deficits||[]).map(d => ({...d}));
  let res = null;
  for(const y of anneesCalculees()){
    if(y > yCible) break;
    const c = calculAnnee(y);
    const ardDebut = ard, deficitsDebut = deficits.map(d=>({...d}));
    // déficits périmés
    const perimes = deficits.filter(d => y - d.annee > DUREE_DEFICIT);
    deficits = deficits.filter(d => y - d.annee <= DUREE_DEFICIT);
    let R0 = c.resultatAvantAmort, dotDeductible = 0, ardUtilise = 0, ardNouveau = 0, deficitAnnee = 0;
    if(R0 <= 0){
      ardNouveau = c.dotations; deficitAnnee = -R0;
    } else {
      dotDeductible = Math.min(c.dotations, R0);
      ardNouveau = c.dotations - dotDeductible;
      // priorité aux déficits antérieurs (limités à 10 ans), puis aux amortissements différés (sans limite)
      const defDispo = deficits.reduce((s,d)=>s+d.montant,0);
      ardUtilise = Math.min(ard, Math.max(0, R0 - dotDeductible - defDispo));
    }
    ard = ard - ardUtilise + ardNouveau;
    const resultatFiscal = R0 - dotDeductible - ardUtilise; // >= 0 si R0>0, sinon = R0 (déficit)
    // Imputation des déficits antérieurs sur le bénéfice
    let deficitsImputes = 0, reste = Math.max(resultatFiscal,0);
    deficits.sort((a,b)=>a.annee-b.annee).forEach(d => { const u = Math.min(d.montant, reste); d.montant -= u; reste -= u; deficitsImputes += u; });
    deficits = deficits.filter(d => d.montant > 0.005);
    if(deficitAnnee > 0) deficits.push({annee:y, montant:deficitAnnee});
    if(y === yCible) res = {c, R0, dotDeductible, ardUtilise, ardNouveau, ardDebut, ardFin:ard, reintegration:c.dotations - dotDeductible,
      resultatFiscal, deficitsImputes, deficitsDebut, deficitsFin:deficits.map(d=>({...d})), deficitAnnee, perimes};
  }
  return res;
}
function bilan(y){
  if(isHistorique(y)){
    const h = exercice(y).chiffres || {};
    return {historique:true, immoNettes:h.immobilisationsNettes, crd:h.capitalRestantDu, capital:h.capitalExploitant, resultat:h.resultat};
  }
  const c = calculAnnee(y);
  let brut = 0, amort = 0;
  const lignes = {terrain:{}, construction:{}, travaux:{}, mobilier:{}};
  for(const k in lignes) lignes[k] = {brutDebut:0, aug:0, brutFin:0, amDebut:0, dot:0, amFin:0};
  S.data.immobilisations.forEach(i => {
    const entree = anneeEntreeBilan(i); if(entree > y) return;
    const a = amortAnnee(i,y);
    const terrain = r2(i.valeurOrigine - baseAmort(i));
    const cat = i.categorie === "construction" ? "construction" : (i.categorie === "mobilier" ? "mobilier" : "travaux");
    const add = (L, v, isNew) => { if(isNew) L.aug += v; else L.brutDebut += v; L.brutFin += v; };
    if(terrain > 0) add(lignes.terrain, terrain, entree === y);
    add(lignes[cat], baseAmort(i), entree === y);
    lignes[cat].amDebut += (entree === y ? 0 : a.cumulDebut);
    lignes[cat].dot += a.dotation + (entree === y ? a.cumulDebut : 0);
    lignes[cat].amFin += a.cumulFin;
    brut += i.valeurOrigine; amort += a.cumulFin;
  });
  const immoNettes = brut - amort;
  return {historique:false, brut, amort, immoNettes, crd:c.crd, resultat:c.resultatComptable,
          capital: immoNettes - c.resultatComptable - c.crd, lignes};
}

function chargerDonnees(obj, nom){
  if(!obj || obj.format !== "outil-lmnp") throw new Error("Ce fichier n'est pas un dossier de l'outil LMNP.");
  S.data = normalize(obj); S.fileName = nom; S.autoMsg = ""; S.sauvegardeSession = false;
  const ys = Object.keys(S.data.exercices).map(Number).sort((a,b)=>a-b);

}
async function ouvrirDossier(){

    S.dir = dir; await idb.set("dir", dir);

  }catch(e){ if(e.name !== "AbortError") alert("Impossible d'ouvrir ce dossier : " + e.message + "\n\nSi le dossier est dans iCloud Drive et que le navigateur le refuse, essayez un dossier de « Documents » synchronisé avec iCloud."); }

  if(await dir.requestPermission({mode:"readwrite"}) !== "granted") return;
  S.dir = dir; await lireDepuisDossier();
}
async function lireDepuisDossier(){
  try{
    const fh = await S.dir.getFileHandle(FILE);

    chargerDonnees(JSON.parse(txt), S.dir.name + "/" + FILE);

}

function horodatage(){ const d=new Date(), p=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}h${p(d.getMinutes())}`; }
async function enregistrer(){

  const txt = JSON.stringify(S.data, null, 2);
  if(S.dir){
    try{

      clearTimeout(S.autoT); await ecrireDossier(true);

}

  if(exercice(y).statut === "cloture") alerts.push(["info","Exercice clôturé : les écritures sont verrouillées. Vous pouvez les déverrouiller depuis la page Écritures."]);
  const loyers = (exercice(y).ecritures||[]).filter(e=>e.nature==="Loyer").map(e=>monthOf(e.date));
  const manquants = [...Array(12).keys()].map(i=>i+1).filter(m => !loyers.includes(m) && (y < new Date().getFullYear() || m <= new Date().getMonth()+1));
  if(c.lmnpActif && manquants.length && manquants.length < 12) alerts.push(["warn", `Aucun loyer saisi pour : ${manquants.map(m=>MOIS[m-1]).join(", ")}.`]);
  if(c.lmnpActif && !c.t.parNature["CFE"] && c.produits > 5000) alerts.push(["warn","Aucune CFE saisie. Au-delà de 5 000 € de recettes, elle est en principe due : l'avis se consulte dans l'espace professionnel impots.gouv.fr (il n'est pas envoyé par courrier)."]);
  if(S.data.emprunts.length && !c.interetsSaisis) alerts.push(["info", `Intérêts non saisis : l'échéancier théorique est utilisé (${eur(c.interetsEch)}).`]);
  if(S.data.emprunts.length && c.interetsSaisis && Math.abs(c.interets - c.interetsEch) > 1) alerts.push(["info", `Intérêts réellement prélevés : ${eur(c.interets)}, contre ${eur(c.interetsEch)} selon l'échéancier théorique. Le montant réel est retenu.`]);
  if(c.t.inconnues) alerts.push(["warn", `${c.t.inconnues} écriture(s) ont une nature inconnue : elles sont classées en charges externes.`]);
  if(f.reintegration > 0.5) alerts.push(["info", `${eur(f.reintegration)} d'amortissements ne sont pas déductibles cette année car ils créeraient un déficit : ils sont reportés, sans limite de durée.`]);

  // Des loyers au résultat
  const amortDeduits = f.dotDeductible + f.ardUtilise;
  const segs = [["Charges externes", c.c242, "var(--seg-1)"],["Impôts et taxes", c.c244, "var(--seg-2)"],["Intérêts d'emprunt", c.interets, "var(--seg-3)"],["Amortissements déduits", amortDeduits, "var(--accent)"],["Résultat imposable", Math.max(f.resultatFiscal,0), "var(--pos)"]];
  const base = Math.max(c.produits, c.c242 + c.c244 + c.interets + amortDeduits, 1);
  const rf = f.resultatFiscal;
  const phrase = rf > 0
    ? `Sur ${eur0(c.produits)} de loyers, ${eur0(rf)} seront imposés : les charges en absorbent ${eur0(c.c242+c.c244+c.interets)} et les amortissements ${eur0(amortDeduits)}.`
    : rf === 0 ? `Les ${eur0(c.produits)} de loyers sont entièrement couverts par les charges et les amortissements : rien n'est imposé.${f.ardFin>0.5?` ${eur0(f.ardFin)} d'amortissements restent en réserve pour les années suivantes.`:""}`
    : `Les charges dépassent les loyers de ${eur0(-rf)} : ce déficit pourra être déduit des bénéfices de location meublée des dix prochaines années.`;
  const decl = exercice(y).chiffresDeclares;
  let comp = "";
  if(decl){
    const rows = [["Loyers",decl.loyers,c.produits],["Charges externes",decl.chargesExternes,c.c242],["Impôts et taxes",decl.impotsTaxes,c.c244],["Dotations aux amortissements",decl.dotationsAmortissements,c.dotations],["Intérêts",decl.interets,c.interets],["Résultat",decl.resultat,c.resultatComptable]];
    comp = `<div class="card"><h3>Comparaison avec l'ancien fichier Excel</h3><div class="tablewrap"><table><tr><th></th><th class="n">Excel</th><th class="n">Carnet</th><th class="n">Écart</th></tr>
      ${rows.map(([l,a,b])=>`<tr><td>${l}</td><td class="n">${eur(a)}</td><td class="n">${eur(b)}</td><td class="n">${Math.abs(b-a)<0.02?'<span class="pill">identique</span>':eur(b-a)}</td></tr>`).join("")}</table></div></div>`;
  }
  const nat = Object.entries(c.t.parNature).sort((a,b)=>b[1]-a[1]);
  return entete(`Exercice ${y}`, `${esc(S.data.dossier.nom)}, régime réel simplifié. Revenus à déclarer au printemps ${y+1}.`) + `
    <section class="card flow" aria-label="Des loyers au résultat">
      <p class="lead">Résultat fiscal ${y}</p>
      <p class="big ${rf<0?"neg":""}">${eur0(rf)}</p>
      <p class="phrase">${phrase}</p>
      <div class="bar" role="img" aria-label="Répartition des loyers entre charges, amortissements et résultat">${segs.filter(x=>x[1]>0.5).map(([l,v,col])=>`<span style="width:${(v/base*100).toFixed(2)}%;background:${col}" title="${l} : ${eur0(v)}"></span>`).join("")}</div>
      <div class="legend"><div><i style="background:transparent;border:1.5px solid var(--faint)"></i>Loyers encaissés<b>${eur0(c.produits)}</b></div>${segs.map(([l,v,col])=>`<div><i style="background:${col}"></i>${l}<b>${eur0(v)}</b></div>`).join("")}</div>
    </section>
    ${alerts.length?`<div class="alerts">${alerts.map(([k,t])=>`<div class="alert ${k}">${t}</div>`).join("")}</div>`:""}
    ${comp}
    <div class="card"><h3>Par nature</h3><div class="tablewrap"><table>
      ${nat.map(([n,v])=>`<tr><td>${libNature(n)}</td><td>${NATURES[n]?.l?`<span class="case" title="Ligne de la 2033-B">${NATURES[n].l}</span>`:'<span class="pill">hors résultat</span>'}</td><td class="n">${eur(v)}</td></tr>`).join("") || '<tr><td class="muted">Aucune écriture pour l\'instant.</td></tr>'}
    </table></div></div>`;
}
function kpi(l,v,signe){ return `<div class="card kpi"><div class="l">${l}</div><div class="v" style="${signe&&v<0?'color:var(--neg)':''}">${eur(v)}</div></div>`; }

/* ---- Écritures ---- */
function verrouille(y){ return exercice(y)?.statut === "cloture" && !S.unlocked[y]; }
const MOIS_LONG = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const svgI = d => `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const I_EDIT = svgI('<path d="M5 19h3l10-10-3-3L5 16zM13 7l3 3"/>'), I_DEL = svgI('<path d="M6 7h12M10 7V5h4v2M8 7l1 12h6l1-12"/>'), I_CLIP = svgI('<path d="M16 8l-6.5 6.5a2 2 0 0 0 3 3L19 11a4 4 0 0 0-6-6l-7 7a6 6 0 0 0 9 9l5-5"/>');
function piecesLigne(e){
  if(e.piece) return `<button class="btn ghost small pj" style="color:var(--accent)" title="${esc(e.piece)}" onclick="ouvrirPiece('${e.id}')">${I_CLIP}Voir</button>`;

}
function vueEcritures(){
  const y = S.year;
  if(isHistorique(y)) return entete(`Écritures ${y}`) + `<div class="alert info">Exercice repris de l'Excel : pas d'écritures détaillées.</div>`;
  const ex = exercice(y); ex.ecritures ??= [];
  const list = [...ex.ecritures].sort((a,b)=> a.date.localeCompare(b.date));
  const lock = verrouille(y);
  const ed = S.editId ? ex.ecritures.find(e=>e.id===S.editId) : null;
  const ouvert = !lock && (S.composer || ed);
  const natOpts = sel => Object.keys(NATURES).map(n=>optNature(n, sel)).join("");
  const t = totauxEcritures(y);
  const parMois = {};
  list.forEach(e => (parMois[monthOf(e.date)] ??= []).push(e));
  const groupe = g => NATURES[g.nature]?.g || (g.sens==="recette"?"recette":"charge");
  return entete(`Écritures ${y}`, "Chaque mouvement d'argent lié à la location : loyers encaissés, factures payées, échéances de prêt.") + `
  ${lock ? `<div class="alerts"><div class="alert warn" style="align-items:center">Exercice clôturé : les écritures sont verrouillées.<button class="btn small sec" style="margin-left:auto" onclick="S.unlocked[${y}]=true;renderAll()">Déverrouiller</button></div></div>` : ""}
  <div class="row noprint" style="margin-bottom:18px">
    ${lock?"":`<button class="btn" onclick="S.composer=!S.composer;S.editId=null;renderAll()">${ouvert&&!ed?"Fermer":"Nouvelle écriture"}</button>
    <button class="btn sec" onclick="dupliquerMois()">Recopier le dernier mois</button>`}
    <span style="margin-left:auto;color:var(--muted);font-size:14px">${list.length} écritures, ${eur(t.recettes)} encaissés, ${eur(t.c242+t.c244+t.c294+t.remb)} payés</span>
  </div>
  ${ouvert ? `<div class="card composer noprint"><h3>${ed?"Modifier l'écriture":"Nouvelle écriture"}</h3><div class="form">
    <label>Date<input type="date" id="eDate" value="${ed?ed.date:(list.length?list[list.length-1].date:y+"-01-01")}"></label>
    <label>Tiers<input id="eTiers" list="tiersList" value="${esc(ed?ed.tiers:"")}" placeholder="Ex. syndic, banque"></label>
    <label>Nature<select id="eNat">${natOpts(ed?ed.nature:"Loyer")}</select></label>
    <label>Montant TTC<input id="eMont" inputmode="decimal" value="${ed?String(ed.montant).replace(".",","):""}" placeholder="0,00"></label>
    <label style="grid-column:span 2">Commentaire<input id="eCom" value="${esc(ed?.commentaire||"")}" placeholder="Facultatif"></label>
    <div class="row"><button class="btn" onclick="saveEcriture()">${ed?"Enregistrer la modification":"Ajouter"}</button><button class="btn ghost" onclick="S.editId=null;S.composer=false;renderAll()">Annuler</button></div>
  </div>
  <datalist id="tiersList">${[...new Set(ex.ecritures.map(e=>e.tiers).filter(Boolean))].map(t=>`<option value="${esc(t)}">`).join("")}</datalist></div>` : ""}
  ${list.length ? Object.entries(parMois).map(([m,es]) => {
    const rec = es.filter(e=>groupe(e)==="recette").reduce((s,e)=>s+e.montant,0), dep = es.filter(e=>groupe(e)!=="recette").reduce((s,e)=>s+e.montant,0);
    return `<section class="card month"><header><h3>${MOIS_LONG[m-1]} ${y}</h3><span>${rec?`+${eur(rec)}`:""}${rec&&dep?" / ":""}${dep?`−${eur(dep)}`:""}</span></header>
    ${es.map(e => { const g = groupe(e); return `<div class="ecr ${S.editId===e.id?"editing":""}">
      <div class="d"><b>${e.date.slice(8,10)}</b>${MOIS[monthOf(e.date)-1]}</div>
      <div class="t" ${e.libelleBanque?`title="Relevé bancaire : ${esc(e.libelleBanque)}"`:""}><b>${esc(e.tiers)||"Sans tiers"}</b><small><i class="${g}"></i>${libNature(e.nature)}</small></div>
      <div class="m ${g}">${g==="recette"?"+":"−"}${eur(e.montant)}</div>
      <div class="a noprint">${piecesLigne(e)}${lock?"":`<button class="btn ghost small" aria-label="Modifier" title="Modifier" onclick="S.editId='${e.id}';renderAll();scrollTo(0,0)">${I_EDIT}</button><button class="btn ghost small" aria-label="Supprimer" title="Supprimer" onclick="delEcriture('${e.id}')">${I_DEL}</button>`}</div>
      ${e.commentaire?`<div class="c">${esc(e.commentaire)}</div>`:""}
    </div>`; }).join("")}</section>`; }).join("")
  : `<div class="card"><p class="sub" style="margin:0">Aucune écriture pour ${y}. Commencez par le premier loyer encaissé avec « Nouvelle écriture ».</p></div>`}`;
}
function parseMontant(s){ return Number(String(s).replace(/\s/g,"").replace(",", ".")); }
function saveEcriture(){
  const ex = exercice(S.year);
  const e = {date:$("#eDate").value, tiers:$("#eTiers").value.trim(), nature:$("#eNat").value, montant:r2(parseMontant($("#eMont").value)), commentaire:$("#eCom").value.trim()};
  if(!e.date || isNaN(e.montant) || e.montant <= 0) return alert("Date et montant positif obligatoires.");
  if(yearOf(e.date) !== S.year) return alert("La date doit être dans l'exercice " + S.year + ".");
  e.sens = NATURES[e.nature].g === "recette" ? "recette" : "depense";
  if(!e.commentaire) delete e.commentaire;
  if(S.editId){ Object.assign(ex.ecritures.find(x=>x.id===S.editId), e); S.editId = null; }
  else ex.ecritures.push({id:uid(), ...e});
  setDirty(); renderAll(); setTimeout(()=>$("#eMont")?.focus(),0);
}
function delEcriture(id){ if(!confirm("Supprimer cette écriture ?")) return; const ex = exercice(S.year); ex.ecritures = ex.ecritures.filter(e=>e.id!==id); setDirty(); renderAll(); }
function dupliquerMois(){
  const ex = exercice(S.year); if(!ex.ecritures.length) return alert("Aucune écriture à recopier.");
  const last = ex.ecritures.map(e=>monthOf(e.date)).reduce((a,b)=>Math.max(a,b));
  if(last === 12) return alert("Le dernier mois saisi est décembre.");
  const src = ex.ecritures.filter(e=>monthOf(e.date)===last);
  if(!confirm(`Recopier ${src.length} écriture(s) de ${MOIS[last-1]} sur ${MOIS[last]} ? Pensez à ajuster les montants qui changent (intérêts, eau…).`)) return;
  src.forEach(e => { const d = `${S.year}-${String(last+1).padStart(2,"0")}-${e.date.slice(8,10)}`;
    const valid = new Date(d).getMonth()+1 === last+1 ? d : `${S.year}-${String(last+1).padStart(2,"0")}-28`;
    ex.ecritures.push({...e, id:uid(), date:valid}); });
  setDirty(); renderAll();
}

/* ============ Comptabilité : écritures en partie double, balance, FEC ============ */
/* Reconstitue les écritures comptables d'un exercice à partir des saisies (rien n'est stocké en plus) */
function ecrituresComptables(y){
  const out = [], c = calculAnnee(y), fin = `${y}-12-31`, debut = `${y}-01-01`;
  const add = (journal, date, lib, lignes, piece) => { lignes = lignes.filter(l => Math.abs(l.d||0) > 0.004 || Math.abs(l.cr||0) > 0.004); if(lignes.length) out.push({journal, date, lib, lignes, piece}); };
  // À-nouveaux : immobilisations, amortissements antérieurs, emprunt ; le compte de l'exploitant équilibre
  const an = [];
  S.data.immobilisations.forEach(i => {
    if(anneeEntreeBilan(i) > y) return;
    const a = amortAnnee(i, y), k = CPT_IMMO[i.categorie] || CPT_IMMO.travaux, terrain = r2(i.valeurOrigine - baseAmort(i));
    if(terrain > 0) an.push({c:"211000", d:terrain});
    an.push({c:k.brut, d:baseAmort(i)}, {c:k.am, cr:r2(a.cumulDebut)});
  });
  const crdPrec = exercice(y-1) ? Number(bilan(y-1).crd) : NaN;
  const crdDebut = crdPrec >= 0 ? crdPrec : S.data.emprunts.reduce((s,l)=>s+empruntAnnee(l,y-1).crdFin,0);
  if(crdDebut > 0) an.push({c:"164000", cr:r2(crdDebut)});
  const solde = r2(an.reduce((s,l)=>s+(l.d||0)-(l.cr||0),0));
  an.push(solde >= 0 ? {c:"108000", cr:solde} : {c:"108000", d:-solde});
  add("AN", debut, "À-nouveaux au 1er janvier", an);
  // Mouvements de banque saisis
  [...(exercice(y).ecritures||[])].sort((a,b)=>a.date.localeCompare(b.date)).forEach(e => {
    const k = compteNature(e.nature), m = r2(e.montant), lib = [e.tiers, e.nature].filter(Boolean).join(" - ");
    const recette = (NATURES[e.nature]?.g || (e.sens==="recette"?"recette":"charge")) === "recette";
    add("BQ", e.date, lib, recette ? [{c:"512000", d:m}, {c:k, cr:m}] : [{c:k, d:m}, {c:"512000", cr:m}], e.piece ? e.piece.split("/").pop() : e.id);
  });
  if(S.data.emprunts.length && !c.interetsSaisis && c.interetsEch > 0.004)
    add("OD", fin, "Intérêts d'emprunt selon l'échéancier", [{c:"661160", d:r2(c.interetsEch)}, {c:"512000", cr:r2(c.interetsEch)}]);
  // Dotations aux amortissements, par catégorie
  const dot = {};
  c.immos.forEach(x => { if(x.entree <= y && x.a.dotation > 0){ const k = (CPT_IMMO[x.i.categorie] || CPT_IMMO.travaux).am; dot[k] = (dot[k]||0) + x.a.dotation; } });
  Object.entries(dot).forEach(([k,v]) => add("OD", fin, "Dotation aux amortissements " + y, [{c:"681120", d:r2(v)}, {c:k, cr:r2(v)}]));
  return out;
}
function balance(y){
  const b = {};
  ecrituresComptables(y).forEach(e => e.lignes.forEach(l => { const x = b[l.c] ??= {d:0, cr:0}; x.d += l.d||0; x.cr += l.cr||0; }));
  return Object.entries(b).sort((a,b)=>a[0].localeCompare(b[0])).map(([c,x]) => ({c, lib:COMPTES[c]||"", d:r2(x.d), cr:r2(x.cr), solde:r2(x.d-x.cr)}));
}
function vueBalance(y){
  const rows = balance(y), tot = rows.reduce((s,r)=>({d:s.d+r.d, cr:s.cr+r.cr}),{d:0,cr:0});
  return `<div class="card noprint"><h3 style="margin-top:0">Balance des comptes ${y}</h3><div class="tablewrap"><table>
    <tr><th>Compte</th><th>Libellé</th><th class="n">Débit</th><th class="n">Crédit</th><th class="n">Solde</th></tr>
    ${rows.map(r=>`<tr><td>${r.c}</td><td>${esc(r.lib)}</td><td class="n">${eur(r.d)}</td><td class="n">${eur(r.cr)}</td><td class="n">${eur(Math.abs(r.solde))} ${r.solde>=0.005?"D":r.solde<=-0.005?"C":""}</td></tr>`).join("")}
    <tr class="tot"><td></td><td>Total</td><td class="n">${eur(tot.d)}</td><td class="n">${eur(tot.cr)}</td><td></td></tr>
  </table></div><p class="sub" style="margin:8px 0 0">Reconstituée à partir des écritures : le compte 512 (banque) ne suit que les mouvements liés à la location, sans solde d'ouverture.</p></div>`;
}
/* Fichier des écritures comptables (art. A.47 A-1 du LPF) : 18 colonnes, tabulations, ISO-8859-15 */
function exporterFEC(y){
  const num = v => (v||0).toFixed(2).replace(".", ","), dt = d => d.replace(/-/g,"");
  const net = t => String(t||"").replace(/[\t\r\n|]+/g," ").trim();
  const JL = {AN:"A-nouveaux", BQ:"Banque", OD:"Opérations diverses"};
  const cols = ["JournalCode","JournalLib","EcritureNum","EcritureDate","CompteNum","CompteLib","CompAuxNum","CompAuxLib","PieceRef","PieceDate","EcritureLib","Debit","Credit","EcritureLet","DateLet","ValidDate","Montantdevise","Idevise"];
  const ecr = ecrituresComptables(y).sort((a,b)=>a.date.localeCompare(b.date) || (a.journal==="AN"?-1:b.journal==="AN"?1:0));
  const lignes = [cols.join("\t")];
  ecr.forEach((e,i) => e.lignes.forEach(l => lignes.push([e.journal, JL[e.journal], String(i+1).padStart(6,"0"), dt(e.date), l.c, net(COMPTES[l.c]), "", "", net(e.piece||e.journal+(i+1)), dt(e.date), net(e.lib), num(l.d), num(l.cr), "", "", dt(e.date), "", ""].join("\t"))));
  const txt = lignes.join("\r\n") + "\r\n";
  // Encodage ISO-8859-15 (€, œ, Œ ont leur propre code ; le reste du Latin-1 est identique)
  const spec = {"€":0xA4, "Œ":0xBC, "œ":0xBD, "Š":0xA6, "š":0xA8, "Ž":0xB4, "ž":0xB8, "Ÿ":0xBE, "’":0x27, "‘":0x27, "«":0xAB, "»":0xBB};
  const bytes = new Uint8Array([...txt].map(ch => spec[ch] ?? (ch.charCodeAt(0) < 256 ? ch.charCodeAt(0) : 0x3F)));
  const siren = (S.data.dossier.siren||"").padStart(9,"0").slice(-9);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([bytes], {type:"text/plain;charset=iso-8859-15"}));
  a.download = `${siren}FEC${y}1231.txt`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  toast(`FEC ${y} téléchargé : ${lignes.length-1} lignes.`);
}

/* ============ Justificatifs ============ */
function pieceRequise(e){ return !e.sansPiece && (NATURES[e.nature]?.piece !== false); }
function piecesManquantes(y){ const ex = S.data && exercice(y); return (ex && ex.ecritures ? ex.ecritures : []).filter(e => pieceRequise(e) && !e.piece); }
function findEcr(id){ for(const ex of Object.values(S.data.exercices)) { const e = (ex.ecritures||[]).find(x=>x.id===id); if(e) return e; } }
function cellPiece(e){
  if(e.piece) return `<button class="btn small sec pj" title="${esc(e.piece)}" style="color:var(--accent)" onclick="ouvrirPiece('${e.id}')">📎 Voir</button>`;
  if(!pieceRequise(e)) return `<span class="pill" title="${e.sansPiece?"Marquée sans justificatif":"Pas de justificatif nécessaire pour cette nature"}">non requise</span>`;
  return `<button class="btn small sec pj" onclick="attacherPiece('${e.id}')">Ajouter</button>`;
}
const slug = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,30) || "piece";
async function dossierRequis(){
  if(!S.dir){ alert("Les justificatifs sont rangés dans le dossier LMNP : ouvrez l'outil dans Chrome via « Ouvrir le dossier LMNP… »."); return false; }
  if(await S.dir.queryPermission({mode:"readwrite"}) !== "granted" && await S.dir.requestPermission({mode:"readwrite"}) !== "granted") return false;
  return true;
}
async function justifDir(y, create=true){ return (await S.dir.getDirectoryHandle("Justificatifs",{create})).getDirectoryHandle(String(y),{create}); }
async function handleDepuisChemin(chemin){
  const parts = chemin.split("/"); let d = S.dir;
  for(const p of parts.slice(0,-1)) d = await d.getDirectoryHandle(p);
  return d.getFileHandle(parts[parts.length-1]);
}
async function attacherPiece(id){
  if(!await dossierRequis()) return;
  const e = findEcr(id);
  let fh;
  try{ [fh] = await window.showOpenFilePicker({id:"pieces", types:[{description:"Justificatifs", accept:{"application/pdf":[".pdf"],"image/*":[".jpg",".jpeg",".png",".heic"]}}]}); }
  catch(err){ return; }
  const file = await fh.getFile();
  const y = yearOf(e.date), dir = await justifDir(y);
  // Fichier déjà dans Justificatifs/<année> ? on le rattache sans copie
  let dejaLa = false;
  try{ const ex = await dir.getFileHandle(file.name); dejaLa = await ex.isSameEntry(fh); }catch(_){}
  let nom = file.name;
  if(!dejaLa){
    const ext = (file.name.match(/\.[A-Za-z0-9]+$/)||[".pdf"])[0].toLowerCase();
    const base = `${e.date}_${slug(e.tiers)}_${slug(e.nature)}`;
    nom = base + ext; let k = 2;
    while(true){ try{ await dir.getFileHandle(nom); nom = `${base}-${k++}${ext}`; }catch(_){ break; } }
    const out = await dir.getFileHandle(nom,{create:true}); const w = await out.createWritable(); await w.write(file); await w.close();
  }
  e.piece = `Justificatifs/${y}/${nom}`; delete e.sansPiece;
  setDirty(); renderAll(); toast(dejaLa ? "Justificatif rattaché." : `Copié dans Justificatifs/${y}/ sous le nom « ${nom} ».`);
}
async function ouvrirPiece(id){
  const e = findEcr(id);
  if(!await dossierRequis()) return;
  try{
    const file = await (await handleDepuisChemin(e.piece)).getFile();
    const url = urlPiece(file);
    $("#vTitle").textContent = `${fmtDate(e.date)} · ${e.tiers||""} · ${e.nature} · ${eur(e.montant)}`;

/* ============ Banque : import du relevé CSV et tri ============ */
const IGNORER = "__ignorer";
const norm = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/\s+/g," ").trim();
/* Lecture CSV : guillemets, séparateur ; , ou tabulation, retours à la ligne entre guillemets */
function parseCSV(txt, sep){
  const rows = []; let row = [], f = "", q = false;
  for(let i=0;i<txt.length;i++){
    const c = txt[i];
    if(q){ if(c === '"'){ if(txt[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if(c === '"' && f.trim() === ""){ q = true; f = ""; }
    else if(c === sep){ row.push(f); f = ""; }
    else if(c === "\n" || c === "\r"){ if(c === "\r" && txt[i+1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += c;
  }
  if(f !== "" || row.length){ row.push(f); rows.push(row); }
  return rows.map(r => r.map(x => x.trim())).filter(r => r.some(x => x !== ""));
}
function lireDate(s){
  s = String(s||"").trim(); let m, d;
  if((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/))) d = `${m[1]}-${m[2]}-${m[3]}`;
  else if((m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4}|\d{2})$/))) d = `${m[3].length===2?"20"+m[3]:m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  else return null;
  const t = new Date(d+"T12:00:00");
  return !isNaN(t) && t.toISOString().slice(0,10) === d ? d : null;
}
function lireMontant(s){
  let t = String(s||"").replace(/[\s  €"']/g,"").replace(/EUR$/i,"");
  if(!t) return null;
  let neg = false;
  if(/^\(.*\)$/.test(t)){ neg = true; t = t.slice(1,-1); }
  if(/-$/.test(t)){ neg = true; t = t.slice(0,-1); }
  const c = t.lastIndexOf(","), p = t.lastIndexOf(".");
  if(c > -1 && p > -1) t = c > p ? t.replace(/\./g,"").replace(",",".") : t.replace(/,/g,"");
  else if(c > -1) t = t.replace(",",".");
  if(!/^[+-]?\d+(\.\d+)?$/.test(t)) return null;
  return neg ? -Number(t) : Number(t);
}
async function lireTexte(file){
  const buf = await file.arrayBuffer();
  try{ return new TextDecoder("utf-8",{fatal:true}).decode(buf); }
  catch(_){ return new TextDecoder("windows-1252").decode(buf); } // exports des banques françaises souvent en Latin-1
}
function analyserCSV(txt, nom){
  txt = txt.replace(/^﻿/,"");
  let best = null;
  for(const sep of [";","\t",","]){
    const rows = parseCSV(txt, sep), cnt = {};
    rows.forEach(r => { if(r.length >= 3) cnt[r.length] = (cnt[r.length]||0) + 1; });
    const top = Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
    if(top && (!best || top[1] > best.f)) best = {sep, rows, n:Number(top[0]), f:top[1]};
  }
  if(!best) throw new Error("Aucun tableau reconnu dans ce fichier. Vérifiez qu'il s'agit bien d'un export CSV du compte.");
  // Les banques ajoutent souvent des lignes d'en-tête (n° de compte, période) : on part de la première ligne datée
  const iD = best.rows.findIndex(r => r.length === best.n && r.some(lireDate));
  if(iD < 0) throw new Error("Aucune date reconnue dans ce fichier. Vérifiez qu'il s'agit bien d'un export CSV du compte.");
  const prec = best.rows[iD-1];
  const header = prec && prec.length === best.n && prec.filter(Boolean).length >= 2 ? prec : null;
  const data = best.rows.slice(iD).filter(r => r.length === best.n);
  const cols = header || data[0].map((_,i)=>"Colonne "+(i+1));
  const signature = header ? header.map(norm).join("|") : "sans-entete-"+best.n;
  const sv = S.data.banque.formatCsv;
  const map = sv && sv.signature === signature ? {...sv.map} : devinerColonnes(header, data);
  return {nom, sep:best.sep, cols, data, signature, map};
}
function devinerColonnes(header, data){
  const part = (i, fn) => data.slice(0,30).filter(r => fn(r[i])).length / Math.min(data.length,30);
  const idx = [...Array((header||data[0]).length).keys()];
  const h = re => header ? idx.find(i => re.test(norm(header[i]))) ?? -1 : -1;
  const m = {date:-1, lib:-1, lib2:-1, montant:-1, debit:-1, credit:-1, mode:"m"};
  m.date = h(/date.*op/); if(m.date < 0) m.date = h(/date/);
  if(m.date < 0) m.date = idx.find(i => part(i, lireDate) > .8) ?? -1;
  for(const re of [/libell/, /label|intitul|description/, /operation$/]){ m.lib = h(re); if(m.lib >= 0 && m.lib !== m.date) break; m.lib = -1; }
  m.montant = h(/montant|amount|somme/); m.debit = h(/debit/); m.credit = h(/credit/);
  if(m.debit >= 0 && m.credit >= 0 && m.montant < 0) m.mode = "dc";
  if(m.mode === "m" && m.montant < 0) m.montant = [...idx].reverse().find(i => i !== m.date && part(i, v => lireMontant(v) != null) > .8) ?? -1;
  if(m.lib < 0){ const lg = i => data.slice(0,30).reduce((s,r)=>s+(lireMontant(r[i])==null && !lireDate(r[i]) ? r[i].length : 0),0); m.lib = idx.filter(i=>i!==m.date).sort((a,b)=>lg(b)-lg(a))[0] ?? -1; }
  return m;
}
function operationsImport(imp){
  const m = imp.map, ops = []; let rejets = 0;
  imp.data.forEach(r => {
    const date = lireDate(r[m.date]);
    const mt = m.mode === "m" ? lireMontant(r[m.montant]) : (lireMontant(r[m.credit])||0) - Math.abs(lireMontant(r[m.debit])||0);
    const libelle = [r[m.lib], m.lib2 >= 0 ? r[m.lib2] : ""].filter(Boolean).join(" ").replace(/\s+/g," ").trim();
    if(!date || mt == null || isNaN(mt) || Math.abs(mt) < 0.005){ rejets++; return; }
    ops.push({date, libelle, montant:r2(mt)});
  });
  // Clé stable : deux opérations identiques le même jour restent distinctes (n° d'occurrence)
  const occ = {};
  ops.forEach(o => { const b = `${o.date}|${o.montant.toFixed(2)}|${norm(o.libelle)}`; occ[b] = (occ[b]||0) + 1; o.cle = b + "#" + occ[b]; });
  return {ops, rejets};
}
function clesConnues(){
  const B = S.data.banque, k = new Set();
  Object.values(S.data.exercices).forEach(ex => (ex.ecritures||[]).forEach(e => { if(e.banque) k.add(e.banque); }));
  B.aTrier.forEach(o => k.add(o.cle)); B.ignorees.forEach(o => k.add(o.cle));
  return k;
}
const MOTS_VIDES = new Set(["prlv","prelevement","prelev","sepa","vir","virement","recu","emis","inst","instantane","cb","carte","paiement","par","de","du","des","fav","faveur","en","votre","m","mr","mme","mlle","tip"]);
function motsUtiles(lib){ return norm(lib).replace(/[^a-z0-9 ]/g," ").split(" ").filter(w => w && !MOTS_VIDES.has(w) && !/^\d/.test(w) && !/^x+\d*$/.test(w)); }
const motCleSuggere = lib => motsUtiles(lib).slice(0,2).join(" ").toUpperCase();
const tiersSuggere = lib => motsUtiles(lib).slice(0,2).map(w => w[0].toUpperCase()+w.slice(1)).join(" ");
const sensOp = o => o.montant > 0 ? "credit" : "debit";
function appliquerRegles(o){
  const l = norm(o.libelle);
  const r = [...S.data.banque.regles].sort((a,b)=>b.motCle.length-a.motCle.length).find(r => r.sens === sensOp(o) && l.includes(norm(r.motCle)));
  if(r){ o.nature = r.nature; if(r.tiers) o.tiers = r.tiers; o.regle = r.motCle; }
  return o;
}
/* Écriture déjà saisie à la main : même montant, même sens, à 6 jours près */
function chercherDoublon(o){
  const ex = exercice(yearOf(o.date)); if(!ex || !ex.ecritures) return;
  const pris = new Set(S.data.banque.aTrier.filter(x => x !== o && x.doublon).map(x => x.doublon));
  const t = Date.parse(o.date), credit = o.montant > 0;
  const e = ex.ecritures.find(e => !e.banque && !pris.has(e.id) && Math.abs(e.montant - Math.abs(o.montant)) < 0.005
    && ((NATURES[e.nature]?.g === "recette") === credit) && Math.abs(Date.parse(e.date) - t) <= 6*864e5);
  if(e) o.doublon = e.id; else delete o.doublon;
}

function scinderOp(id){
  const o = trouverOp(id), tot = Math.abs(o.montant);

  if(v == null) return;

  const s = Math.sign(o.montant), B = S.data.banque, i = B.aTrier.indexOf(o);

function validerTri(){
  const B = S.data.banque, prets = B.aTrier.filter(o => o.nature);
  if(!prets.length) return alert("Aucune opération classée pour l'instant.");
  const derniere = Math.max(...Object.keys(S.data.exercices).map(Number));
  let n = 0, ign = 0; const bloques = new Set(), faites = new Set();
  for(const o of prets){
    if(o.nature === IGNORER){ B.ignorees.push({cle:o.cle, date:o.date, libelle:o.libelle, montant:o.montant}); ign++; faites.add(o); continue; }
    const y = yearOf(o.date);
    if(!exercice(y) && y > derniere) S.data.exercices[y] = {statut:"en-cours", ecritures:[]};
    if(!exercice(y) || isHistorique(y) || verrouille(y)){ bloques.add(y); continue; }
    const ex = exercice(y); ex.ecritures ??= [];
    ex.ecritures.push({id:uid(), date:o.date, tiers:o.tiers||"", nature:o.nature, montant:r2(Math.abs(o.montant)),

}

function optionsNature(o){
  const credit = o.montant > 0;
  const nats = Object.keys(NATURES).filter(n => (NATURES[n].g === "recette") === credit);
  return `<option value="">À classer…</option>${nats.map(n=>optNature(n, o.nature)).join("")}<option value="${IGNORER}" ${o.nature===IGNORER?"selected":""}>Ignorer (hors location)</option>`;
}
function vueImport(){
  const imp = S.imp, m = imp.map;
  const sel = (k, vide) => `<select onchange="majImport('${k}',this.value)">${vide?`<option value="-1">${vide}</option>`:""}${imp.cols.map((c,i)=>`<option value="${i}" ${m[k]===i?"selected":""}>${esc(c)}</option>`).join("")}</select>`;
  const {ops, rejets} = operationsImport(imp);
  const connues = clesConnues(), nouv = ops.filter(o => !connues.has(o.cle)).length;
  return entete("Importer un relevé", `Fichier « ${esc(imp.nom)} » : ${imp.data.length} lignes. Indiquez les colonnes à utiliser ; l'outil s'en souviendra pour les prochains relevés de cette banque.`) + `
  <div class="card"><div class="form">
    <label>Date de l'opération${sel("date")}</label>
    <label>Libellé${sel("lib")}</label>
    <label>Détail (facultatif)${sel("lib2","Aucun")}</label>
    <label>Montants<select onchange="majImport('mode',this.value)"><option value="m" ${m.mode==="m"?"selected":""}>Une colonne (négatif = débit)</option><option value="dc" ${m.mode==="dc"?"selected":""}>Deux colonnes Débit / Crédit</option></select></label>
    ${m.mode==="m" ? `<label>Montant${sel("montant")}</label>` : `<label>Débit${sel("debit")}</label><label>Crédit${sel("credit")}</label>`}
  </div></div>
  <div class="card"><h3>Aperçu</h3><div class="tablewrap"><table><tr><th>Date</th><th>Libellé</th><th class="n">Montant</th></tr>
    ${ops.slice(0,8).map(o=>`<tr><td>${fmtDate(o.date)}</td><td>${esc(o.libelle)}</td><td class="n" style="color:${o.montant>0?"var(--pos)":"inherit"}">${o.montant>0?"+":"−"}${eur(Math.abs(o.montant))}</td></tr>`).join("") || `<tr><td colspan="3" class="muted">Aucune ligne lisible avec ces colonnes.</td></tr>`}
  </table></div>
  <p class="sub" style="margin:12px 0 0">${ops.length} opération(s) lisible(s), dont ${nouv} nouvelle(s)${ops.length-nouv?` et ${ops.length-nouv} déjà importée(s) ou saisie(s)`:""}${rejets?`. ${rejets} ligne(s) sans date ou sans montant seront ignorées`:""}.</p></div>
  <div class="row"><button class="btn" onclick="validerImport()" ${nouv?"":"disabled"}>Ajouter ${nouv} opération(s) à trier</button><button class="btn ghost" onclick="S.imp=null;renderAll()">Annuler</button></div>`;
}
function vueBanque(){
  if(S.imp) return vueImport();
  const B = S.data.banque, list = [...B.aTrier].sort((a,b)=>a.date.localeCompare(b.date));
  const classes = list.filter(o => o.nature).length;
  const ligneOp = o => {
    const credit = o.montant > 0, e = o.doublon && findEcr(o.doublon);
    return `<div class="op ${o.nature?"classe":""}">
      <div class="d"><b>${o.date.slice(8,10)}</b>${MOIS[monthOf(o.date)-1]}<small>${yearOf(o.date)}</small></div>
      <div class="t">${esc(o.libelle)}${o.regle?`<small>Classée par la règle « ${esc(o.regle)} »</small>`:""}${o.parent?`<small>Partie d'une opération ventilée</small>`:""}</div>
      <div class="m ${credit?"recette":""}">${credit?"+":"−"}${eur(Math.abs(o.montant))}</div>
      ${e?`<div class="alert warn dbl" style="align-items:center;flex-wrap:wrap">Déjà saisie à la main le ${fmtDate(e.date)} (${esc(e.tiers||e.nature)}) ?
        <span style="margin-left:auto;display:flex;gap:6px"><button class="btn small sec" onclick="confirmerDoublon('${o.id}',true)">Oui, c'est la même</button><button class="btn small ghost" onclick="confirmerDoublon('${o.id}',false)">Non</button></span></div>`:""}
      <div class="f noprint">
        <select aria-label="Nature" onchange="majOp('${o.id}','nature',this.value)">${optionsNature(o)}</select>
        ${o.nature===IGNORER?"":`<input aria-label="Tiers" value="${esc(o.tiers)}" placeholder="Tiers" onchange="majOp('${o.id}','tiers',this.value.trim())">`}
        <button class="btn small ghost" title="Classer automatiquement les prochaines opérations au libellé semblable" onclick="memoriserRegle('${o.id}')">Mémoriser</button>
        <button class="btn small ghost" title="Couper le montant en deux lignes de natures différentes" onclick="scinderOp('${o.id}')">Ventiler</button>
      </div></div>`; };
  const libNat = n => n === IGNORER ? "Ignorer" : libNature(n);
  return entete("Banque", "Importez le relevé CSV du compte, puis classez chaque opération : une nature LMNP, ou « Ignorer » pour ce qui ne concerne pas la location. Les opérations déjà importées ne reviennent pas.") + `
  <div class="row noprint" style="margin-bottom:18px">
    <button class="btn" onclick="importerCSV()">Importer un relevé CSV…</button>
    ${list.length?`<button class="btn sec" onclick="validerTri()" ${classes?"":"disabled"}>Valider les ${classes} opération(s) classée(s)</button>`:""}
    <span style="margin-left:auto;color:var(--muted);font-size:14px">${list.length} à trier</span>
  </div>
  ${list.length ? `<section class="card month">${list.map(ligneOp).join("")}</section>`
    : `<div class="card"><p class="sub" style="margin:0">Rien à trier. Téléchargez le relevé du compte au format CSV depuis le site de la banque, puis cliquez sur « Importer un relevé CSV… ».</p></div>`}
  <div class="card"><h3>Règles mémorisées</h3>
  ${B.regles.length ? `<div class="tablewrap"><table><tr><th>Si le libellé contient</th><th>Sens</th><th>Nature</th><th>Tiers</th><th></th></tr>
    ${B.regles.map(r=>`<tr><td><input value="${esc(r.motCle)}" style="width:100%;min-width:120px" onchange="majRegle('${r.id}','motCle',this.value)"></td><td>${r.sens==="credit"?"Crédit":"Débit"}</td><td>${libNat(r.nature)}</td>
      <td>${r.nature===IGNORER?"":`<input value="${esc(r.tiers)}" style="width:100%;min-width:110px" onchange="majRegle('${r.id}','tiers',this.value)">`}</td>
      <td class="n"><button class="btn ghost small" aria-label="Supprimer la règle" title="Supprimer la règle" onclick="supprimerRegle('${r.id}')">${I_DEL}</button></td></tr>`).join("")}</table></div>`
    : `<p class="sub" style="margin:0">Aucune règle. Après avoir classé une opération, « Mémoriser » crée une règle à partir d'un mot-clé de son libellé (par exemple le nom du locataire ou du syndic).</p>`}</div>
  ${B.ignorees.length ? `<div class="card"><details><summary>${B.ignorees.length} opération(s) ignorée(s)</summary><div class="tablewrap" style="margin-top:10px"><table>
    ${B.ignorees.map((o,i)=>[o,i]).sort((a,b)=>b[0].date.localeCompare(a[0].date)).slice(0,200).map(([o,i])=>`<tr><td>${fmtDate(o.date)}</td><td>${esc(o.libelle)}</td><td class="n">${eur(o.montant)}</td><td class="n"><button class="btn small ghost" onclick="remettreATrier(${i})">Remettre à trier</button></td></tr>`).join("")}
  </table></div></details></div>` : ""}`;
}

function nouvelExercice(){
  const y = Math.max(...Object.keys(S.data.exercices).map(Number)) + 1;
  S.data.exercices[y] = {statut:"en-cours", ecritures:[]}; S.year = y; S.tab = "ecritures"; setDirty(); renderAll();
}

renderAll();
</script>
</body>
</html>
