html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:15px/1.55 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- Mise en page : menu latéral ---------- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh;background:linear-gradient(90deg,var(--surface) 247px,var(--line) 247px 248px,var(--bg) 248px)}
.side{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:18px;padding:20px 14px;background:var(--surface);border-right:1px solid var(--line);overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.brand svg{flex:none}
.logolink{display:block;color:inherit;border-radius:var(--r-sm)}
.brand .logo{display:block;height:30px;width:auto;color:var(--text);margin-bottom:2px}
.topbar .brand .logo{height:24px;margin:0}
.brand b{display:block;font-size:16px;font-weight:600;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:12.5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px}
.yearbox{padding:0 6px}
.yearbox select{width:100%;font-weight:600}
.menu{display:flex;flex-direction:column;gap:2px}
/* Le menu se tasse de lui-même quand la colonne manque de hauteur : les boutons rétrécissent (jusqu'à 28 px) au lieu de faire dépasser la colonne */
.side>*{flex-shrink:0}
.side>.menu{flex:0 1 auto;min-height:calc(var(--n, 9) * 30px + 20px)} /* --n : nombre de boutons, posé par renderAll */
.menu button,.menu .sep{flex-shrink:1}
.menu button{min-height:28px}
.side.mesure>.menu,.side.mesure .menu button{flex-shrink:0}
.menu button{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border:0;border-radius:var(--r-md);background:none;color:var(--muted);font:inherit;font-size:14.5px;text-align:left;cursor:pointer}
.menu button svg{flex:none;opacity:.85}
.menu button:hover{background:var(--surface-2);color:var(--text)}
.menu button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.menu .sep{height:1px;background:var(--line);margin:8px 10px}
.menu .grp{margin:14px 10px 4px;font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--faint)}
.badge{margin-left:auto;min-width:22px;padding:0 7px;border-radius:99px;background:var(--warn-soft);color:var(--warn);font-size:12px;font-weight:600;text-align:center;line-height:20px}
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:0 6px}
.status{font-size:12.5px;color:var(--muted);min-height:18px}
.status.warn{color:var(--warn)}
.side .status{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prefs{display:flex;gap:6px}
.prefs button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);font:inherit;font-size:12.5px;padding:5px 6px;border-radius:var(--r-md);cursor:pointer}
.prefs button:hover{color:var(--text)}
.prefs button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.todo ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:4px}
.todo li{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line)}
.todo li:last-child{border-bottom:0}
.todo li{flex-wrap:wrap}
.todo li>b{width:14px;flex:none;text-align:center}
.todo li>span{flex:1 1 240px}
.etape{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:600;margin:26px 0 10px}
.etape span{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:14px}
details.formulaires{margin-top:30px}
details.formulaires>summary{cursor:pointer;color:var(--accent);font-weight:600;margin-bottom:12px}
.cpt{font-size:12px;font-weight:500;color:var(--faint);margin-right:6px;font-variant-numeric:tabular-nums}
.topbar{display:none}
main{padding:36px 44px 80px;max-width:1080px;width:100%;min-width:0}

@media (max-width: 860px){
  .app{grid-template-columns:1fr;background:var(--bg)}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
  .topbar .brand{padding:0;margin-right:auto}
  .side{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:30;transform:translateX(-100%);transition:transform .22s ease;box-shadow:0 0 40px rgba(0,0,0,.25)}
  body.menu-open .side{transform:none}
  body.menu-open .scrim{display:block}
  .scrim{display:none;position:fixed;inset:0;background:rgba(10,15,25,.4);z-index:25}
  main{padding:22px 16px 60px}
}
@media (prefers-reduced-motion: reduce){ .side{transition:none} }
/* Menu toujours visible en entier : ajusterMenu() le resserre par paliers (c1, c2, c3) tant qu'il dépasse de la fenêtre */
.side.c1{gap:12px;padding:14px 14px}
.side.c1 .yearbox label{flex-direction:row;align-items:center;gap:10px}
.side.c1 .yearbox select{flex:1;padding:5px 8px}
.side.c1 .menu button{padding:6px 10px}
.side.c1 .menu .sep{margin:5px 10px}
.side.c1 .sidefoot{gap:8px}
.side.c1 .sidefoot .btn{padding:6px 15px}
.side.c2{gap:8px;padding:10px 14px}
.side.c2 .brand small{display:none}
.side.c2 .brand .logo{height:24px}
.side.c2 .menu{gap:0}
.side.c2 .menu button{padding:4px 10px;font-size:14px}
.side.c2 .menu .sep{margin:3px 10px}
.side.c2 .status:empty{display:none}
.side.c3{gap:6px;padding:8px 12px}
.side.c3 .menu button{padding:2px 10px;font-size:13.5px;line-height:1.4}
.side.c3 .menu .sep{margin:2px 10px}
.side.c3 .yearbox select,.side.c3 .sidefoot .btn{padding:3px 8px}
.side.c3 .prefs button{padding:3px 6px}
/* Ordinateur : la page ne défile plus, seule la zone de droite défile. Le menu reste immobile. */
@media screen and (min-width: 861px){
  html,body{height:100%;overflow:hidden}
  .app{height:100vh;height:100dvh;min-height:0;grid-template-rows:minmax(0,1fr)}
  /* Colonne accrochée aux bords haut et bas de la fenêtre : elle ne peut pas être plus haute que l'écran */
  .side{position:fixed;top:0;bottom:0;left:0;width:248px;height:auto;max-height:none}
  main{grid-column:2;max-width:none;overflow:hidden auto;overscroll-behavior:contain;padding-right:max(44px, calc(100% - 1080px + 44px))}
}
main:focus{outline:none}
/* Pas de défilement horizontal de la page : seuls les tableaux larges défilent dans leur cadre */
html,body{overflow-x:clip;overscroll-behavior-x:none}

/* ---------- Typographie ---------- */
.pagehead{margin-bottom:26px}
.pagehead h1{font-size:28px;line-height:1.2;font-weight:600;letter-spacing:-.02em;margin:0}
.pagehead p{color:var(--muted);margin:6px 0 0;max-width:64ch}
h2{font-size:20px;font-weight:600;letter-spacing:-.01em;margin:0 0 4px}
h3{font-size:16px;font-weight:600;margin:0 0 12px}
p.sub{color:var(--muted);margin:0 0 16px;max-width:70ch}
code{font-size:.92em;background:var(--surface-2);padding:1px 5px;border-radius:5px}

/* ---------- Blocs ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px 24px;margin-bottom:20px}
.card > h3:first-child{margin-top:0}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{padding:16px 18px;margin:0}
.kpi .l{color:var(--muted);font-size:13px}
.kpi .v{font-size:22px;font-weight:600;letter-spacing:-.01em;margin-top:2px}

/* ---------- Boutons et champs ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--accent-ink);border:1px solid transparent;border-radius:var(--r-md);padding:8px 15px;font:inherit;font-size:14.5px;font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.07)}
.btn.sec{background:var(--surface);color:var(--text);border-color:var(--line)}
.btn.sec:hover{background:var(--surface-2);filter:none}
.btn.ghost{background:none;color:var(--muted);border-color:transparent;padding:6px 8px}
.btn.ghost:hover{background:var(--surface-2);color:var(--text);filter:none}
.btn.small{padding:5px 11px;font-size:13px}
.btn.danger{background:var(--neg-soft);color:var(--neg)}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.btn.wide{width:100%;justify-content:center}
select,input,textarea{font:inherit;font-size:14.5px;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:8px 10px;max-width:100%}
input:focus,select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
.form{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));align-items:end}

/* ---------- Tableaux allégés ---------- */
.tablewrap{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:13px;color:var(--faint);font-weight:500;border-bottom-color:var(--line)}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}
tr.tot td{font-weight:600;border-top:1px solid var(--text);border-bottom:0}
tr.muted td{color:var(--muted)}
.case{display:inline-block;min-width:38px;text-align:center;background:var(--accent-soft);color:var(--accent);border-radius:var(--r-sm);padding:1px 7px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill{display:inline-block;font-size:12.5px;border-radius:99px;padding:2px 9px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hide{display:none!important}
details summary{cursor:pointer;color:var(--accent);font-size:13.5px}

/* ---------- Alertes ---------- */
.alerts{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:var(--r-md);padding:11px 14px;font-size:14px;margin:0}
.alert::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;margin-top:7px;background:currentColor}
.alert{margin-bottom:14px}
.alerts .alert{margin-bottom:0}
.card table + h3,.card .tablewrap + h3{margin-top:26px}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.info{background:var(--accent-soft);color:var(--accent)}
.alert.bad{background:var(--neg-soft);color:var(--neg)}
.alert.ok{background:var(--pos-soft);color:var(--pos)}

/* ---------- Tableau de bord : des loyers au résultat ---------- */
.flow{padding:26px 28px}
.flow .lead{font-size:17px;color:var(--muted);margin:0 0 4px}
.flow .big{font-size:44px;font-weight:600;letter-spacing:-.03em;line-height:1.1;margin:0}
.flow .big.neg{color:var(--neg)}
.flow .phrase{margin:10px 0 22px;color:var(--muted);max-width:62ch}
.bar{display:flex;height:30px;border-radius:8px;overflow:hidden;background:var(--surface-2)}
.bar span{display:block;height:100%;min-width:2px}
.bar span + span{border-left:2px solid var(--surface)}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:14px 18px;margin-top:16px}
.legend div{font-size:13px;color:var(--muted)}
.legend b{display:block;font-size:16px;font-weight:600;color:var(--text);margin-top:2px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:-1px}

/* ---------- Tableau de bord visuel ---------- */
.dash-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.dash-head h1{font-size:32px;font-weight:600;letter-spacing:-.02em;margin:0}
.pill.ok{background:var(--pos-soft);color:var(--pos)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.tuiles{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:20px}
.tuile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;display:flex;flex-direction:column;gap:2px}
.tuile[role=button]{cursor:pointer} .tuile[role=button]:hover{border-color:var(--accent)}
.tuile .tl{font-size:13px;color:var(--muted)} .tuile .tv{font-size:26px;font-weight:600;letter-spacing:-.02em}
.tuile .ts{font-size:12.5px;color:var(--faint)}
.tuile.fort{background:var(--accent);border-color:var(--accent)} .tuile.fort .tl,.tuile.fort .ts{color:var(--accent-ink);opacity:.8} .tuile.fort .tv{color:var(--accent-ink)}
.dash2{display:grid;gap:20px;grid-template-columns:minmax(0,1.8fr) minmax(0,1fr)}
.dash2 .card{margin-bottom:20px}
.centre{display:flex;flex-direction:column;align-items:center}
.centre h3{align-self:flex-start}
.leg{font-size:12.5px;color:var(--muted);display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.leg.col{justify-content:center;margin-top:10px}
.suivis{display:flex;gap:10px 26px;flex-wrap:wrap}
.suivi{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font-size:13px;color:var(--muted);text-align:center;width:104px}
.suivi:hover span{color:var(--accent)}
.pastilles{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.pastille{border:0;border-radius:99px;padding:7px 14px;font:inherit;font-size:13.5px;font-weight:500;cursor:pointer}
.pastille.warn{background:var(--warn-soft);color:var(--warn)} .pastille.bad{background:var(--neg-soft);color:var(--neg)} .pastille.go{background:var(--accent);color:var(--accent-ink)}
.jauge{display:flex;border-radius:99px;overflow:hidden;background:var(--surface-2)}
.jauge span{display:block;height:100%}
@media (max-width:860px){ .dash2{grid-template-columns:1fr} .tuile .tv{font-size:22px} }

/* ---------- Écritures : vues, journal, balance, grand livre ---------- */
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:3px;gap:2px}
.seg button{border:0;background:none;font:inherit;font-size:13.5px;padding:6px 14px;border-radius:7px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.mois{display:flex;gap:2px;flex-wrap:wrap;margin-left:auto}
.mois button{border:0;background:none;font:inherit;font-size:12.5px;padding:4px 7px;border-radius:6px;color:var(--muted);cursor:pointer;text-transform:capitalize}
.mois button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
table.journal td{padding:9px 10px}
table.journal tr.editing td{background:var(--accent-soft)}
td.act{white-space:nowrap}
table.balance tr.cl td{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--faint);padding-top:16px}
details.gl{padding:0}
details.gl>summary{display:flex;gap:10px;align-items:center;padding:14px 20px;color:var(--text);font-size:14.5px;list-style:none}
details.gl>summary::-webkit-details-marker{display:none}
details.gl[open]>summary{border-bottom:1px solid var(--line)}
details.gl .tablewrap{padding:4px 14px 10px}
details.gl{margin-bottom:8px}

/* ---------- Banque : dépôt et imputation ---------- */
.depot{display:flex;flex-direction:column;align-items:center;gap:4px;padding:28px 20px;margin-bottom:20px;border:2px dashed var(--line);border-radius:var(--r-lg);background:var(--surface);color:var(--muted);cursor:pointer;text-align:center}
.depot:hover,.depot.survol{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.depot b{color:var(--text);font-size:16px;font-weight:600}
.depot.petit{flex-direction:row;padding:14px 18px;gap:12px;text-align:left}
.vide{padding:26px;text-align:center;color:var(--pos);font-weight:600;background:var(--pos-soft);border-radius:var(--r-lg);margin-bottom:20px}
.op2{padding:14px 0;border-top:1px solid var(--line)}
.op2h{display:flex;gap:12px;align-items:baseline}
.op2h .d{color:var(--faint);font-size:13px;flex:none;width:42px}
.op2h .t{flex:1;font-size:14px;overflow-wrap:anywhere}
.op2h b{font-weight:600;white-space:nowrap} .op2h b.recette{color:var(--pos)}
.postes{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0 54px}
.poste{border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:13px;padding:5px 11px;border-radius:99px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.poste:not(select)::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,var(--faint))}
.poste:hover{border-color:var(--accent)}
.poste.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.poste.on::before{background:var(--accent-ink)}
select.poste{padding:5px 8px;width:auto;max-width:150px}
.poste.ign:not(.on){color:var(--muted)}
.op2.classe .op2h .t{color:var(--muted)}
.op2f{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0 0 54px}
.op2f input{min-width:160px;padding:5px 9px;font-size:13.5px}
.barresh{display:flex;flex-direction:column;gap:8px}
.bh{display:grid;grid-template-columns:minmax(120px,220px) 1fr 90px;gap:12px;align-items:center;font-size:13.5px;cursor:pointer}
.bh b{text-align:right;font-weight:600}
@media (max-width:600px){ .postes,.op2f{margin-left:0} .bh{grid-template-columns:1fr 70px} .bh div{grid-column:1/-1;order:3} }

/* ---------- Pièces ---------- */
.pieces-top{display:grid;grid-template-columns:220px 1fr;gap:20px;margin-bottom:20px;align-items:stretch}
.pc{display:grid;grid-template-columns:48px minmax(0,1fr) 110px auto;gap:10px;align-items:center;padding:10px 6px;border-top:1px solid var(--line);border-radius:8px}
.pc.survol{background:var(--accent-soft);outline:2px dashed var(--accent)}
.pc .d{color:var(--faint);font-size:13px} .pc .t{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .pc .t b{font-weight:500}
.pc .m{text-align:right;font-weight:500;white-space:nowrap} .pc .a{display:flex;gap:4px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.docs{display:flex;flex-direction:column;gap:8px}
.doc{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-md);flex-wrap:wrap}
.doc b{display:block;font-weight:600} .doc small{color:var(--muted)}
.ratt{display:flex;flex-direction:column;max-height:420px;overflow:auto}
.ratt label{display:grid;grid-template-columns:22px 50px minmax(0,1fr) auto 100px;gap:8px;align-items:center;flex-direction:row;color:var(--text);font-size:14px;padding:7px 4px;border-top:1px solid var(--line);cursor:pointer}
.ratt label.sugg{background:var(--accent-soft)}
.ratt .m{text-align:right}
@media (max-width:700px){ .pieces-top{grid-template-columns:1fr} .pc{grid-template-columns:44px minmax(0,1fr) auto} .pc .a{grid-column:1/-1} .ratt label{grid-template-columns:22px 46px minmax(0,1fr) 80px} .ratt label .chip{display:none} }

/* ---------- Immobilisations ---------- */
.frise{position:relative;padding-top:22px}
.frise .axe{position:relative;height:18px;margin-left:150px;border-bottom:1px solid var(--line);margin-bottom:8px}
.frise .axe span{position:absolute;transform:translateX(-50%);font-size:11.5px;color:var(--faint);top:0}
.fl{display:flex;align-items:center;gap:0;height:30px}
.fn{width:150px;flex:none;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:10px}
.fb{position:relative;flex:1;height:14px}
.fbar{position:absolute;top:0;height:14px;border-radius:99px;background:color-mix(in srgb, var(--c) 18%, transparent);overflow:hidden}
.fbar i{display:block;height:100%;background:var(--c);border-radius:99px}
.today{position:absolute;top:22px;bottom:0;border-left:2px dashed var(--neg);pointer-events:none}
.today span{position:absolute;top:-20px;left:4px;font-size:11px;color:var(--neg);white-space:nowrap}
.immos{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.immo{margin:0;display:flex;flex-direction:column;gap:12px}
.immo .ih{display:flex;gap:10px;align-items:center} .immo .ih b{display:block;font-weight:600} .immo .ih small{color:var(--muted)}
.immo .ib{display:flex;gap:16px;align-items:center}

@media (max-width:700px){ .corr{grid-template-columns:repeat(3,minmax(0,1fr))} .corr .cl{grid-column:1/-1} .corr .cv{text-align:left} }

/* ---------- Paramètres du dossier ---------- */

.partage{display:flex;height:34px;border-radius:8px;overflow:hidden;gap:2px;margin:6px 0 12px}
.leg.wrap{display:flex;flex-wrap:wrap;gap:6px 18px} .leg.wrap b{color:var(--text);font-weight:600;margin-left:4px}

@media (max-width:500px){ .duel{grid-template-columns:1fr} .duel b{font-size:23px} }

/* ---------- Déclaration : parcours et formulaires ---------- */
.parcours{display:flex;align-items:center;gap:0;margin-bottom:16px}
.pe{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;font:inherit;color:var(--muted);cursor:pointer;padding:6px 8px;border-radius:var(--r-md);min-width:96px}

.pe.on .pn{background:var(--accent);border-color:var(--accent);color:#fff}

.cerfa-b{padding:4px 18px 14px;overflow-x:auto}
.bande{background:var(--surface-2);margin:12px -18px 4px;padding:7px 18px;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}

  .cl{flex-wrap:wrap} .cl .lib{flex:1 1 100%;min-width:0} .cl.th .lib{display:none} .cell{width:auto;flex:1 1 0;min-width:0} .idents{grid-template-columns:1fr} }
/* ---------- États financiers ---------- */

  .cerfa,.feuille,.ef-barre,.ef-cascade,.g-bande,.cerfa-h{-webkit-print-color-adjust:exact;print-color-adjust:exact} }

/* ---------- Écritures groupées par mois ---------- */

.ecr{display:grid;grid-template-columns:44px minmax(0,1fr) 120px 236px;gap:4px 12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}

.composer{border:1px dashed var(--line);background:var(--surface-2)}
.qwrap{position:relative;margin:0 0 14px}

.qmenu kbd{font:inherit;font-size:11.5px;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--muted)}
.pj{white-space:nowrap}

/* ---------- Visionneuse ---------- */

/* ---------- Banque : opérations à trier ---------- */

.op:first-of-type{border-top:0}

.op .d b{display:block;font-size:17px;color:var(--text);font-weight:500}
.op .d small{display:block;font-size:11.5px}
.op .t{font-size:13.5px;overflow-wrap:anywhere}
.op .t small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.op .m{font-weight:500;text-align:right;white-space:nowrap}
.op .m.recette{color:var(--pos)}
.op .f{grid-column:2 / -1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.op .f select{min-width:200px}
.op .f input{flex:1;min-width:150px}
.op.classe{background:var(--surface-2)}
.op .dbl{grid-column:2 / -1;margin:0}
@media (max-width:600px){ .op{grid-template-columns:38px minmax(0,1fr) auto} .op .f select{min-width:0;flex:1} }

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:50;box-shadow:0 8px 24px rgba(10,15,25,.18);max-width:90vw}
.fiche .card h3{padding-bottom:8px;border-bottom:1px solid var(--line)}

@media print{
  .side,.topbar,.scrim,.noprint{display:none!important}
  .app{display:block}
  body{background:#fff;color:#000}
  main{padding:0;max-width:none}
  .card{border:0;padding:0;margin-bottom:18px}
}

const compteNature = n => NATURES[n]?.c || (NATURES[n] ? "" : "628000");

const libNature = n => (comptesVisibles() && compteNature(n) ? `<span class="cpt">${compteNature(n)}</span>` : "") + esc(n);

/* ============ État ============ */
const S = {data:null, dirty:false, dir:null, fileName:null, year:null, tab:"accueil", editId:null, editImmo:null, unlocked:{}};

/* ============ Utilitaires ============ */
const $ = s => document.querySelector(s);
function haut(){ window.scrollTo(0,0); const m = document.getElementById("main"); m.scrollTop = 0; m.focus({preventScroll:true}); }
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;

const uid = () => Math.random().toString(36).slice(2,10);
const yearOf = d => parseInt(String(d).slice(0,4),10);
const monthOf = d => parseInt(String(d).slice(5,7),10);
const MOIS = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const fmtDate = d => d ? d.slice(8,10)+"/"+d.slice(5,7)+"/"+d.slice(0,4) : "";

function setDirty(v=true){
  S.dirty=v; if(v) S.version = (S.version||0) + 1;
  statut(v ? (S.dir ? "Enregistrement…" : "Modifications non enregistrées") : (S.autoMsg||""), v && !S.dir);
  $("#saveBtn").disabled = !S.data;
  if(v && S.dir){ clearTimeout(S.autoT); S.autoT = setTimeout(autoSave, 1200); }
}
function statut(txt, alerte){ for(const id of ["#dirty","#statusTop"]){ const el = $(id); if(el){ el.textContent = txt; el.classList.toggle("warn", !!alerte); } } ajusterMenu(); }
/* Enregistrement automatique dans le dossier (sans demander d'autorisation) */
async function autoSave(){
  if(!S.dir || !S.dirty) return;
  try{

  }catch(e){ statut("Échec de l'enregistrement automatique : cliquez sur Enregistrer", true); }
}

function normalize(d){
  d.dossier ??= {}; d.immobilisations ??= []; d.emprunts ??= []; d.exercices ??= {};
  d.dossier.declarant ??= "1";
  d.reports ??= {};
  if(!Array.isArray(d.reports.deficits)) d.reports.deficits = [];
  d.reports.amortissementsDifferes ??= 0;
  delete d.reports.deficitsAnterieurs;
  for(const [y,ex] of Object.entries(d.exercices)){
    if(ex.ecritures) ex.ecritures.forEach(e => { e.id ??= uid(); });
  }
  d.immobilisations.forEach(i => { i.id ??= uid(); i.quotePartTerrain ??= 0; });
  d.banque ??= {};
  d.documents ??= [];
  d.banque.regles ??= []; d.banque.aTrier ??= []; d.banque.ignorees ??= [];
  d.factures ??= []; d.facturesLues ??= [];
  d.filtresEcritures ??= [];
  d.filtresEcritures.forEach(f => { if(!f.jetons){ f.jetons = jetonsDepuisObjet(f.filtre || {}); delete f.filtre; } });
  return d;
}
function newDossier(){
  const y = new Date().getFullYear();
  return normalize({format:"outil-lmnp",version:1,dossier:{nom:"Mon LMNP",regime:"reel-simplifie",debutLocationMeublee:y+"-01-01"},

}

/* ============ Calculs : amortissements ============ */
function debutLMNP(){ return S.data.dossier.debutLocationMeublee || "1900-01-01"; }
function baseAmort(i){ return r2(i.valeurOrigine * (1 - (i.quotePartTerrain||0))); }
function planAmort(i){
  const base = baseAmort(i), annuite = base / i.dureeAns;
  const y0 = yearOf(i.miseEnService), m0 = monthOf(i.miseEnService);
  const plan = []; let cumul = 0, y = y0;
  while(cumul < base - 0.005 && y < y0 + i.dureeAns + 2){
    const mois = (y === y0) ? 13 - m0 : 12;
    let dot = Math.min(annuite * mois / 12, base - cumul);
    cumul += dot;
    plan.push({annee:y, dotation:dot, cumul, vnc: base - cumul, avantLMNP: y < yearOf(debutLMNP())});
    y++;
  }
  return plan;
}
function amortAnnee(i, y){
  const plan = planAmort(i);
  const row = plan.find(p => p.annee === y);
  const prev = plan.filter(p => p.annee < y);
  const cumulDebut = prev.length ? prev[prev.length-1].cumul : 0;
  return {dotation: row ? row.dotation : 0, cumulDebut, cumulFin: cumulDebut + (row ? row.dotation : 0), base: baseAmort(i)};
}
function anneeEntreeBilan(i){ return Math.max(yearOf(i.miseEnService), yearOf(debutLMNP())); }

/* ============ Calculs : emprunt ============ */
/* Échéancier retenu pour les calculs : celui de la banque si l'utilisateur l'a choisi, sinon celui calculé d'après les paramètres du dossier */
function echeancier(l){ const b = l.source === "banque" && lignesBanque(l); return b && b.length ? b : echeancierTheorique(l); }
function lignesBanque(l){
  const L = l.echeancierBanque?.lignes; if(!L?.length) return null;
  return L.map((r,k) => ({n:k+1, date:r.date, annee:yearOf(r.date), mois:monthOf(r.date), interet:r.interet, capital:r.capital, assurance:r.assurance||0, crd:r.crd}));
}
function echeancierTheorique(l){
  const r = l.tauxAnnuel / 12;
  let m = l.mensualite;
  if(!m) m = r ? l.capital * r / (1 - Math.pow(1+r, -l.dureeMois)) : l.capital / l.dureeMois;
  const rows = []; let crd = l.capital;
  const y0 = yearOf(l.premiereEcheance), m0 = monthOf(l.premiereEcheance);
  for(let k=0;k<l.dureeMois && crd>0.005;k++){
    const interet = crd * r;
    let capital = m - interet;
    if(k === l.dureeMois-1 || capital > crd) capital = crd;
    crd -= capital;
    const mm = m0 - 1 + k;
    rows.push({n:k+1, annee: y0 + Math.floor(mm/12), mois: (mm%12)+1, interet, capital, crd, mensualite: interet + capital});
  }
  return rows;
}
function empruntAnnee(l, y){
  const rows = echeancier(l);
  const inY = rows.filter(r => r.annee === y);
  const before = rows.filter(r => r.annee <= y);
  return {interets: inY.reduce((s,r)=>s+r.interet,0), capital: inY.reduce((s,r)=>s+r.capital,0),
          crdFin: before.length ? before[before.length-1].crd : (yearOf(l.premiereEcheance) > y ? 0 : l.capital), demarre: yearOf(l.premiereEcheance) <= y};
}

/* ============ Calculs : exercice ============ */
function exercice(y){ return S.data.exercices[y]; }
function isHistorique(y){ const ex = exercice(y); return ex && ex.statut === "historique"; }
function anneesCalculees(){
  return Object.keys(S.data.exercices).map(Number).filter(y => !isHistorique(y)).sort((a,b)=>a-b);
}
function totauxEcritures(y){
  const ex = exercice(y) || {}; const t = {parNature:{}, recettes:0, c242:0, c244:0, c294:0, remb:0, inconnues:0};
  (ex.ecritures||[]).forEach(e => {
    const nat = NATURES[e.nature] || {g: e.sens === "recette" ? "recette" : "charge", l: e.sens==="recette"?"218":"242", inconnue:true};
    if(nat.inconnue) t.inconnues++;
    t.parNature[e.nature] = (t.parNature[e.nature]||0) + e.montant;
    if(nat.g === "recette") t.recettes += e.montant;
    else if(nat.g === "bilan") t.remb += e.montant;
    else if(nat.l === "244") t.c244 += e.montant;
    else if(nat.l === "294") t.c294 += e.montant;
    else t.c242 += e.montant;
  });
  return t;
}
function calculAnnee(y){
  const t = totauxEcritures(y);
  const lmnpActif = y >= yearOf(debutLMNP());
  // Intérêts : réels si saisis, sinon échéancier
  let interetsEch = 0, capitalEch = 0, crd = 0;
  S.data.emprunts.forEach(l => { const a = empruntAnnee(l,y); interetsEch += a.interets; capitalEch += a.capital; crd += a.crdFin; });
  const interetsSaisis = (t.parNature["Intérêts emprunt"]||0) > 0;
  const interets = interetsSaisis ? t.c294 : t.c294 + interetsEch;
  const ex = exercice(y) || {};
  const crdRetenu = (ex.crdBanque != null && ex.crdBanque !== "") ? Number(ex.crdBanque) : crd;
  // Amortissements
  const immos = S.data.immobilisations.map(i => ({i, a: amortAnnee(i,y), entree: anneeEntreeBilan(i)}));
  const dotations = immos.reduce((s,x)=> s + (x.entree <= y ? x.a.dotation : 0), 0);
  const produits = t.recettes;
  const resultatAvantAmort = produits - t.c242 - t.c244 - interets;
  const resultatComptable = resultatAvantAmort - dotations;
  return {y, t, lmnpActif, produits, c242:t.c242, c244:t.c244, interets, interetsEch, interetsSaisis, capitalEch,
          crdEch:crd, crd:crdRetenu, dotations, immos, resultatAvantAmort, resultatComptable};
}
/* Chaîne fiscale (art. 39 C : les amortissements ne peuvent pas créer ou augmenter un déficit) */
function fiscalJusqua(yCible){
  let ard = Number(S.data.reports.amortissementsDifferes)||0;
  let deficits = (S.data.reports.deficits||[]).map(d => ({...d}));
  let res = null;
  for(const y of anneesCalculees()){
    if(y > yCible) break;
    const c = calculAnnee(y);
    const ardDebut = ard, deficitsDebut = deficits.map(d=>({...d}));
    // déficits périmés
    const perimes = deficits.filter(d => y - d.annee > DUREE_DEFICIT);
    deficits = deficits.filter(d => y - d.annee <= DUREE_DEFICIT);
    let R0 = c.resultatAvantAmort, dotDeductible = 0, ardUtilise = 0, ardNouveau = 0, deficitAnnee = 0;
    if(R0 <= 0){
      ardNouveau = c.dotations; deficitAnnee = -R0;
    } else {
      dotDeductible = Math.min(c.dotations, R0);
      ardNouveau = c.dotations - dotDeductible;
      // priorité aux déficits antérieurs (limités à 10 ans), puis aux amortissements différés (sans limite)
      const defDispo = deficits.reduce((s,d)=>s+d.montant,0);
      ardUtilise = Math.min(ard, Math.max(0, R0 - dotDeductible - defDispo));
    }
    ard = ard - ardUtilise + ardNouveau;
    const resultatFiscal = R0 - dotDeductible - ardUtilise; // >= 0 si R0>0, sinon = R0 (déficit)
    // Imputation des déficits antérieurs sur le bénéfice
    let deficitsImputes = 0, reste = Math.max(resultatFiscal,0);
    deficits.sort((a,b)=>a.annee-b.annee).forEach(d => { const u = Math.min(d.montant, reste); d.montant -= u; reste -= u; deficitsImputes += u; });
    deficits = deficits.filter(d => d.montant > 0.005);
    if(deficitAnnee > 0) deficits.push({annee:y, montant:deficitAnnee});
    if(y === yCible) res = {c, R0, dotDeductible, ardUtilise, ardNouveau, ardDebut, ardFin:ard, reintegration:c.dotations - dotDeductible,
      resultatFiscal, deficitsImputes, deficitsDebut, deficitsFin:deficits.map(d=>({...d})), deficitAnnee, perimes};
  }
  return res;
}
function bilan(y){
  if(isHistorique(y)){
    const h = exercice(y).chiffres || {};
    return {historique:true, immoNettes:h.immobilisationsNettes, crd:h.capitalRestantDu, capital:h.capitalExploitant, resultat:h.resultat};
  }
  const c = calculAnnee(y);
  let brut = 0, amort = 0;
  const lignes = {terrain:{}, construction:{}, travaux:{}, mobilier:{}};
  for(const k in lignes) lignes[k] = {brutDebut:0, aug:0, brutFin:0, amDebut:0, dot:0, amFin:0};
  S.data.immobilisations.forEach(i => {
    const entree = anneeEntreeBilan(i); if(entree > y) return;
    const a = amortAnnee(i,y);
    const terrain = r2(i.valeurOrigine - baseAmort(i));
    const cat = i.categorie === "construction" ? "construction" : (i.categorie === "mobilier" ? "mobilier" : "travaux");
    const add = (L, v, isNew) => { if(isNew) L.aug += v; else L.brutDebut += v; L.brutFin += v; };
    if(terrain > 0) add(lignes.terrain, terrain, entree === y);
    add(lignes[cat], baseAmort(i), entree === y);
    lignes[cat].amDebut += (entree === y ? 0 : a.cumulDebut);
    lignes[cat].dot += a.dotation + (entree === y ? a.cumulDebut : 0);
    lignes[cat].amFin += a.cumulFin;
    brut += i.valeurOrigine; amort += a.cumulFin;
  });
  const immoNettes = brut - amort;
  return {historique:false, brut, amort, immoNettes, crd:c.crd, resultat:c.resultatComptable,
          capital: immoNettes - c.resultatComptable - c.crd, lignes};
}

/* Thème clair par défaut, sombre sur demande ; numéros de comptes affichés ou non (mémorisés sur cet appareil) */
function pref(k, d){ try{ return localStorage.getItem(k) ?? d; }catch(_){ return d; } }
function setPref(k, v){ try{ localStorage.setItem(k, v); }catch(_){} }
function themeActuel(){ return pref("theme","light") === "dark" ? "dark" : "light"; }
function appliquerTheme(t){ if(t === "dark") document.documentElement.dataset.theme = "dark"; else document.documentElement.removeAttribute("data-theme"); }
appliquerTheme(themeActuel());
$("#themeBtn").addEventListener("click", () => { const t = themeActuel() === "dark" ? "light" : "dark"; setPref("theme", t); appliquerTheme(t); renderAll(); });
function comptesVisibles(){ return pref("comptes","0") === "1"; }
$("#cptBtn").addEventListener("click", () => { setPref("comptes", comptesVisibles() ? "0" : "1"); renderAll(); });
function entete(titre, sous){ return `<div class="pagehead"><h1>${titre}</h1>${sous?`<p>${sous}</p>`:""}</div>`; }

/* ============ Graphiques (SVG, sans bibliothèque) ============ */
const pctTxt = p => Math.round(p*100) + " %";
/* Anneau de progression : p entre 0 et 1 */
function anneau(p, centre, couleur="var(--accent)", taille=92){
  const r = 38, L = 2*Math.PI*r, v = Math.max(0, Math.min(1, p||0));
  return `<svg viewBox="0 0 92 92" width="${taille}" height="${taille}" role="img" aria-label="${pctTxt(v)}"><circle cx="46" cy="46" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="9"/>
    <circle cx="46" cy="46" r="${r}" fill="none" stroke="${couleur}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(v*L).toFixed(1)} ${L.toFixed(1)}" transform="rotate(-90 46 46)"/>
    <text x="46" y="51" text-anchor="middle" font-size="17" font-weight="600" fill="var(--text)">${centre}</text></svg>`;
}
/* Anneau découpé en parts : [[libellé, valeur, couleur]] */
function donut(parts, centre, sous){
  const tot = parts.reduce((s,p)=>s+Math.max(0,p[1]),0) || 1, r = 60, L = 2*Math.PI*r; let off = 0;
  return `<svg viewBox="0 0 160 160" width="170" height="170" role="img"><circle cx="80" cy="80" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="22"/>
    ${parts.filter(p=>p[1]>0.5).map(([l,v,col]) => { const d = v/tot*L, s = `<circle cx="80" cy="80" r="${r}" fill="none" stroke="${col}" stroke-width="22" stroke-dasharray="${Math.max(0,d-1.5).toFixed(1)} ${L.toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}" transform="rotate(-90 80 80)"><title>${l} : ${eur0(v)}</title></circle>`; off += d; return s; }).join("")}
    <text x="80" y="78" text-anchor="middle" font-size="20" font-weight="600" fill="var(--text)">${centre}</text><text x="80" y="98" text-anchor="middle" font-size="11.5" fill="var(--muted)">${sous}</text></svg>`;
}
/* Barres groupées par mois : séries [[libellé, couleur, valeurs[12]]] */
function barresMois(series, hauteur=170){
  const W = 640, H = hauteur, pad = 22, max = Math.max(1, ...series.flatMap(s=>s[2])), bw = (W - 10) / 12, n = series.length, b = Math.min(16, (bw - 10) / n);
  const ech = v => (H - pad - 6) * v / max;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="none" style="height:${H}px" role="img">
    <line x1="0" x2="${W}" y1="${H-pad}" y2="${H-pad}" stroke="var(--line)"/>
    ${[...Array(12).keys()].map(m => series.map(([l,col,vals],k) => { const h = ech(vals[m]||0), x = 5 + m*bw + (bw - n*b - (n-1)*3)/2 + k*(b+3);
      return h>0 ? `<rect x="${x.toFixed(1)}" y="${(H-pad-h).toFixed(1)}" width="${b.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${col}"><title>${MOIS_LONG[m]} · ${l} : ${eur(vals[m])}</title></rect>` : ""; }).join("") +
      `<text x="${(5 + m*bw + bw/2).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--faint)">${MOIS[m].replace(".","")}</text>`).join("")}
  </svg>`;
}
/* Barre de progression horizontale, segments [[valeur, couleur, titre]] sur un total */
function jauge(segs, total, h=12){
  const t = total || 1;
  return `<div class="jauge" style="height:${h}px">${segs.filter(s=>s[0]>0.005).map(([v,col,tt])=>`<span style="width:${Math.min(100,v/t*100).toFixed(2)}%;background:${col}" ${tt?`title="${esc(tt)}"`:""}></span>`).join("")}</div>`;
}
const tuile = (lib, val, opts={}) => `<div class="tuile ${opts.cls||""}" ${opts.page?`role="button" tabindex="0" onclick="allerA('${opts.page}')"`:""}><span class="tl">${lib}</span><span class="tv" style="${opts.col?`color:${opts.col}`:""}">${val}</span>${opts.sous?`<span class="ts">${opts.sous}</span>`:""}</div>`;

/* ---- Tableau de bord ---- */
function vueAccueil(){
  const y = S.year;
  if(isHistorique(y)){
    const h = exercice(y).chiffres||{};
    return entete(`${y}`, "Année reprise de l'ancien fichier Excel.") +
      `<div class="tuiles">${tuile("Loyers", eur0(h.loyers), {col:"var(--pos)"})}${tuile("Charges", eur0((h.chargesExternes||0)+(h.impotsTaxes||0)+(h.interets||0)))}${tuile("Amortissements", eur0(h.dotationsAmortissements), {col:"var(--accent)"})}${tuile("Résultat", eur0(h.resultat), {cls:"fort"})}</div>`;
  }
  const f = fiscalJusqua(y), c = f.c, ex = exercice(y), es = ex.ecritures || [];
  const amortDeduits = f.dotDeductible + f.ardUtilise, rf = f.resultatFiscal;
  const tmi = S.data.dossier.simu?.tmi ?? 0.30, impot = Math.max(0, rf - f.deficitsImputes) * (tmi + PS_REVENUS);
  const charges = c.c242 + c.c244 + c.interets;
  // Mois par mois : encaissé / payé
  const rec = Array(12).fill(0), dep = Array(12).fill(0);
  es.forEach(e => { const m = monthOf(e.date)-1, g = NATURES[e.nature]?.g || (e.sens==="recette"?"recette":"charge"); if(m<0||m>11) return; if(g==="recette") rec[m] += e.montant; else dep[m] += e.montant; });
  // Indicateurs de suivi
  const debut = y === yearOf(debutLMNP()) ? monthOf(debutLMNP()) : 1;
  const moisAttendus = [...Array(13-debut).keys()].map(i=>i+debut).filter(m => y < new Date().getFullYear() || m <= new Date().getMonth()+1);
  const moisLoyer = new Set(es.filter(e=>e.nature==="Loyer").map(e=>monthOf(e.date)));
  const loyersOk = moisAttendus.filter(m=>moisLoyer.has(m)).length;
  const aJust = es.filter(pieceRequise), justOk = aJust.filter(e=>e.piece).length;
  const aTrier = (S.data.banque?.aTrier||[]).filter(o=>yearOf(o.date)===y).length;
  const immos = S.data.immobilisations, baseTot = immos.reduce((s,i)=>s+baseAmort(i),0), amortiTot = immos.reduce((s,i)=>s+amortAnnee(i,y).cumulFin,0);
  const pret = S.data.emprunts[0], crd = c.crd, capPret = S.data.emprunts.reduce((s,l)=>s+l.capital,0);
  const snap = ex.cloture, change = snap && Math.abs(snap.resultatFiscal - rf) > 0.5;
  const enCours = y >= new Date().getFullYear() && ex.statut !== "cloture";
  const suivi = (p, centre, lib, page, col) => `<div class="suivi" role="button" tabindex="0" onclick="allerA('${page}')">${anneau(p, centre, col)}<span>${lib}</span></div>`;
  return `<div class="dash-head"><h1>${y}</h1>${ex.statut==="cloture"?'<span class="pill ok">clôturé</span>':enCours?'<span class="pill">en cours</span>':'<span class="pill warn">à déclarer</span>'}</div>
    ${change?`<div class="alert bad">Résultat modifié depuis la clôture : ${eur0(snap.resultatFiscal)} déclarés, ${eur0(rf)} maintenant.</div>`:""}
    ${!c.lmnpActif?`<div class="alert info">Location meublée à partir du ${fmtDate(debutLMNP())}.</div>`:""}
    ${aFaire(y)}
    <div class="tuiles">
      ${tuile("Loyers encaissés", eur0(c.produits), {col:"var(--pos)", page:"ecritures"})}
      ${tuile("Charges", eur0(charges), {page:"ecritures", sous:`dont intérêts ${eur0(c.interets)}`})}
      ${tuile("Amortissements", eur0(amortDeduits), {col:"var(--accent)", page:"immos", sous:f.ardFin>0.5?`+ ${eur0(f.ardFin)} en réserve`:"déduits cette année"})}
      ${tuile(rf<0?"Déficit":"Revenu imposable", eur0(rf), {cls:"fort", col:rf<0?"var(--neg)":"", page:"declaration", sous:rf>0?`impôt ≈ ${eur0(impot)}`:"aucun impôt"})}
    </div>
    <div class="dash2">
      <div class="card"><div class="row" style="justify-content:space-between;margin-bottom:8px"><h3 style="margin:0">Mois par mois</h3>
        <span class="leg"><i style="background:var(--pos)"></i>Encaissé <i style="background:var(--seg-1)"></i>Payé</span></div>
        ${barresMois([["Encaissé","var(--pos)",rec],["Payé","var(--seg-1)",dep]])}</div>
      <div class="card centre"><h3>Où vont les loyers</h3>
        ${donut([["Charges",c.c242,"var(--seg-1)"],["Taxes",c.c244,"var(--seg-2)"],["Intérêts",c.interets,"var(--seg-3)"],["Amortissements",amortDeduits,"var(--accent)"],["Imposable",Math.max(rf,0),"var(--pos)"]], eur0(c.produits), "de loyers")}
        <div class="leg col"><span><i style="background:var(--seg-1)"></i>Charges</span><span><i style="background:var(--seg-2)"></i>Taxes</span><span><i style="background:var(--seg-3)"></i>Intérêts</span><span><i style="background:var(--accent)"></i>Amortissements</span><span><i style="background:var(--pos)"></i>Imposable</span></div></div>
    </div>
    <div class="card"><h3>Suivi</h3><div class="suivis">
      ${suivi(moisAttendus.length?loyersOk/moisAttendus.length:1, `${loyersOk}/${moisAttendus.length}`, "Loyers saisis", "ecritures", loyersOk===moisAttendus.length?"var(--pos)":"var(--warn)")}
      ${suivi(aJust.length?justOk/aJust.length:1, aJust.length?pctTxt(justOk/aJust.length):"✓", "Justificatifs", "pieces", justOk===aJust.length?"var(--pos)":"var(--warn)")}
      ${suivi(aTrier?0:1, aTrier||"✓", aTrier?"Opérations à trier":"Relevé trié", "banque", aTrier?"var(--warn)":"var(--pos)")}
      ${baseTot?suivi(amortiTot/baseTot, pctTxt(amortiTot/baseTot), "Logement amorti", "immos"):""}
      ${pret&&capPret?suivi(1-crd/capPret, pctTxt(1-crd/capPret), "Prêt remboursé", "emprunt"):""}
    </div></div>`;
}
/* « À faire » : pastilles courtes, chacune ouvre la bonne page */
function aFaire(y){
  const ex = exercice(y), c = calculAnnee(y), es = ex.ecritures || [], out = [];
  if(!c.lmnpActif) return "";
  const bad = controles(y).filter(x=>x[0]==="bad").length;
  const aTrier = (S.data.banque?.aTrier||[]).filter(o=>yearOf(o.date)===y).length;
  const pm = piecesManquantes(y).length;
  if(bad) out.push(["bad", `${bad} erreur${bad>1?"s":""} à corriger`, "declaration"]);
  if(aTrier) out.push(["warn", `${aTrier} opération${aTrier>1?"s":""} à trier`, "banque"]);
  if(pm) out.push(["warn", `${pm} justificatif${pm>1?"s":""} manquant${pm>1?"s":""}`, "pieces"]);
  const fa = facturesEnAttente().length;
  if(fa) out.push(["warn", `${fa} facture${fa>1?"s":""} reçue${fa>1?"s":""} à rattacher`, "pieces"]);
  if(c.produits > 5000 && !c.t.parNature["CFE"]) out.push(["warn", "CFE à saisir", "ecritures"]);
  if(S.data.emprunts.length && (ex.crdBanque == null || ex.crdBanque === "") && y < new Date().getFullYear()) out.push(["warn", "Capital restant dû à saisir", "emprunt"]);
  if(y < new Date().getFullYear() && ex.statut !== "cloture") out.push(["go", `Déclarer ${y}`, "declaration"]);
  if(!out.length) return "";
  return `<div class="pastilles">${out.map(([k,t,pg])=>`<button class="pastille ${k}" onclick="allerA('${pg}')">${t} →</button>`).join("")}</div>`;
}
function kpi(l,v,signe){ return `<div class="card kpi"><div class="l">${l}</div><div class="v" style="${signe&&v<0?'color:var(--neg)':''}">${eur(v)}</div></div>`; }

/* ---- Écritures ---- */
function verrouille(y){ return exercice(y)?.statut === "cloture" && !S.unlocked[y]; }
const MOIS_LONG = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const svgI = d => `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const I_EDIT = svgI('<path d="M5 19h3l10-10-3-3L5 16zM13 7l3 3"/>'), I_DEL = svgI('<path d="M6 7h12M10 7V5h4v2M8 7l1 12h6l1-12"/>'), I_CLIP = svgI('<path d="M16 8l-6.5 6.5a2 2 0 0 0 3 3L19 11a4 4 0 0 0-6-6l-7 7a6 6 0 0 0 9 9l5-5"/>');
function piecesLigne(e){
  if(e.piece) return `<button class="btn ghost small pj" style="color:var(--accent)" title="${esc(e.piece)}" onclick="ouvrirPiece('${e.id}')">${I_CLIP}Voir</button>`;
  if(!pieceRequise(e)) return "";
  return `<button class="btn ghost small pj" style="color:var(--warn)" onclick="attacherPiece('${e.id}')">${I_CLIP}Ajouter le justificatif</button>`;
}
/* Couleur d'une nature, pour les pastilles et graphiques */
const COUL_GROUPE = {recette:"var(--pos)", charge:"var(--seg-3)", bilan:"var(--faint)"};
const grpNature = e => NATURES[e.nature]?.g || (e.sens==="recette"?"recette":"charge");
const chipNature = n => `<span class="chip" style="--c:${COUL_GROUPE[NATURES[n]?.g||"charge"]}">${libNature(n)}</span>`;
/* Sélecteur de vue (onglets segmentés) */
const segments = (cle, opts, val) => `<div class="seg noprint" role="tablist">${opts.map(([k,l])=>`<button role="tab" aria-selected="${k===val}" class="${k===val?"on":""}" onclick="S['${cle}']='${k}';renderAll()">${l}</button>`).join("")}</div>`;
function vueEcritures(){

  if(isHistorique(y)) return entete(`Écritures ${y}`) + `<div class="alert info">Année reprise de l'Excel : pas d'écritures détaillées.</div>`;
  const ex = exercice(y); ex.ecritures ??= [];
  const vue = S.vueEcr || "journal", lock = verrouille(y);
  const ed = S.editId ? ex.ecritures.find(e=>e.id===S.editId) : null;
  const ouvert = !lock && (S.composer || ed);
  const t = totauxEcritures(y);
  const tete = `<div class="row" style="justify-content:space-between;margin-bottom:16px"><div class="pagehead" style="margin:0"><h1>Écritures ${y}</h1></div>
    ${segments("vueEcr", [["journal","Écritures"],["balance","Balance"],["grandlivre","Grand livre"]], vue)}</div>`;
  if(vue === "balance") return tete + vueBalanceVisuelle(y);
  if(vue === "grandlivre") return tete + vueGrandLivre(y);

  const J = S.fEcr || [], nbF = J.length;

  <div class="tuiles">${tuile("Encaissé", eur0(t.recettes), {col:"var(--pos)"})}${tuile("Payé", eur0(t.c242+t.c244+t.c294+t.remb))}${tuile("Écritures", ex.ecritures.length)}${tuile("Sans justificatif", piecesManquantes(y).length, {page:"pieces", col:piecesManquantes(y).length?"var(--warn)":""})}</div>
  <div class="row noprint" style="margin-bottom:14px">
    ${lock?"":`<button class="btn" onclick="S.composer=!S.composer;S.editId=null;renderAll()">${ouvert&&!ed?"Fermer":"+ Écriture"}</button>
    <button class="btn sec" onclick="dupliquerMois()">Recopier le dernier mois</button>`}
    <div class="mois noprint">${["Tout",...MOIS].map((l,i)=>`<button class="${i===mois?"on":""}" ${i&&!nbMois(i)?'style="opacity:.45"':""} onclick="S.moisEcr=${i};renderAll()">${l.replace(".","")}</button>`).join("")}</div>
  </div>
  ${ouvert ? `<div class="card composer noprint"><div class="form">
    <label>Date<input type="date" id="eDate" value="${ed?ed.date:(list.length?list[list.length-1].date:y+"-01-01")}"></label>
    <label>Tiers<input id="eTiers" list="tiersList" value="${esc(ed?ed.tiers:"")}" placeholder="Syndic, banque…"></label>
    <label>Nature<select id="eNat">${natOpts(ed?ed.nature:"Loyer")}</select></label>
    <label>Montant TTC<input id="eMont" inputmode="decimal" value="${ed?String(ed.montant).replace(".",","):""}" placeholder="0,00"></label>
    <label style="grid-column:span 2">Commentaire<input id="eCom" value="${esc(ed?.commentaire||"")}"></label>
    <div class="row"><button class="btn" onclick="saveEcriture()">${ed?"Enregistrer":"Ajouter"}</button><button class="btn ghost" onclick="S.editId=null;S.composer=false;renderAll()">Annuler</button></div>
  </div>
  <datalist id="tiersList">${[...new Set(ex.ecritures.map(e=>e.tiers).filter(Boolean))].map(t=>`<option value="${esc(t)}">`).join("")}</datalist></div>` : ""}
  ${barreRecherche(J, list)}
  <div class="card" style="padding:8px 12px">${list.length ? `<div class="tablewrap"><table class="journal">
    <tr><th>Date</th><th>Tiers</th><th>Nature</th>${comptesVisibles()?"<th>Compte</th>":""}<th class="n">Montant</th><th></th></tr>
    ${list.map(e => { const g = grpNature(e); return `<tr class="${S.editId===e.id?"editing":""}">
      <td style="white-space:nowrap">${fmtDate(e.date).slice(0,5)}</td>

    ${nbF ? totalFiltre(list) : ""}

    : `<p class="sub" style="margin:14px 8px">Aucune écriture${mois?" ce mois-ci":""}. Importez le relevé (page Banque) ou ajoutez-en une.</p>`}</div>`;
}
/* ---- Barre de recherche des écritures (façon Inqom) ----
   On tape, la barre propose des filtres (nature, tiers, montant, période, pointage, justificatif, filtres enregistrés) ;
   chaque choix devient un jeton, et les jetons se cumulent. Jetons de même type : nature, tiers et période s'additionnent
   (l'un OU l'autre) ; texte et montant se resserrent (l'un ET l'autre). Les dates sont gardées sans l'année (MM-JJ)
   pour qu'un filtre enregistré dans le dossier serve d'une année sur l'autre. */
const I_LOUPE = svgI('<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>');
const GROUPES_F = {recette:"Toutes les recettes", charge:"Toutes les charges", bilan:"Emprunt (capital)"};
const sansAccents = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const TYPES_J = {nature:"Nature", tiers:"Tiers", texte:"Contient", montant:"Montant", periode:"Période", banque:"Relevé", piece:"Justificatif"};
const OU_J = ["nature","tiers","periode"], UNIQUE_J = ["banque","piece"];
const OPS_J = {"=":"=", ">=":"≥", "<=":"≤"};
const LIB_BANQUE = {oui:"pointées", non:"non pointées"}, LIB_PIECE = {avec:"joint", manquant:"manquant", inutile:"non requis"};
function libJeton(j){
  if(j.t === "nature") return j.v.startsWith("g:") ? GROUPES_F[j.v.slice(2)] : (comptesVisibles() && compteNature(j.v) ? compteNature(j.v) + " · " : "") + j.v;
  if(j.t === "texte") return `« ${j.v} »`;
  if(j.t === "montant") return j.op === "entre" ? `${eur(j.v)} à ${eur(j.v2)}` : `${OPS_J[j.op]} ${eur(j.v)}`;
  if(j.t === "periode") return j.l;
  if(j.t === "banque") return LIB_BANQUE[j.v];
  if(j.t === "piece") return LIB_PIECE[j.v];
  return j.v;
}
const cleJeton = j => JSON.stringify([j.t, j.v, j.op, j.v2, j.du, j.au]);
function testJeton(e, j){
  switch(j.t){
    case "nature": return j.v.startsWith("g:") ? grpNature(e) === j.v.slice(2) : e.nature === j.v;
    case "tiers": return sansAccents(e.tiers) === sansAccents(j.v);
    case "texte": { const h = sansAccents([e.tiers, e.commentaire, e.libelleBanque, e.nature, compteNature(e.nature), e.piece].join(" "));
      return sansAccents(j.v).split(/\s+/).filter(Boolean).every(m => h.includes(m)); }
    case "montant": return j.op === "=" ? Math.abs(e.montant - j.v) < 0.005 : j.op === ">=" ? e.montant >= j.v - 0.004 : j.op === "<=" ? e.montant <= j.v + 0.004 : e.montant >= j.v - 0.004 && e.montant <= j.v2 + 0.004;
    case "periode": { const md = e.date.slice(5); return md >= j.du && md <= j.au; }
    case "banque": return j.v === "oui" ? !!e.banque : !e.banque;
    case "piece": return j.v === "avec" ? !!e.piece : j.v === "manquant" ? !e.piece && pieceRequise(e) : !e.piece && !pieceRequise(e);
  }
  return true;
}
function passeFiltre(e, J){
  const parType = {}; J.forEach(j => (parType[j.t] ??= []).push(j));
  return Object.entries(parType).every(([t, js]) => OU_J.includes(t) ? js.some(j => testJeton(e, j)) : js.every(j => testJeton(e, j)));
}
/* Ancienne forme des filtres enregistrés (un objet de critères) */
function jetonsDepuisObjet(F){
  const J = [], has = k => F[k] !== undefined && F[k] !== "", md = v => v.split("-").reverse().join("/");
  if(F.du || F.au){ const du = F.du || "01-01", au = F.au || "12-31"; J.push({t:"periode", du, au, l:`du ${md(du)} au ${md(au)}`}); }
  if(F.nature) J.push({t:"nature", v:F.nature});
  if(F.texte) J.push({t:"texte", v:F.texte});
  if(has("min") && has("max")) J.push({t:"montant", op:"entre", v:F.min, v2:F.max});
  else if(has("min")) J.push({t:"montant", op:">=", v:F.min}); else if(has("max")) J.push({t:"montant", op:"<=", v:F.max});
  if(F.banque) J.push({t:"banque", v:F.banque});
  if(F.piece) J.push({t:"piece", v:F.piece});
  return J;
}
/* Périodes reconnues dans la saisie : mois, trimestres, semestres, une date ou deux */
const FIN_MOIS = [31,29,31,30,31,30,31,31,30,31,30,31], p2 = n => String(n).padStart(2,"0");
function periodesTapees(q){
  const out = [], n = sansAccents(q).trim();
  if(!n) return out;
  MOIS_LONG.forEach((m, i) => { if(sansAccents(m).startsWith(n) && n.length >= 2) out.push({t:"periode", du:`${p2(i+1)}-01`, au:`${p2(i+1)}-${FIN_MOIS[i]}`, l:m}); });
  let r = n.match(/^t([1-4])$/) || n.match(/^([1-4])(?:er|e|eme)? ?trim/);
  if(r){ const k = +r[1]; out.push({t:"periode", du:`${p2(3*k-2)}-01`, au:`${p2(3*k)}-${FIN_MOIS[3*k-1]}`, l:`${k}${k===1?"er":"e"} trimestre`}); }
  r = n.match(/^s([12])$/) || n.match(/^([12])(?:er|e|eme)? ?sem/);
  if(r){ const k = +r[1]; out.push({t:"periode", du:k===1?"01-01":"07-01", au:k===1?"06-30":"12-31", l:`${k}${k===1?"er":"e"} semestre`}); }
  const d = x => { const m = x.match(/^(\d{1,2})[\/.-](\d{1,2})$/); return m && +m[2] >= 1 && +m[2] <= 12 && +m[1] >= 1 && +m[1] <= FIN_MOIS[+m[2]-1] ? `${p2(m[2])}-${p2(m[1])}` : null; };
  const fmt = v => v.split("-").reverse().join("/");
  r = n.replace(/^du /,"").split(/\s*(?:au|a|-|→)\s+|\s+-\s*|\s*–\s*/);
  if(r.length === 2 && d(r[0]) && d(r[1])){ const [a, b] = [d(r[0]), d(r[1])].sort(); out.push({t:"periode", du:a, au:b, l:`du ${fmt(a)} au ${fmt(b)}`}); }
  else if(d(n)) out.push({t:"periode", du:d(n), au:d(n), l:`le ${fmt(d(n))}`});
  return out;
}
/* Suggestions pour la saisie en cours : [{titre, items:[{jetons|filtre, type, lib}]}] */
function suggestions(q){
  const n = sansAccents(q).trim(), sv = S.data.filtresEcritures || [], groupes = [];
  const J = S.fEcr || [], deja = new Set(J.map(cleJeton));
  const it = (j, extra) => ({jetons:[j], type:TYPES_J[j.t], lib:esc(libJeton(j)), ...extra});
  const neuf = x => x.filtre || x.jetons.some(j => !deja.has(cleJeton(j)));
  const push = (titre, items) => { items = items.filter(neuf); if(items.length) groupes.push({titre, items}); };
  const ecr = Object.values(S.data.exercices).flatMap(ex => ex.ecritures || []);
  if(!n){
    push("Filtres enregistrés", sv.map(f => ({filtre:f.id, type:"Enregistré", lib:`<b>${esc(f.nom)}</b> <small style="color:var(--muted)">${esc(f.jetons.map(libJeton).join(", "))}</small>`})));
    push("Filtrer par", [it({t:"nature", v:"g:recette"}), it({t:"nature", v:"g:charge"}), it({t:"banque", v:"non"}), it({t:"piece", v:"manquant"})]);
    return groupes;
  }
  push("Filtres enregistrés", sv.filter(f => sansAccents(f.nom).includes(n)).map(f => ({filtre:f.id, type:"Enregistré", lib:`<b>${esc(f.nom)}</b>`})));
  // Montants : « 300 », « >300 », « <= 50 », « 100-500 »
  const m = n.replace(/\s/g,"").replace(/€$/,"").match(/^(>=|<=|>|<|=)?(\d+(?:[.,]\d{1,2})?)(?:(?:-|a|à)(\d+(?:[.,]\d{1,2})?))?$/);
  if(m){ const v = parseMontant(m[2]), op = {">":">=", "<":"<=", ">=":">=", "<=":"<=", "=":"="}[m[1]||""];
    if(m[3]) push("Montant", [it({t:"montant", op:"entre", v:Math.min(v, parseMontant(m[3])), v2:Math.max(v, parseMontant(m[3]))})]);
    else push("Montant", (op ? [op] : ["=", ">=", "<="]).map(o => it({t:"montant", op:o, v})));
  }
  // Natures et groupes, par nom ou par numéro de compte
  const nat = [...Object.entries(GROUPES_F).filter(([g,l]) => sansAccents(l).includes(n) || sansAccents(g).startsWith(n)).map(([g]) => "g:"+g),
    ...Object.keys(NATURES).filter(k => sansAccents(k).includes(n) || compteNature(k).startsWith(n.replace(/\s/g,"")))];
  push("Nature ou compte", nat.slice(0, 6).map(v => it({t:"nature", v})));
  // Tiers déjà saisis
  const tiers = [...new Map(ecr.filter(e => e.tiers && sansAccents(e.tiers).includes(n)).map(e => [sansAccents(e.tiers), e.tiers])).values()];
  push("Tiers", tiers.slice(0, 5).map(v => it({t:"tiers", v})));
  push("Période", periodesTapees(q).map(j => it(j)));
  // Pointage et justificatif, par mot-clé
  const mot = (...ks) => ks.some(k => k.startsWith(n) || (n.length >= 3 && k.includes(n)));
  push("Relevé bancaire", mot("pointees","pointage","releve","rapprochees","banque","non pointees") ? ["oui","non"].map(v => it({t:"banque", v})) : []);
  push("Justificatif", mot("justificatif","piece","manquant","joint","facture","sans justificatif") ? ["manquant","avec","inutile"].map(v => it({t:"piece", v})) : []);
  // Recherche libre : en tête si rien d'autre ne correspond (c'est alors ce que fait Entrée)
  push("Rechercher", [it({t:"texte", v:q.trim()}, {lib:`Tout ce qui contient <b>« ${esc(q.trim())} »</b>`})]);
  return groupes;
}

function ouvrirMenu(){ S.qOuvert = true; S.qSel ??= 0; majMenu(); }
function fermerMenu(force){ if(!force && document.activeElement?.id === "qEcr") return; S.qOuvert = false; $("#qMenu")?.classList.add("hide"); }
function majMenu(){
  const menu = $("#qMenu"); if(!menu) return;
  if(!S.qOuvert){ menu.classList.add("hide"); return; }
  const gs = suggestions(S.qEcr || ""); S.qItems = gs.flatMap(g => g.items);
  if(S.qSel >= S.qItems.length) S.qSel = 0;

    return `<div class="it ${i===S.qSel?"on":""}" role="option" aria-selected="${i===S.qSel}" onmousedown="event.preventDefault();choisirSugg(${i})" onmousemove="if(S.qSel!==${i}){S.qSel=${i};majMenu()}"><i>${x.type}</i><span>${x.lib}</span>${x.filtre?`<button class="x" title="Supprimer ce filtre enregistré" onmousedown="event.preventDefault();event.stopPropagation();supprimerFiltre('${x.filtre}')">×</button>`:""}</div>`; }).join("")).join("")

function toucheRecherche(ev){
  const n = (S.qItems || []).length;
  if(ev.key === "ArrowDown"){ ev.preventDefault(); if(!S.qOuvert) return ouvrirMenu(); S.qSel = n ? (S.qSel + 1) % n : 0; majMenu(); }
  else if(ev.key === "ArrowUp"){ ev.preventDefault(); S.qSel = n ? (S.qSel - 1 + n) % n : 0; majMenu(); }
  else if(ev.key === "Enter"){ ev.preventDefault(); if(n) choisirSugg(S.qSel || 0); else if((S.qEcr||"").trim()) ajouterJetons([{t:"texte", v:S.qEcr.trim()}]); }
  else if(ev.key === "Escape"){ if(S.qEcr){ S.qEcr = ""; ev.target.value = ""; majMenu(); } else { fermerMenu(true); ev.target.blur(); } }
  else if(ev.key === "Backspace" && !ev.target.value && (S.fEcr||[]).length){ ev.preventDefault(); retirerJeton(S.fEcr.length - 1); }
}
function choisirSugg(i){
  const x = (S.qItems || [])[i]; if(!x) return;
  if(x.filtre){ const f = S.data.filtresEcritures.find(f => f.id === x.filtre); if(f) ajouterJetons(f.jetons); }
  else ajouterJetons(x.jetons);
}
/* Après un rendu complet, on remet le curseur dans la barre, menu ouvert */
function refocusBarre(){ const el = $("#qEcr"); if(el){ el.focus(); S.qOuvert = true; majMenu(); } }
function ajouterJetons(js){
  let J = [...(S.fEcr || [])];
  js.forEach(j => {
    if(UNIQUE_J.includes(j.t)) J = J.filter(x => x.t !== j.t);
    if(!J.some(x => cleJeton(x) === cleJeton(j))) J.push({...j});
  });
  S.fEcr = J; S.qEcr = ""; S.qSel = 0; renderAll(); refocusBarre();
}
function retirerJeton(i){ S.fEcr = (S.fEcr || []).filter((_, k) => k !== i); renderAll(); refocusBarre(); }

function parseMontant(s){ return Number(String(s).replace(/\s/g,"").replace(",", ".")); }

function dupliquerMois(){
  const ex = exercice(S.year); if(!ex.ecritures.length) return alert("Aucune écriture à recopier.");
  const last = ex.ecritures.map(e=>monthOf(e.date)).reduce((a,b)=>Math.max(a,b));
  if(last === 12) return alert("Le dernier mois saisi est décembre.");
  const src = ex.ecritures.filter(e=>monthOf(e.date)===last);
  if(!confirm(`Recopier ${src.length} écriture(s) de ${MOIS[last-1]} sur ${MOIS[last]} ? Pensez à ajuster les montants qui changent (intérêts, eau…).`)) return;
  src.forEach(e => { const d = `${S.year}-${String(last+1).padStart(2,"0")}-${e.date.slice(8,10)}`;
    const valid = new Date(d).getMonth()+1 === last+1 ? d : `${S.year}-${String(last+1).padStart(2,"0")}-28`;
    ex.ecritures.push({...e, id:uid(), date:valid}); });
  setDirty(); renderAll();
}

/* ---- Amortissements consommés (déduits) et en réserve, pour la plus-value à la revente ---- */
/* Art. 150 VB III du CGI (cessions depuis le 15/02/2025) : le prix d'acquisition est minoré des amortissements
   admis en déduction ; ceux restés en réserve (art. 39 C) ne le minorent pas. */
function suiviAmortissements(yMax){
  const lignes = [];
  const hist = Object.keys(S.data.exercices).map(Number).filter(y => isHistorique(y) && y <= yMax).sort((a,b)=>a-b);
  const dotHist = hist.reduce((s,y)=>s + (Number(exercice(y).chiffres?.dotationsAmortissements)||0), 0);
  const reserveOuverture = Number(S.data.reports.amortissementsDifferes)||0;
  hist.forEach(y => lignes.push({y, historique:true, dotations:Number(exercice(y).chiffres?.dotationsAmortissements)||0}));
  // Années reprises de l'Excel : seul le total est connu = dotations déclarées − réserve encore disponible à l'ouverture
  const consommesHist = Math.max(0, dotHist - reserveOuverture);
  let cumul = consommesHist;
  anneesCalculees().filter(y => y <= yMax && y >= yearOf(debutLMNP())).forEach(y => {
    const f = fiscalJusqua(y), consommes = f.dotDeductible + f.ardUtilise;
    cumul += consommes;
    lignes.push({y, dotations:f.c.dotations, deduites:f.dotDeductible, reserveUtilisee:f.ardUtilise, consommes, cumul, reserveFin:f.ardFin});
  });
  const der = lignes.filter(l => !l.historique).pop();
  return {lignes, consommesHist, dotHist, reserveOuverture, cumul, reserveFin: der ? der.reserveFin : reserveOuverture};
}
function vueConsommes(y){
  if(isHistorique(y)) return "";
  const t = suiviAmortissements(y);
  if(!t.lignes.length) return "";
  const det = t.lignes, max = Math.max(1, ...det.map(l=>l.dotations + (l.reserveUtilisee||0)));
  const tot = t.cumul + t.reserveFin;
  return `<div class="card"><h3>Amortissements consommés et en réserve</h3>
    <div class="conso">
      <div class="centre">${donut([["Consommés", t.cumul, "var(--accent)"],["En réserve", t.reserveFin, "var(--warn)"]], eur0(tot), "amortissements")}
        <div class="leg col"><span><i style="background:var(--accent)"></i>Consommés ${eur0(t.cumul)}</span><span><i style="background:var(--warn)"></i>En réserve ${eur0(t.reserveFin)}</span></div></div>
      <div><div class="cbars">${det.map(l => l.historique ? `<div class="cb"><div class="cbs" title="${l.y} (Excel) : ${eur0(l.dotations)} de dotations"><i style="height:${(l.dotations/max*100).toFixed(1)}%;background:var(--seg-2)"></i></div><span>${l.y}</span></div>` : `<div class="cb"><div class="cbs" title="${l.y}">
          <i style="height:${(l.deduites/max*100).toFixed(1)}%;background:var(--accent)" title="Déduits : ${eur0(l.deduites)}"></i>
          <i style="height:${(l.reserveUtilisee/max*100).toFixed(1)}%;background:var(--accent-2)" title="Réserve utilisée : ${eur0(l.reserveUtilisee)}"></i>
          <i style="height:${(Math.max(0,l.dotations-l.deduites)/max*100).toFixed(1)}%;background:var(--warn)" title="Mis en réserve : ${eur0(l.dotations-l.deduites)}"></i></div><span>${l.y}</span></div>`).join("")}</div>
        <div class="leg" style="margin-top:8px"><span><i style="background:var(--accent)"></i>Déduits</span><span><i style="background:var(--accent-2)"></i>Réserve utilisée</span><span><i style="background:var(--warn)"></i>Mis en réserve</span>${det.some(l=>l.historique)?'<span><i style="background:var(--seg-2)"></i>Années Excel</span>':""}</div></div>
    </div>
    <p class="sub" style="margin:14px 0 0"><b>Consommés</b> : déduits du résultat, ils réduiront le prix d'achat retenu à la revente. <b>En réserve</b> : reportés sans limite, sans effet sur la plus-value.</p>
    <details><summary>Détail par année</summary><div class="tablewrap"><table>
    <tr><th>Année</th><th class="n">Dotations</th><th class="n">Déduites</th><th class="n">Réserve utilisée</th><th class="n">Consommés</th><th class="n">Cumul</th><th class="n">Réserve fin</th></tr>
    ${t.lignes.map(l => l.historique
      ? `<tr class="muted"><td>${l.y} <span class="pill">Excel</span></td><td class="n">${eur(l.dotations)}</td><td class="n" colspan="5"></td></tr>`
      : `<tr class="${l.y===y?"tot":""}"><td>${l.y}</td><td class="n">${eur(l.dotations)}</td><td class="n">${eur(l.deduites)}</td><td class="n">${eur(l.reserveUtilisee)}</td><td class="n">${eur(l.consommes)}</td><td class="n">${eur(l.cumul)}</td><td class="n">${eur(l.reserveFin)}</td></tr>`).join("")}
    </table></div>${t.lignes.some(l=>l.historique) ? `<p class="sub" style="margin:8px 0 0">Années Excel : ${eur(t.consommesHist)} consommés (${eur(t.dotHist)} de dotations moins ${eur(t.reserveOuverture)} en réserve à l'ouverture).</p>` : ""}</details></div>`;
}

/* Courbe du capital restant dû, avec l'année affichée mise en évidence */
function courbeCRD(l, y){
  const rows = echeancier(l), ans = [...new Set(rows.map(r=>r.annee))], W = 640, H = 200, px = 34, py = 16;
  const pts = [[yearOf(l.premiereEcheance) - 0.001, l.capital], ...ans.map(a => [a + 1, empruntAnnee(l,a).crdFin])];
  const x0 = pts[0][0], x1 = pts[pts.length-1][0], X = a => px + (a - x0) / (x1 - x0 || 1) * (W - px - 8), Y = v => py + (1 - v / (l.capital||1)) * (H - py - 24);
  const d = pts.map((p,k)=>`${k?"L":"M"}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(" ");
  const yc = Math.min(Math.max(y+1, x0), x1), vc = empruntAnnee(l, y).crdFin;
  const B = l.source !== "banque" && lignesBanque(l), bans = B ? [...new Set(B.map(r=>r.annee))] : [];
  const bq = B && [[B[0].annee - 0.001, l.echeancierBanque.capital], ...bans.map(a => [a + 1, crdBanqueFin(l, a)])].filter(p => p[0] >= x0 && p[0] <= x1).map((p,k)=>`${k?"L":"M"}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Capital restant dû">
    <path d="${d} L${X(x1)},${H-24} L${X(x0)},${H-24}Z" fill="var(--accent-soft)"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
    <line x1="${X(x0)}" x2="${X(x1)}" y1="${H-24}" y2="${H-24}" stroke="var(--line)"/>
    ${ans.filter((a,k)=>ans.length<=12||k%3===0||a===y).map(a=>`<text x="${X(a+0.5).toFixed(1)}" y="${H-7}" text-anchor="middle" font-size="11" fill="var(--faint)">${a}</text>`).join("")}
    ${bq ? `<path d="${bq}" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="5 4"/>` : ""}
    <circle cx="${X(yc).toFixed(1)}" cy="${Y(vc).toFixed(1)}" r="6" fill="var(--accent)" stroke="var(--surface)" stroke-width="2.5"/>
    <text x="${Math.min(X(yc)+10, W-90).toFixed(1)}" y="${(Y(vc)-10).toFixed(1)}" font-size="12.5" font-weight="600" fill="var(--text)">${eur0(vc)}</text>
  </svg>`;
}

async function ajouterEcheancierPret(idx, ev){
  let f = null; if(ev){ ev.preventDefault(); ev.currentTarget.classList.remove("survol"); f = ev.dataTransfer.files[0]; if(!f) return; }
  if(!await dossierRequis()) return;
  f ??= await choisirFichier(); if(!f) return;
  const l = S.data.emprunts[idx], id = await deposerDocument("echeancier", f, `Échéancier ${l.banque||"prêt"}`);
  if(id){ l.echeancierDoc = id; S.rattDoc = null; S.tab = "emprunt"; setDirty(); renderAll(); if(/\.pdf$/i.test(f.name)) await lireEcheancierPdf(idx, f); }
}
function majPret(i,k,v){ S.data.emprunts[i][k] = v; setDirty(); renderAll(); }

const PDFJS = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/";
async function textePdf(file){
  const pdfjs = await import(PDFJS + "pdf.min.mjs");
  pdfjs.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.mjs";
  const doc = await pdfjs.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  let out = "";
  for(let p = 1; p <= doc.numPages; p++){
    const items = (await (await doc.getPage(p)).getTextContent()).items.filter(i => i.str && i.str.trim()).map(i => ({s:i.str, x:i.transform[4], y:i.transform[5]}));
    // Une ligne du tableau = des morceaux à la même hauteur, lus de gauche à droite
    const lignes = [];
    items.sort((a,b) => b.y - a.y).forEach(it => { const L = lignes.find(l => Math.abs(l.y - it.y) < 2.5); L ? L.items.push(it) : lignes.push({y:it.y, items:[it]}); });
    out += lignes.map(l => l.items.sort((a,b) => a.x - b.x).map(i => i.s).join("\t")).join("\n") + "\n";
  }
  return out;
}
/* Repère les échéances (une date suivie de montants) et le rôle de chaque colonne :
   le restant dû baisse, le capital est ce qui le fait baisser, les intérêts suivent le restant dû, l'échéance en est la somme */
function lireTableauEcheancier(texte){
  const RXD = /(?<!\d)(\d{1,2})[\/.](\d{1,2})[\/.](\d{4}|\d{2})(?!\d)/g;
  const RXM = /(?<![\d,.])-?(?:\d{1,3}(?:[   .]\d{3})*,\d{2}|\d{1,3}(?:,\d{3})*\.\d{2}|\d+[.,]\d{2})(?![\d])/g;
  const montant = t => { let v = t.replace(/[   ]/g, ""); v = /,\d{2}$/.test(v) ? v.replace(/\./g, "").replace(",", ".") : v.replace(/,/g, ""); return Number(v); };
  const rows = []; let cur = null;
  for(const [nl, ligne] of String(texte).split(/\r?\n/).entries()) for(const cell of ligne.split(/\t| {2,}/)){
    const toks = [];
    const sans = cell.replace(RXD, (m, d, mo, an, pos) => { if(+mo >= 1 && +mo <= 12 && +d >= 1 && +d <= 31){ an = an.length === 2 ? "20" + an : an; toks.push({pos, d:`${an}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`}); } return "#".repeat(m.length); });
    for(const m of sans.matchAll(RXM)) toks.push({pos:m.index, m:montant(m[0])});
    toks.sort((a,b) => a.pos - b.pos).forEach(t => {
      if(t.d){ if(!cur || cur.v.length || cur.nl !== nl) rows.push(cur = {date:t.d, nl, v:[]}); }  // deux dates sur une ligne (échéance, valeur) : on garde la première
      else if(cur) cur.v.push(t.m);
    });
  }
  const freq = {}; rows.forEach(r => { if(r.v.length >= 3) freq[r.v.length] = (freq[r.v.length]||0) + 1; });
  const k = Number(Object.keys(freq).sort((a,b) => freq[b] - freq[a] || b - a)[0]);
  if(!k) throw new Error("Aucun tableau d'échéances trouvé (une date suivie d'au moins trois montants par ligne).");
  const vus = new Set(), R = rows.filter(r => r.v.length >= k && !vus.has(r.date) && vus.add(r.date)).map(r => ({date:r.date, v:r.v.slice(0, k)})).sort((a,b) => a.date.localeCompare(b.date));
  if(R.length < 3) throw new Error("Trop peu d'échéances reconnues.");
  const n = R.length, col = j => R.map(r => r.v[j]), moy = a => a.reduce((s,x) => s + x, 0) / (a.length || 1), J = [...Array(k).keys()];
  const decroit = a => a.slice(1).filter((x,i) => x <= a[i] + 0.005).length >= 0.9 * (n - 1);
  const crdJ = J.filter(j => decroit(col(j)) && moy(col(j)) > 0).sort((a,b) => moy(col(b)) - moy(col(a)))[0];
  if(crdJ == null) throw new Error("Colonne du capital restant dû introuvable.");
  const crd = col(crdJ);
  // Restant dû après l'échéance (le plus courant) ou avant
  let cap = null;
  for(const j of J) if(j !== crdJ) for(const avant of [false, true]){
    let e = 0; for(let i = 1; i < n; i++) e += Math.abs(crd[i-1] - crd[i] - R[avant ? i-1 : i].v[j]);
    e /= n - 1; if(!cap || e < cap.e) cap = {j, avant, e};
  }
  if(!cap || cap.e > 0.05) throw new Error("Colonne du capital remboursé introuvable : le restant dû ne baisse pas du capital de chaque échéance.");
  const C = col(cap.j), fin = cap.avant ? crd.map((c,i) => c - C[i]) : crd, debut = fin.map((c,i) => c + C[i]);
  const reste = J.filter(j => j !== crdJ && j !== cap.j);
  const dispersion = j => { const q = R.map((r,i) => debut[i] > 100 && r.v[j] > 0 ? r.v[j] / debut[i] : null).filter(x => x != null); if(q.length < 0.7 * n) return Infinity; const m = moy(q); return m > 0.02 ? Infinity : Math.sqrt(moy(q.map(x => (x - m) ** 2))) / m; };
  const intJ = reste.slice().sort((a,b) => dispersion(a) - dispersion(b))[0];
  if(intJ == null || dispersion(intJ) > 0.3) throw new Error("Colonne des intérêts introuvable.");
  const I = col(intJ), autres = reste.filter(j => j !== intJ);
  let totJ = null, assJ = null;
  for(const t of autres){
    const d = R.map((r,i) => r.v[t] - C[i] - I[i]);
    if(moy(d.map(Math.abs)) < 0.02){ totJ = t; break; }
    const a = autres.find(a => a !== t && moy(d.map((x,i) => Math.abs(x - R[i].v[a]))) < 0.02);
    if(a != null){ totJ = t; assJ = a; break; }
  }
  // Assurance sans colonne « échéance » pour la vérifier : seulement si le document en parle
  if(assJ == null && /assurance/i.test(texte)) assJ = autres.find(a => a !== totJ && moy(col(a)) > 0 && Math.max(...col(a)) < moy(I) + moy(C)) ?? null;
  const A = assJ == null ? R.map(() => 0) : col(assJ);
  return {capital:r2(debut[0]), colonnes:{interets:true, capital:true, assurance:assJ != null, restantDu:true, echeance:totJ != null},
    lignes:R.map((r,i) => ({date:r.date, interet:I[i], capital:C[i], assurance:A[i], crd:r2(fin[i])}))};
}
async function lireEcheancierPdf(idx, file){
  try{ toast("Lecture du tableau d'amortissement…"); appliquerEcheancierBanque(idx, await textePdf(file), "pdf"); }
  catch(e){ alert(`Le tableau n'a pas pu être lu dans ce PDF : ${e.message}\n\nVous pouvez copier le tableau depuis l'aperçu du PDF et le coller dans « Coller le tableau » sur la page Emprunt.`); }
}
async function lireEcheancierDoc(idx){
  if(!await dossierRequis()) return;
  const d = docs().find(x => x.id === S.data.emprunts[idx].echeancierDoc);

function appliquerEcheancierBanque(idx, texte, origine){
  const res = lireTableauEcheancier(texte), l = S.data.emprunts[idx], L = res.lignes, a = L[0], z = L[L.length-1];
  l.echeancierBanque = {origine, lu:new Date().toISOString().slice(0,10), capital:res.capital, colonnes:res.colonnes, lignes:L};
  S.echSrc = "comparer"; setDirty(); renderAll();
  toast(`${L.length} échéances lues, de ${MOIS[monthOf(a.date)-1]} ${yearOf(a.date)} à ${MOIS[monthOf(z.date)-1]} ${yearOf(z.date)}.`);
}
function collerEcheancier(idx){

}
function retirerEcheancierBanque(idx){
